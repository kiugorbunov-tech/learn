<p>Компьютер состоит из четырёх главных частей. Каждая отвечает за своё, и узкое место всегда одна из них.</p>
<div class="tbl"><table><thead><tr><th>Часть</th><th>Что делает</th><th>У вас на сервере</th></tr></thead><tbody>

<h3>Ядра и потоки</h3>
<ul><li><b>Ядро</b> — физический вычислитель. У вас 16.</li>
<li><b>Логический процессор</b> — каждое ядро ведёт две задачи сразу (SMT): пока одна ждёт данные из памяти, ядро работает над другой. 16 × 2 = 32.</li>
<li>Поэтому правило «DeepSeek — 22 из 32 потоков» означает около 70% процессора.</li>
<li><b>Частота 5 ГГц</b> — 5 миллиардов тактов в секунду.</li></ul>
<h3>Почему ИИ считают на видеокартах</h3>
<p>Нейросеть — это в основном умножение огромных таблиц чисел (матриц). Процессор делает такие операции десятками, видеокарта — тысячами одновременно. Модель должна целиком поместиться в видеопамять, иначе считать нельзя.</p>
<h3>Процесс и поток</h3>
<ul><li><b>Процесс</b> — запущенная программа: отдельная «комната» со своей памятью.</li>
<li><b>Поток</b> — исполнитель внутри процесса, последовательность команд для процессора.</li>
<li><b>Планировщик</b> Windows раздаёт ядра активным потокам по 15–30 мс по очереди.</li></ul>

<h3>Ловушки команды Get-Process</h3>
<ul><li>Колонка <code>CPU</code> — <b>секунды</b> процессорного времени с момента запуска, а не проценты. Секунды ÷ время работы = сколько потоков процесс держал в среднем.</li>

  ["Что произойдёт, если модель не помещается в видеопамять?", ["Будет работать, но медленнее", "Запустить её на этой видеокарте нельзя (ошибка out of memory)", "Видеокарта возьмёт память с диска автоматически", "Ничего"], 1, "Отсюда ошибка CUDA out of memory. Решения — квантизация, меньшая модель или несколько видеокарт."],

<p><b>Операционная система</b> — главная программа, которая делит между остальными процессор, память, диски и сеть. Ни одна программа не трогает железо напрямую.</p>
<h3>Паспорт процесса</h3>
<ul><li><b>PID</b> — номер процесса, уникален, пока процесс жив.</li>
<li><b>Родитель (ParentProcessId)</b> — кто его запустил. Процессы образуют дерево.</li>
<li><b>Командная строка (CommandLine)</b> — точная команда запуска. По ней почти всегда понятно, что это.</li>
<li><b>Время запуска (CreationDate)</b>.</li></ul>
<div class="ex"><b>Расследование:</b> powershell с 1997 секундами CPU. Родитель — claude.exe, запущен в 10:18:40, в командной строке make_docx. Вывод: зависший скрипт Claude. Схема для любого подозрительного процесса: PID → родитель → командная строка → время.</div>
<pre class="code">Get-CimInstance Win32_Process -Filter "ProcessId=6328" |
  Select-Object ProcessId, ParentProcessId, CreationDate, CommandLine</pre>
<h3>Права</h3>
<ul><li>Обычный пользователь не видит подробностей процессов администратора: поле CommandLine приходит пустым.</li>
<li>Пустое поле часто значит «нет прав посмотреть», а не «ничего нет».</li>
<li>LibreHardwareMonitor нужны права администратора, чтобы читать датчики процессора.</li></ul>
<h3>Службы и svchost</h3>
<p><code>svchost.exe</code> — контейнер для служб Windows. Какая служба в нём, показывает <code>Get-CimInstance Win32_Service</code>. Пример: родитель LibreHardwareMonitor — svchost со службой «Планировщик задач», потому что автозапуск сделан задачей Планировщика.</p>
<h3>Файлы и пути</h3>
<ul><li><b>Путь</b> — адрес файла: <code>C:\\Users\\user\\Desktop\\file.txt</code>.</li>
<li><b>Расширение</b> — подсказка Windows, какой программой открывать.</li>
<li><b>Текстовые</b> файлы (.py, .txt, .csv, .json) открываются Блокнотом. <b>Двоичные</b> (.exe, .png, .docx) понятны только своей программе. .docx — это zip-архив с XML внутри.</li></ul>
<h3>Кодировки</h3>
<div class="tbl"><table><thead><tr><th>Кодировка</th><th>Что умеет</th><th>Байт на русскую букву</th></tr></thead><tbody>
<tr><td>ASCII</td><td>128 символов, только латиница</td><td>нет русских</td></tr>
<tr><td>Windows-1251</td><td>256 символов, русский + латиница</td><td>1</td></tr>
<tr><td>UTF-8</td><td>все языки мира, математика, эмодзи</td><td>2</td></tr></tbody></table></div>
<p>Записали в одной кодировке, прочитали в другой — получились «кракозябры». Правило: всегда UTF-8. Пример из нашей работы: ошибка <code>'charmap' codec can't encode character '\\u2264'</code> исчезла после флага <code>python -X utf8</code>.</p>
<h3>WSL</h3>
<p><b>WSL</b> — настоящий Linux внутри Windows в лёгкой виртуальной машине. Почти весь ИИ делается под Linux, и дообучение DeepSeek идёт именно там. Лимит «22 из 32 потоков» задан в файле <code>.wslconfig</code>. Для Windows вся WSL — один процесс <code>vmmem</code>.</p>`,

3: {
 theory: `
<h3>Три языка командной строки</h3>
<div class="tbl"><table><thead><tr><th>Оболочка</th><th>Где</th><th>Пример</th></tr></thead><tbody>
<tr><td>cmd</td><td>старая командная строка Windows</td><td><code>dir</code>, <code>copy</code></td></tr>
<tr><td>PowerShell</td><td>современная оболочка Windows</td><td><code>Get-Process</code></td></tr>
<tr><td>bash</td><td>Linux, WSL, серверы, почти весь ИИ</td><td><code>ls</code>, <code>grep</code></td></tr></tbody></table></div>
<h3>Глагол-Существительное</h3>
<p>Команды PowerShell строятся как <code>Глагол-Существительное</code>: <code>Get-Process</code>, <code>Stop-Process</code>, <code>Remove-Item</code>. Глаголов несколько десятков, и они везде одинаковые.</p>
<div class="tbl"><table><thead><tr><th>Глагол</th><th>Значение</th><th>Опасность</th></tr></thead><tbody>
<tr><td>Get-</td><td>получить, показать</td><td>безопасно</td></tr><tr><td>Test-</td><td>проверить</td><td>безопасно</td></tr>
<tr><td>Set-</td><td>изменить</td><td>меняет</td></tr><tr><td>New-</td><td>создать</td><td>создаёт</td></tr>
<tr><td>Start- / Stop-</td><td>запустить / остановить</td><td>меняет</td></tr><tr><td>Remove-</td><td>удалить</td><td><b>без корзины</b></td></tr></tbody></table></div>
<p><b>Параметры</b> начинаются с дефиса: <code>Get-Process -Name python</code>. Регистр букв в PowerShell не важен.</p>
<h3>Три команды, которые находят всё остальное</h3>
<ul><li><code>Get-Command *process*</code> — найти команду по слову.</li>
<li><code>Get-Help Get-Process -Examples</code> — инструкция с примерами.</li>
<li><code>... | Get-Member</code> — какие поля есть у результата.</li></ul>
<h3>Конвейер</h3>
<p>Знак <code>|</code> передаёт результат одной команды в следующую.</p>
<pre class="code">Get-Process | Sort-Object CPU -Descending | Select-Object -First 5 Name, CPU</pre>
<div class="tbl"><table><thead><tr><th>Звено</th><th>Что делает</th></tr></thead><tbody>
<tr><td><code>Where-Object</code></td><td>фильтр: <code>Where-Object CPU -gt 100</code></td></tr>
<tr><td><code>Sort-Object</code></td><td>сортировка</td></tr><tr><td><code>Select-Object</code></td><td>колонки или первые N</td></tr>
<tr><td><code>Measure-Object</code></td><td>количество, сумма</td></tr><tr><td><code>Export-Csv</code></td><td>сохранить в файл для Excel</td></tr></tbody></table></div>
<p>Сравнения: <code>-eq</code> равно, <code>-ne</code> не равно, <code>-gt</code> больше, <code>-lt</code> меньше, <code>-like</code> по шаблону.</p>
<p>Внутри фигурных скобок <code>$_</code> означает «текущий объект на конвейере»: <code>Where-Object { $_.Threads.Count -gt 100 }</code>.</p>
<h3>PowerShell и bash</h3>
<div class="tbl"><table><thead><tr><th>Задача</th><th>PowerShell</th><th>bash</th></tr></thead><tbody>
<tr><td>файлы</td><td><code>Get-ChildItem</code></td><td><code>ls -la</code></td></tr><tr><td>файл</td><td><code>Get-Content f.txt</code></td><td><code>cat f.txt</code></td></tr>
<tr><td>поиск текста</td><td><code>Select-String</code></td><td><code>grep</code></td></tr><tr><td>процессы</td><td><code>Get-Process</code></td><td><code>ps aux</code></td></tr>
<tr><td>завершить</td><td><code>Stop-Process -Id 123</code></td><td><code>kill 123</code></td></tr><tr><td>справка</td><td><code>Get-Help</code></td><td><code>man</code></td></tr></tbody></table></div>
<p>Главное отличие: bash передаёт по конвейеру <b>текст</b>, PowerShell — <b>объекты с полями</b>.</p>
<h3>Безопасность</h3>
<ul><li>Не запускайте команду, которую не понимаете, особенно присланную в сообщении.</li>
<li>Перед <code>Remove-Item</code> запустите <code>Get-ChildItem</code> с тем же путём.</li>
<li>Параметр <code>-WhatIf</code> показывает, что произошло бы, ничего не делая.</li></ul>`,

const APP = "course";

const Store = {

      this.server = true; this.mode = "server";

      return true;

      const body = JSON.stringify(this.data);
      this._chain = this._chain.then(() => fetch("api/progress/" + APP, { method: "PUT", headers: { "Content-Type": "application/json" }, body }))
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); if (this.mode !== "server") { this.mode = "server"; updateChips(); } })
        .catch(() => { this.mode = "offline"; updateChips(); });
    }, 1000);
  },
  async initCloud() {    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      const id = user ? await user.id() : null;
      if (!db || !id) return;
      this.ref = db.doc("data/users/" + id + "/course");
      const snap = await this.ref.get();
      if (snap.exists) { const r = snap.data(); if ((r.updatedAt || 0) > (this.data.updatedAt || 0)) this.data = Object.assign({}, this.data, JSON.parse(JSON.stringify(r))); }
      this.mode = "cloud";
      if (!snap.exists && this.data.updatedAt) this.save();
      renderAll();
    } catch (e) { this.ref = null; this.mode = "local"; }
    updateChips();
  },
  save() {
    this.data.updatedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) {}
    if (this.server) { this.pushServer(); return; }
    if (!this.ref) return;
    clearTimeout(this._timer);
    this._timer = setTimeout(() => {
      const body = JSON.parse(JSON.stringify(this.data));
      this._chain = this._chain.then(() => this.ref.set(body)).catch(err => {
        if (err && ["invalid_argument", "revoked", "not_granted"].includes(err.code)) { this.ref = null; this.mode = "local"; updateChips(); }
      });
    }, 1200);
  }
};
function L(n) { return Store.data.lessons[n] || (Store.data.lessons[n] = { read: false, quizBest: 0, quizTotal: 0, tasks: [] }); }
function lessonPct(n) {
  const c = LESSONS[n]; if (!c) return 0;
  const s = Store.data.lessons[n]; if (!s) return 0;
  const parts = [s.read ? 1 : 0, c.quiz.length ? s.quizBest / c.quiz.length : 0, c.tasks.length ? s.tasks.length / c.tasks.length : 0];
  return Math.round((parts[0] * 0.2 + parts[1] * 0.4 + parts[2] * 0.4) * 100);
}
function totalPct() {
  const ns = Object.keys(LESSONS);
  return Math.round(ns.reduce((a, n) => a + lessonPct(n), 0) / (Object.keys(OUTLINE).length));
}

/* ===================== УТИЛИТЫ ===================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffleIdx = n => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function ring(p) {
  const r = 16, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 40 40" role="img" aria-label="${p}%"><circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="5"/><circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c * p / 100} ${c}" transform="rotate(-90 20 20)"/><text x="20" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fg)">${p}</text></svg>`;
}
function updateChips() {
  $("#chip-done b").textContent = totalPct() + "%";
  $("#chip-sync").textContent = ({ cloud: "Прогресс: в облаке", server: "Прогресс: на сервере", offline: "Сервер недоступен, сохраняю в браузере" }[Store.mode] || "Прогресс: этот браузер");
}
const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
function openTab(id) {
  tabs.forEach(t => { const on = t.id === id; t.setAttribute("aria-selected", on); $("#" + t.getAttribute("aria-controls")).hidden = !on; });
  if (id === "tab-stats") renderStats();
  if (id === "tab-course") renderCourse();
  window.scrollTo(0, 0);
}
tabs.forEach(t => t.addEventListener("click", () => openTab(t.id)));

/* ===================== СПИСОК УРОКОВ ===================== */
function renderCourse() {
  const p = $("#p-course");
  p.innerHTML = `<p class="lead">16 уроков в 5 блоках. В каждом уроке теория, тест и практика: вы вводите команды руками в тренажёр терминала, он проверяет и показывает, что вывел бы компьютер. Новые уроки открываются по мере того, как мы их проходим.</p>` +
    BLOCKS.map(([title, ns]) => `<div class="block"><p class="blocktitle">${esc(title)}</p><div class="lessons">${ns.map(n => {
      const ready = !!LESSONS[n], pct = lessonPct(n);
      return `<button class="lesson" data-n="${n}" ${ready ? "" : "disabled"}><span class="num">${n}</span><span><span class="t">${esc(OUTLINE[n][0])}</span><br><span class="d">${esc(OUTLINE[n][1])}${ready ? "" : " · скоро"}</span></span>${ready ? ring(pct) : '<span class="chip">скоро</span>'}</button>`;
    }).join("")}</div></div>`).join("");
  p.querySelectorAll(".lesson[data-n]:not([disabled])").forEach(b => b.onclick = () => { Store.data.current = +b.dataset.n; lessonView = "theory"; Store.save(); renderLesson(); openTab("tab-lesson"); });
}

/* ===================== УРОК ===================== */
let lessonView = "theory", quiz = null;
function renderLesson() {
  const n = Store.data.current || 1, c = LESSONS[n], s = L(n), p = $("#p-lesson");
  if (!c) { p.innerHTML = `<p class="lead">Этот урок ещё не готов.</p>`; return; }
  p.innerHTML = `<p class="blocktitle">Урок ${n} из 16</p><h2>${esc(OUTLINE[n][0])}</h2><p class="lead">${esc(OUTLINE[n][1])}</p>
    <div class="progress"><i style="width:${lessonPct(n)}%"></i></div>
    <div class="subnav" role="group" aria-label="Часть урока">
      <button data-v="theory" aria-pressed="${lessonView === "theory"}">Теория ${s.read ? "✓" : ""}</button>
      <button data-v="quiz" aria-pressed="${lessonView === "quiz"}">Тест ${s.quizTotal ? s.quizBest + "/" + c.quiz.length : ""}</button>
      <button data-v="tasks" aria-pressed="${lessonView === "tasks"}">Практика ${s.tasks.length}/${c.tasks.length}</button>
    </div><div id="lv"></div>`;
  p.querySelectorAll(".subnav button").forEach(b => b.onclick = () => { lessonView = b.dataset.v; quiz = null; renderLesson(); });
  const lv = $("#lv");
  if (lessonView === "theory") {
    lv.innerHTML = `<div class="card theory">${c.theory}</div><div class="row" style="margin-top:14px"><button class="btn primary" id="read-ok">${s.read ? "Прочитано · к тесту" : "Прочитал, перейти к тесту"}</button></div>`;
    $("#read-ok").onclick = () => { s.read = true; Store.save(); updateChips(); lessonView = "quiz"; renderLesson(); window.scrollTo(0, 0); };
  } else if (lessonView === "quiz") renderQuiz(n, lv);
  else renderTasks(n, lv);
}
function renderQuiz(n, lv) {
  const c = LESSONS[n], s = L(n);
  if (!quiz) quiz = { order: shuffleIdx(c.quiz.length), i: 0, right: 0, answered: false };
  if (quiz.i >= c.quiz.length) {
    s.quizBest = Math.max(s.quizBest, quiz.right); s.quizTotal = c.quiz.length; Store.save(); updateChips();
    lv.innerHTML = `<div class="card"><h2>${quiz.right} из ${c.quiz.length}</h2><p>${quiz.right === c.quiz.length ? "Безупречно. Переходите к практике." : quiz.right >= c.quiz.length * 0.7 ? "Хорошо. Перечитайте вопросы, где ошиблись, и переходите к практике." : "Стоит перечитать теорию и пройти тест ещё раз."}</p>
      <div class="row"><button class="btn" id="qz-again">Пройти ещё раз</button><button class="btn primary" id="qz-tasks">К практике</button></div></div>`;
    $("#qz-again").onclick = () => { quiz = null; renderLesson(); };
    $("#qz-tasks").onclick = () => { lessonView = "tasks"; quiz = null; renderLesson(); };
    return;
  }
  const [q, opts, right, why] = c.quiz[quiz.order[quiz.i]];
  const oi = shuffleIdx(opts.length);
  lv.innerHTML = `<p class="note">Вопрос ${quiz.i + 1} из ${c.quiz.length} · верно: ${quiz.right}</p><div class="card"><div class="q">${esc(q)}</div>
    <div class="opts">${oi.map(i => `<button data-i="${i}">${esc(opts[i])}</button>`).join("")}</div><div id="qz-ex" aria-live="polite"></div></div>`;
  lv.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
    if (quiz.answered) return; quiz.answered = true;
    const i = +b.dataset.i, ok = i === right;
    lv.querySelectorAll(".opts button").forEach(x => { x.disabled = true; if (+x.dataset.i === right) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong"); else quiz.right++;
    $("#qz-ex").innerHTML = `<div class="explain"><b class="${ok ? "ok" : "bad"}">${ok ? "Верно." : "Неверно."}</b> ${esc(why)}</div><div class="row" style="margin-top:12px"><button class="btn primary" id="qz-next">Дальше</button></div>`;
    const nx = $("#qz-next"); nx.focus();
    nx.onclick = () => { quiz.i++; quiz.answered = false; renderQuiz(n, lv); };
  });
}
function normalize(cmd) { return cmd.trim().replace(/\s+/g, " ").replace(/\s*\|\s*/g, " | ").replace(/^ps>\s*/i, ""); }
function renderTasks(n, lv) {
  const c = LESSONS[n], s = L(n);
  lv.innerHTML = `<p class="lead">Введите команду и нажмите Enter. Регистр букв не важен, сокращения (ls, gps, sort, select, where) тоже принимаются. Подсказки открываются по одной.</p>` +
    c.tasks.map((t, i) => `<div class="task card"><div class="goal">${s.tasks.includes(i) ? '<span class="done-mark">✓</span> ' : ""}Задание ${i + 1}. ${esc(t.goal)}</div>
      <div class="term"><div class="bar"><span>Windows PowerShell — тренажёр</span><span>${s.tasks.includes(i) ? "выполнено" : "ожидает"}</span></div>
        <div class="out" id="out-${i}"><span class="dim">Здесь появится результат.</span></div>
        <div class="in"><span>PS C:\\Users\\user&gt;</span><input id="in-${i}" aria-label="Команда для задания ${i + 1}" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div>
      <div class="row" style="margin-top:10px"><button class="btn" data-hint="${i}">Подсказка</button><button class="btn" data-ans="${i}">Показать ответ</button></div>
      <div class="hint" id="hint-${i}" aria-live="polite"></div></div>`).join("");
  c.tasks.forEach((t, i) => {
    const inp = $("#in-" + i), out = $("#out-" + i);
    let hintN = 0, history = [];
    inp.onkeydown = e => {
      if (e.key !== "Enter") return;
      const raw = inp.value; if (!raw.trim()) return;
      const cmd = normalize(raw);
      const ok = t.accept.some(r => r.test(cmd));
      history.push(`<span class="p">PS C:\\Users\\user&gt;</span> <span class="c">${esc(raw)}</span>`);
      if (ok) {
        history.push(esc(t.out), `<span class="p">✓ Верно.</span>`);
        if (!s.tasks.includes(i)) { s.tasks.push(i); Store.save(); updateChips(); }
      } else {
        history.push(`<span class="e">Тренажёр: команда не та, что нужна для этого задания. Проверьте имя команды, параметры и знак |.</span>`);
      }
      out.innerHTML = history.slice(-12).join("\n");
      out.scrollTop = out.scrollHeight;
      inp.value = "";
      if (ok) setTimeout(() => renderLessonKeepScroll(), 900);
    };
    // последняя подсказка — это ответ, её показывает отдельная кнопка
    const soft = t.hints.length > 1 ? t.hints.slice(0, -1) : t.hints;
    lv.querySelector(`[data-hint="${i}"]`).onclick = () => { hintN = Math.min(hintN + 1, soft.length); $("#hint-" + i).innerHTML = soft.slice(0, hintN).map(h => "Подсказка: " + esc(h)).join("<br>"); };
    lv.querySelector(`[data-ans="${i}"]`).onclick = () => { $("#hint-" + i).innerHTML = "Ответ: <code>" + esc(t.hints[t.hints.length - 1]) + "</code>. Наберите его сами, чтобы засчитать задание."; };
  });
}
function renderLessonKeepScroll() { const y = window.scrollY; renderLesson(); window.scrollTo(0, y); }

/* ===================== СПРАВОЧНИК ===================== */
function renderRef() {
  const p = $("#p-ref");
  p.innerHTML = `<p class="lead">Шпаргалка по командам из уроков. Ищите по названию или по смыслу.</p><input type="search" id="ref-q" placeholder="Например: процесс, удалить, порт" aria-label="Поиск по справочнику"><div class="ref-grid" id="ref-grid"></div>`;
  const fill = () => {
    const q = $("#ref-q").value.trim().toLowerCase();
    $("#ref-grid").innerHTML = REF.map(([t, rows]) => {
      const r = rows.filter(([a, b]) => !q || (a + " " + b + " " + t).toLowerCase().includes(q));
      return r.length ? `<div class="card"><h4>${esc(t)}</h4>${r.map(([a, b]) => `<div class="ref-row"><code>${esc(a)}</code><span>${esc(b)}</span></div>`).join("")}</div>` : "";
    }).join("") || `<p class="note">Ничего не найдено.</p>`;
  };
  $("#ref-q").oninput = fill; fill();
}

/* ===================== ПРОГРЕСС ===================== */
function renderStats() {
  const ready = Object.keys(LESSONS);
  const tasksDone = ready.reduce((a, n) => a + ((Store.data.lessons[n] || {}).tasks || []).length, 0);
  const tasksAll = ready.reduce((a, n) => a + LESSONS[n].tasks.length, 0);
  const quizR = ready.reduce((a, n) => a + ((Store.data.lessons[n] || {}).quizBest || 0), 0);
  const quizAll = ready.reduce((a, n) => a + LESSONS[n].quiz.length, 0);
  $("#p-stats").innerHTML = `<div class="stats">
    <div class="card stat"><div class="n">${totalPct()}%</div><div class="l">всего курса</div></div>
    <div class="card stat"><div class="n">${ready.filter(n => lessonPct(n) === 100).length} / 16</div><div class="l">уроков пройдено полностью</div></div>
    <div class="card stat"><div class="n">${quizR} / ${quizAll}</div><div class="l">верных ответов в тестах (лучшие)</div></div>
    <div class="card stat"><div class="n">${tasksDone} / ${tasksAll}</div><div class="l">команд введено верно</div></div></div>
    <div class="lessons">${ready.map(n => `<div class="lesson" style="cursor:default"><span class="num">${n}</span><span><span class="t">${esc(OUTLINE[n][0])}</span><br><span class="d">теория ${(Store.data.lessons[n] || {}).read ? "✓" : "—"} · тест ${(Store.data.lessons[n] || {}).quizBest || 0}/${LESSONS[n].quiz.length} · практика ${((Store.data.lessons[n] || {}).tasks || []).length}/${LESSONS[n].tasks.length}</span></span>${ring(lessonPct(n))}</div>`).join("")}</div>
    <p class="note" style="margin-top:16px">${({ cloud: "Прогресс хранится в облаке claude.ai.", server: "Прогресс хранится на сервере и одинаков на телефоне и компьютере." }[Store.mode] || "Прогресс хранится в этом браузере.")}</p>`;
}

/* ===================== ЗАПУСК ===================== */
function renderAll() { renderCourse(); renderLesson(); renderRef(); if (!$("#p-stats").hidden) renderStats(); updateChips(); }
Store.loadLocal();
renderAll();
Store.initServer().then(ok => { if (!ok) Store.initCloud(); });
</script>
</body></html>
