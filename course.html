const LESSONS = {

 theory: `
<p>Компьютер состоит из четырёх главных частей. Каждая отвечает за своё, и узкое место всегда одна из них.</p>
<div class="tbl"><table><thead><tr><th>Часть</th><th>Что делает</th><th>У вас на сервере</th></tr></thead><tbody>
<tr><td>Процессор (CPU)</td><td>выполняет команды программ: сложить, сравнить, перейти</td><td>Ryzen 9 9950X: 16 ядер, 32 потока</td></tr>

<h3>Ядра и потоки</h3>
<ul><li><b>Ядро</b> — физический вычислитель. У вас 16.</li>
<li><b>Логический процессор</b> — каждое ядро ведёт две задачи сразу (SMT): пока одна ждёт данные из памяти, ядро работает над другой. 16 × 2 = 32.</li>
<li>Поэтому правило «DeepSeek — 22 из 32 потоков» означает около 70% процессора.</li>
<li><b>Частота 5 ГГц</b> — 5 миллиардов тактов в секунду.</li></ul>
<h3>Почему ИИ считают на видеокартах</h3>
<p>Нейросеть — это в основном умножение огромных таблиц чисел (матриц). Процессор делает такие операции десятками, видеокарта — тысячами одновременно. Модель должна целиком поместиться в видеопамять, иначе считать нельзя.</p>
<h3>Процесс и поток</h3>
<ul><li><b>Процесс</b> — запущенная программа: отдельная «комната» со своей памятью.</li>
<li><b>Поток</b> — исполнитель внутри процесса, последовательность команд для процессора.</li>
<li><b>Планировщик</b> Windows раздаёт ядра активным потокам по 15–30 мс по очереди.</li></ul>
<div class="ex"><b>С вашего сервера:</b> 406 процессов и 8663 потока работают на 32 логических процессорах. Почти все потоки спят и ждут события, процессор им не нужен. Загрузка 100% значит, что активных потоков больше 32 и они стоят в очереди.</div>
<h3>Ловушки команды Get-Process</h3>
<ul><li>Колонка <code>CPU</code> — <b>секунды</b> процессорного времени с момента запуска, а не проценты. Секунды ÷ время работы = сколько потоков процесс держал в среднем.</li>
<li>Колонка <code>Threads</code> — список номеров потоков. Их количество — <code>.Threads.Count</code>.</li></ul>`,
 quiz: [

  ["Что показывает колонка CPU в Get-Process?", ["Процент загрузки сейчас", "Секунды процессорного времени с момента запуска", "Номер ядра", "Частоту процессора"], 1, "Это накопленные секунды. Чтобы получить среднюю нагрузку, делите их на время работы процесса."],
  ["Процесс работает 1 час (3600 с) и набрал CPU = 7200 с. Сколько потоков он держал в среднем?", ["0,5", "1", "2", "7200"], 2, "7200 ÷ 3600 = 2. Он всё время занимал два потока на 100%."],
  ["Почему ИИ считают на видеокартах?", ["Видеокарты дешевле", "Нейросеть — это умножение огромных матриц, а у видеокарты тысячи ядер для параллельных операций", "Процессор не умеет считать дробные числа", "Так требует Windows"], 1, "Матричное умножение идеально делится на тысячи одинаковых операций."],
  ["Что произойдёт, если модель не помещается в видеопамять?", ["Будет работать, но медленнее", "Запустить её на этой видеокарте нельзя (ошибка out of memory)", "Видеокарта возьмёт память с диска автоматически", "Ничего"], 1, "Отсюда ошибка CUDA out of memory. Решения — квантизация, меньшая модель или несколько видеокарт."],
  ["Почему 8663 потока работают на 32 логических процессорах?", ["Windows их сжимает", "Почти все потоки спят и ждут событий, а активные получают ядро по очереди на миллисекунды", "Остальные потоки работают на видеокарте", "Это ошибка подсчёта"], 1, "Спящий поток процессор не тратит. Планировщик переключает активные."],

<p>Команды PowerShell строятся как <code>Глагол-Существительное</code>: <code>Get-Process</code>, <code>Stop-Process</code>, <code>Remove-Item</code>. Глаголов несколько десятков, и они везде одинаковые.</p>

<p>Python — главный язык искусственного интеллекта. На нём обучают модели (библиотека PyTorch, на которой дообучается ваш DeepSeek), анализируют данные и автоматизируют рутину. Наш монитор железа тоже написан на Python. Синтаксис простой и читается почти как английский текст.</p>
<h3>Как компьютер выполняет программу</h3>
<p>Программа — это текст. Интерпретатор Python читает его <b>сверху вниз, строку за строкой</b> и выполняет каждую. Если в пятой строке ошибка, программа остановится на пятой строке, а первые четыре успеют выполниться.</p>
<h3>print — вывести на экран</h3>
<pre class="code run">print("Привет, ИИ!")

<p>Текст в кавычках называется <b>строкой</b> (str). Без кавычек Python считает это кодом: <code>print(2 + 3)</code> выведет 5.</p>

<h3>Что видит модель: токены</h3>
<p>Языковая модель читает не буквы и не слова, а <b>токены</b> — кусочки текста. Частое английское слово — обычно один токен, русское часто делится на 2–4 части. У модели словарь примерно из 100–150 тысяч токенов, и каждый токен — просто номер в этом словаре.</p>
<pre class="code run"># Упрощённо: делим текст на кусочки и даём каждому номер
text = "AI reads tokens"
vocab = {}
ids = []
for piece in text.lower().split():
    if piece not in vocab:
        vocab[piece] = len(vocab)
    ids.append(vocab[piece])
print(vocab)
print(ids)</pre>
<p>Отсюда практичные вещи: длина контекста и цена работы с ИИ считаются в токенах, а русский текст «дороже» английского по количеству токенов.</p>
<h3>Эмбеддинг: смысл в числах</h3>
<p>Номер токена превращается в <b>эмбеддинг</b> — список из тысяч чисел, «координаты смысла». Слова, близкие по смыслу, получают близкие координаты. Близость считают через косинус угла между векторами: 1 — смысл совпадает, 0 — не связано.</p>
<pre class="code run">def cosine(a, b):
    dot = sum(x * y for x, y in zip(a, b))
    norm = (sum(x * x for x in a) ** 0.5) * (sum(y * y for y in b) ** 0.5)
    return dot / norm

king, queen, pipe = [0.9, 0.8, 0.1], [0.85, 0.82, 0.15], [0.1, 0.2, 0.95]
print(round(cosine(king, queen), 3))   # близко
print(round(cosine(king, pipe), 3))    # далеко</pre>
<h3>Нейрон и слой</h3>
<p>Нейрон делает очень простую вещь: умножает входы на <b>веса</b>, складывает, добавляет сдвиг и пропускает через <b>функцию активации</b> (например, ReLU: отрицательное превращает в 0).</p>
<pre class="code run">def neuron(inputs, weights, bias):
    total = sum(i * w for i, w in zip(inputs, weights)) + bias
    return max(0, total)       # ReLU

print(neuron([1, 2, 3], [0.5, -1, 2], 1))</pre>
<p><b>Слой</b> — тысячи таких нейронов, <b>сеть</b> — десятки слоёв подряд. Всё «знание» модели — это значения весов.</p>
<h3>Параметры</h3>
<p><b>Параметры</b> — это все веса модели. «7B» значит 7 миллиардов чисел. У DeepSeek-V3 671 миллиард параметров, но он устроен как «смесь экспертов» (MoE): на каждый токен работает лишь часть сети, около 37 миллиардов. Так большая модель отвечает быстрее.</p>
<div class="ex"><b>Главная мысль урока:</b> внутри ИИ нет «понимания» в человеческом смысле — есть огромная функция из миллиардов чисел, которая по токенам предсказывает следующий токен. Удивительно, но этого хватает, чтобы рассуждать и писать код.</div>`,

<p>«Ключ от замка» и «ключ бьёт из-под земли». Слово одно, смысл разный. Чтобы понять токен, модели нужно посмотреть на остальные токены. Для этого придумали механизм <b>внимания</b> (attention) — сердце архитектуры <b>трансформер</b>, на которой построены все современные языковые модели.</p>
<h3>Внимание на пальцах</h3>
<p>Каждый токен задаёт вопрос: «кто из соседей важен для моего смысла?» Аналогия с поиском:</p>
<ul><li><b>Query</b> (запрос) — что ищет токен;</li><li><b>Key</b> (ключ) — «заголовок» каждого соседа;</li><li><b>Value</b> (значение) — содержимое, которое сосед отдаст.</li></ul>
<p>Модель сравнивает запрос со всеми ключами, получает оценки, превращает их в доли (сумма = 1) функцией <b>softmax</b> и складывает значения соседей пропорционально этим долям.</p>
<pre class="code run">import math

def softmax(scores):
    exps = [math.exp(s) for s in scores]
    total = sum(exps)
    return [e / total for e in exps]

<p>Так «ключ» понимает, что речь о замке. Таких «голов» внимания в модели десятки на каждом слое: одна следит за грамматикой, другая за смыслом, третья за тем, кто к кому обращается.</p>

<p>В начале веса модели случайные, и она выдаёт ерунду. Обучение — это подбор весов так, чтобы ошибка становилась меньше. Ошибку меряет <b>функция потерь</b> (loss): чем дальше ответ от правильного, тем она больше.</p>

<h3>Градиентный спуск</h3>
<p><b>Градиент</b> показывает, в какую сторону изменить каждый вес, чтобы ошибка росла быстрее всего. Мы делаем шаг в <b>обратную</b> сторону. Размер шага — <b>learning rate</b> (скорость обучения). Представьте спуск с горы в тумане: щупаете ногой уклон и шагаете вниз.</p>

<h3>2. Тесты — проверки, которые запускаются сами</h3>
<p>Тест — маленький код, который проверяет, что результат правильный. <code>assert условие</code> молчит, если всё хорошо, и падает с ошибкой, если нет.</p>
<pre class="code run">def psu_pct(watts, capacity):

<p>Критерии из спецификации превращаются в тесты: «окупаемость не позже 2031 года» — это <code>assert payback_year &lt;= 2031</code>, который прогоняется после каждого изменения финмодели. Ошибку ловит машина раньше, чем вы.</p>
<h3>3. Ревью</h3>
<p>Каждое изменение просматривает кто-то второй: человек или другой ИИ. Помогает git: видно построчно, что поменялось (<code>git diff</code>), и всегда можно откатиться. Работайте маленькими шагами: маленькое изменение легко проверить.</p>

const APP = "course";

const Store = {
  data: { lessons: {}, current: 1, updatedAt: 0 }, ref: null, mode: "local", _timer: null, _chain: Promise.resolve(),
  loadLocal() { try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) this.data = Object.assign(this.data, s); } catch (e) {} },
  server: false,
  async initServer() {
    if (!/^https?:$/.test(location.protocol) || /claude\.ai|claudeusercontent/.test(location.hostname)) return false;
    try {
      const r = await fetch("api/progress/" + APP, { cache: "no-store" });
      if (!r.ok) return false;
      const remote = await r.json();
      if (remote && (remote.updatedAt || 0) > (this.data.updatedAt || 0)) this.data = Object.assign({}, this.data, remote);
      this.server = true; this.mode = "server";
      if ((!remote || !remote.updatedAt) && this.data.updatedAt) this.save();
      renderAll(); updateChips();
      return true;
    } catch (e) { return false; }
  },
  pushServer() {
    clearTimeout(this._timer);
    this._timer = setTimeout(() => {
      const body = JSON.stringify(this.data);
      this._chain = this._chain.then(() => fetch("api/progress/" + APP, { method: "PUT", headers: { "Content-Type": "application/json" }, body }))
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); if (this.mode !== "server") { this.mode = "server"; updateChips(); } })
        .catch(() => { this.mode = "offline"; updateChips(); });
    }, 1000);
  },
  async initCloud() {    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      const id = user ? await user.id() : null;
      if (!db || !id) return;
      this.ref = db.doc("data/users/" + id + "/course");
      const snap = await this.ref.get();
      if (snap.exists) { const r = snap.data(); if ((r.updatedAt || 0) > (this.data.updatedAt || 0)) this.data = Object.assign({}, this.data, JSON.parse(JSON.stringify(r))); }
      this.mode = "cloud";
      if (!snap.exists && this.data.updatedAt) this.save();
      renderAll();
    } catch (e) { this.ref = null; this.mode = "local"; }
    updateChips();
  },
  save() {
    this.data.updatedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) {}
    if (this.server) { this.pushServer(); return; }
    if (!this.ref) return;
    clearTimeout(this._timer);
    this._timer = setTimeout(() => {
      const body = JSON.parse(JSON.stringify(this.data));
      this._chain = this._chain.then(() => this.ref.set(body)).catch(err => {
        if (err && ["invalid_argument", "revoked", "not_granted"].includes(err.code)) { this.ref = null; this.mode = "local"; updateChips(); }
      });
    }, 1200);
  }
};

function practiceDone(n) { const s = Store.data.lessons[n] || {}; return (s.tasks || []).length + (s.code || []).length; }
function lessonPct(n) {
  const c = LESSONS[n]; if (!c) return 0;
  const s = Store.data.lessons[n]; if (!s) return 0;
  const parts = [s.read ? 1 : 0, c.quiz.length ? s.quizBest / c.quiz.length : 0, practiceAll(n) ? practiceDone(n) / practiceAll(n) : 0];
  return Math.round((parts[0] * 0.2 + parts[1] * 0.4 + parts[2] * 0.4) * 100);
}
function totalPct() {
  const ns = Object.keys(LESSONS);
  return Math.round(ns.reduce((a, n) => a + lessonPct(n), 0) / (Object.keys(OUTLINE).length));
}

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffleIdx = n => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function ring(p) {
  const r = 16, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 40 40" role="img" aria-label="${p}%"><circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="5"/><circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c * p / 100} ${c}" transform="rotate(-90 20 20)"/><text x="20" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fg)">${p}</text></svg>`;
}

function normalize(cmd) { return cmd.trim().replace(/\s+/g, " ").replace(/\s*\|\s*/g, " | ").replace(/^ps>\s*/i, ""); }

/* ===================== PYTHON В БРАУЗЕРЕ (Pyodide) ===================== */
const PYODIDE = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
let pyReady = null;
function loadPy(status) {
  if (pyReady) return pyReady;
  if (status) status.textContent = "Загружаю Python (около 10 МБ, только в первый раз)…";
  pyReady = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = PYODIDE + "pyodide.js";
    s.onload = () => loadPyodide({ indexURL: PYODIDE }).then(resolve, e => { pyReady = null; reject(e); });
    s.onerror = () => { pyReady = null; s.remove(); reject(new Error("Python не загрузился: нужен интернет при первом запуске.")); };
    document.head.appendChild(s);
  });
  return pyReady;
}
// Оставляем от Traceback только строки про код пользователя (без внутренностей Pyodide)
function cleanTraceback(msg) {
  const lines = String(msg).split("\n");
  const start = lines.findIndex(l => l.includes('File "<exec>"'));
  const body = (start >= 0 ? lines.slice(start) : lines.slice(-2)).filter(l => !/_pyodide|\/lib\/python|pyodide\.asm/.test(l));
  return ("Ошибка в вашем коде:\n" + body.join("\n").replace(/File "<exec>"/g, "Строка")).trim();
}
async function runPy(code, status) {
  const py = await loadPy(status);
  let out = "";
  py.setStdout({ batched: t => { out += t + "\n"; } });
  py.setStderr({ batched: t => { out += t + "\n"; } });
  const scope = py.globals.get("dict")();
  try {
    await py.loadPackagesFromImports(code);   // например sqlite3 подгружается отдельно
    await py.runPythonAsync(code, { globals: scope });
    return { out: out.replace(/\n$/, ""), err: null };
  }
  catch (e) { return { out: out.replace(/\n$/, ""), err: cleanTraceback(e.message || e) }; }
  finally { scope.destroy(); }
}
// JavaScript выполняется прямо в странице; console.log собирается в вывод
async function runJS(code) {
  const lines = [];
  const fmt = v => typeof v === "string" ? v : (() => { try { return JSON.stringify(v); } catch (e) { return String(v); } })();
  const con = { log: (...a) => lines.push(a.map(fmt).join(" ")), error: (...a) => lines.push(a.map(fmt).join(" ")) };
  try { await new Function("console", '"use strict";\n' + code)(con); return { out: lines.join("\n"), err: null }; }
  catch (e) { return { out: lines.join("\n"), err: "Ошибка в вашем коде:\n" + e.name + ": " + e.message }; }
}
function runCode(code, lang, status) { return lang === "js" ? runJS(code) : runPy(code, status); }
function showRun(box, res) {
  box.innerHTML = (res.out ? `<span>${esc(res.out)}</span>` : "") + (res.err ? `${res.out ? "\n" : ""}<span class="e">${esc(res.err)}</span>` : "") + (!res.out && !res.err ? '<span class="dim">(программа ничего не вывела)</span>' : "");
}
// Кнопки «Запустить» у примеров кода в теории
function attachRunners(root) {
  root.querySelectorAll("pre.code.run").forEach(pre => {
    const row = document.createElement("div"); row.className = "row"; row.style.margin = "-4px 0 12px";
    const b = document.createElement("button"); b.className = "btn small"; b.textContent = "▶ Запустить";
    const c = document.createElement("button"); c.className = "btn small"; c.textContent = "В песочницу";
    const out = document.createElement("pre"); out.className = "code out"; out.hidden = true;
    const lang = pre.classList.contains("js") ? "js" : "py";
    b.onclick = async () => { out.hidden = false; out.textContent = "Выполняю…"; try { showRun(out, await runCode(pre.textContent, lang, out)); } catch (e) { out.textContent = e.message; } };
    c.onclick = () => { sandboxCode = pre.textContent; sandboxLang = lang; openTab("tab-code"); };
    row.append(b, c); pre.after(row); row.after(out);
  });
}
function outputMatches(got, want) { const n = s => s.replace(/\r/g, "").split("\n").map(l => l.trimEnd()).join("\n").trim(); return n(got) === n(want); }
function renderCodeTasks(n, lv) {
  const c = LESSONS[n], s = L(n);
  lv.innerHTML = `<p class="lead">Пишите код прямо здесь и нажимайте «Запустить». Код выполняется в самом телефоне или компьютере. «Проверить» запускает его и сравнивает результат с нужным. Подсказки открываются по одной.</p>` +
    c.code.map((t, i) => `<div class="task card"><div class="goal">${s.code.includes(i) ? '<span class="done-mark">✓</span> ' : ""}Задание ${i + 1}. ${esc(t.goal)}</div>
      <textarea class="editor" id="ed-${i}" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Код задания ${i + 1}">${esc(t.starter)}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn" data-run="${i}">▶ Запустить</button><button class="btn primary" data-check="${i}">Проверить</button><button class="btn" data-hint="${i}">Подсказка</button><button class="btn" data-ans="${i}">Показать решение</button></div>
      <pre class="code out" id="cout-${i}" hidden></pre><div class="hint" id="hint-${i}" aria-live="polite"></div></div>`).join("");
  c.code.forEach((t, i) => {
    const ed = $("#ed-" + i), out = $("#cout-" + i);
    ed.onkeydown = e => { if (e.key === "Tab") { e.preventDefault(); const p = ed.selectionStart; ed.value = ed.value.slice(0, p) + "    " + ed.value.slice(ed.selectionEnd); ed.selectionStart = ed.selectionEnd = p + 4; } };
    const run = async () => { out.hidden = false; out.textContent = "Выполняю…"; try { const r = await runCode(ed.value, t.lang, out); showRun(out, r); return r; } catch (e) { out.textContent = e.message; return null; } };
    lv.querySelector(`[data-run="${i}"]`).onclick = run;
    lv.querySelector(`[data-check="${i}"]`).onclick = async () => {
      const r = await run(); if (!r) return;
      const missing = (t.must || []).filter(m => !ed.value.includes(m));
      const ok = !r.err && outputMatches(r.out, t.expect) && !missing.length;
      const h = $("#hint-" + i);
      if (ok) { h.innerHTML = '<span class="done-mark">✓ Верно!</span> Задание засчитано.'; if (!s.code.includes(i)) { s.code.push(i); Store.save(); updateChips(); } }
      else if (r.err) h.innerHTML = "Код упал с ошибкой. Прочитайте последнюю строку ошибки — там причина.";
      else if (missing.length) h.innerHTML = "Результат верный, но в задании нужно использовать: <code>" + missing.map(esc).join("</code>, <code>") + "</code>.";
      else h.innerHTML = "Результат не совпадает. Нужно вывести:<pre class=\"code out\">" + esc(t.expect) + "</pre>";
    };
    let hintN = 0; const soft = t.hints.slice(0, -1);
    lv.querySelector(`[data-hint="${i}"]`).onclick = () => { hintN = Math.min(hintN + 1, soft.length); $("#hint-" + i).innerHTML = soft.slice(0, hintN).map(x => "Подсказка: " + esc(x)).join("<br>"); };
    lv.querySelector(`[data-ans="${i}"]`).onclick = () => { $("#hint-" + i).innerHTML = "Решение:<pre class=\"code\">" + esc(t.hints[t.hints.length - 1]) + "</pre>Наберите или исправьте код сами и нажмите «Проверить»."; };
  });
}

let sandboxCode = 'print("Привет! Это песочница Python.")\nfor i in range(3):\n    print("Строка", i + 1)';
let sandboxLang = "py";
function copyText(text, btn) {
  const done = () => { const l = btn.textContent; btn.textContent = "Скопировано"; setTimeout(() => btn.textContent = l, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); else fallbackCopy(text, done);
}
function fallbackCopy(text, done) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} ta.remove(); }
function renderCode() {
  const p = $("#p-code");
  p.innerHTML = `<h3 style="margin-top:0">Песочница</h3><p class="lead">Пишите и запускайте код прямо здесь. Можно вставить код, который я пришлю в чате, и посмотреть, как он работает.</p>
    <div class="subnav" role="group" aria-label="Язык"><button data-lang="py" aria-pressed="${sandboxLang === "py"}">Python</button><button data-lang="js" aria-pressed="${sandboxLang === "js"}">JavaScript</button></div>
    <div class="card"><textarea class="editor tall" id="sb-ed" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Код песочницы">${esc(sandboxCode)}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="sb-run">▶ Запустить</button><button class="btn" id="sb-copy">Копировать</button><button class="btn" id="sb-clear">Очистить</button></div>
      <pre class="code out" id="sb-out" hidden></pre></div>
    <h3>Готовые решения</h3><p class="lead">Рабочие программы для частых задач, с объяснением. Отмеченные «в приложении» запускаются прямо здесь. Отмеченные «на компьютере» работают с файлами, сетью или датчиками: скопируйте, сохраните как <code>имя.py</code> и запустите командой <code>python имя.py</code>.</p>
    <div class="ref-grid">${SNIPPETS.map((s, i) => `<div class="card"><div class="row" style="justify-content:space-between"><h4 style="margin:0">${esc(s.t)}</h4><span class="chip">${s.where === "here" ? "в приложении" : "на компьютере"}</span></div>
      <p class="note" style="margin:6px 0 8px">${esc(s.d)}</p><pre class="code">${esc(s.code)}</pre>
      <div class="row"><button class="btn small" data-copy="${i}">Копировать</button><button class="btn small" data-open="${i}">В песочницу</button></div></div>`).join("")}</div>`;
  const ed = $("#sb-ed"), out = $("#sb-out");
  ed.oninput = () => { sandboxCode = ed.value; };
  ed.onkeydown = e => { if (e.key === "Tab") { e.preventDefault(); const pos = ed.selectionStart; ed.value = ed.value.slice(0, pos) + "    " + ed.value.slice(ed.selectionEnd); ed.selectionStart = ed.selectionEnd = pos + 4; sandboxCode = ed.value; } };
  $("#sb-run").onclick = async () => { out.hidden = false; out.textContent = "Выполняю…"; try { showRun(out, await runCode(ed.value, sandboxLang, out)); } catch (e) { out.textContent = e.message; } };
  p.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { sandboxLang = b.dataset.lang; sandboxCode = ed.value; renderCode(); });
  $("#sb-copy").onclick = e => copyText(ed.value, e.currentTarget);
  $("#sb-clear").onclick = () => { ed.value = ""; sandboxCode = ""; out.hidden = true; ed.focus(); };
  p.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyText(SNIPPETS[+b.dataset.copy].code, b));
  p.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { sandboxCode = SNIPPETS[+b.dataset.open].code; sandboxLang = "py"; renderCode(); window.scrollTo(0, 0); });
}

/* ===================== СПРАВОЧНИК ===================== */
function renderRef() {
  const p = $("#p-ref");
  p.innerHTML = `<p class="lead">Шпаргалка по командам из уроков. Ищите по названию или по смыслу.</p><input type="search" id="ref-q" placeholder="Например: процесс, удалить, порт" aria-label="Поиск по справочнику"><div class="ref-grid" id="ref-grid"></div>`;
  const fill = () => {
    const q = $("#ref-q").value.trim().toLowerCase();
    $("#ref-grid").innerHTML = REF.map(([t, rows]) => {
      const r = rows.filter(([a, b]) => !q || (a + " " + b + " " + t).toLowerCase().includes(q));
      return r.length ? `<div class="card"><h4>${esc(t)}</h4>${r.map(([a, b]) => `<div class="ref-row"><code>${esc(a)}</code><span>${esc(b)}</span></div>`).join("")}</div>` : "";
    }).join("") || `<p class="note">Ничего не найдено.</p>`;
  };
  $("#ref-q").oninput = fill; fill();
}

/* ===================== ПРОГРЕСС ===================== */
function renderStats() {
  const ready = Object.keys(LESSONS);
  const tasksDone = ready.reduce((a, n) => a + practiceDone(n), 0);
  const tasksAll = ready.reduce((a, n) => a + practiceAll(n), 0);
  const quizR = ready.reduce((a, n) => a + ((Store.data.lessons[n] || {}).quizBest || 0), 0);
  const quizAll = ready.reduce((a, n) => a + LESSONS[n].quiz.length, 0);
  $("#p-stats").innerHTML = `<div class="stats">
    <div class="card stat"><div class="n">${totalPct()}%</div><div class="l">всего курса</div></div>
    <div class="card stat"><div class="n">${ready.filter(n => lessonPct(n) === 100).length} / 16</div><div class="l">уроков пройдено полностью</div></div>
    <div class="card stat"><div class="n">${quizR} / ${quizAll}</div><div class="l">верных ответов в тестах (лучшие)</div></div>
    <div class="card stat"><div class="n">${tasksDone} / ${tasksAll}</div><div class="l">заданий практики выполнено</div></div></div>
    <div class="lessons">${ready.map(n => `<div class="lesson" style="cursor:default"><span class="num">${n}</span><span><span class="t">${esc(OUTLINE[n][0])}</span><br><span class="d">теория ${(Store.data.lessons[n] || {}).read ? "✓" : "—"} · тест ${(Store.data.lessons[n] || {}).quizBest || 0}/${LESSONS[n].quiz.length} · практика ${practiceDone(n)}/${practiceAll(n)}</span></span>${ring(lessonPct(n))}</div>`).join("")}</div>
    <p class="note" style="margin-top:16px">${({ cloud: "Прогресс хранится в облаке claude.ai.", server: "Прогресс хранится на сервере и одинаков на телефоне и компьютере." }[Store.mode] || "Прогресс хранится в этом браузере.")}</p>`;
}

/* ===================== ЗАПУСК ===================== */
function renderAll() { renderCourse(); renderLesson(); renderRef(); if (!$("#p-stats").hidden) renderStats(); updateChips(); }
Store.loadLocal();
renderAll();
Store.initServer().then(ok => { if (!ok) Store.initCloud(); });
