<style>
/* Layout: one column "тетрадь" — шапка с прогрессом, вкладки, рабочая область карточек */
:root {
  --bg: #f4f6f5; --surface: #ffffff; --surface2: #e9eeec; --line: #d3dcd8;
  --fg: #16201d; --muted: #5d6b66; --accent: #0f6e63; --accent-ink: #ffffff;
  --ipa: #8a3b12; --ok: #1f7a3a; --bad: #b42318; --warn: #a15c07;
  --f-display: "Unbounded", "Segoe UI", sans-serif;
  --f-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-ipa: "Charis SIL", "Segoe UI", "Lucida Sans Unicode", serif;
  --f-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1514; --surface: #17201e; --surface2: #1f2a28; --line: #2c3a37;
  --fg: #e5eeeb; --muted: #93a39e; --accent: #3cc3b0; --accent-ink: #062a25;
  --ipa: #f0a46b; --ok: #4ccf73; --bad: #ff7b6e; --warn: #f2b84b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #17201e; --surface2: #1f2a28; --line: #2c3a37;
  --fg: #e5eeeb; --muted: #93a39e; --accent: #3cc3b0; --accent-ink: #062a25;
  --ipa: #f0a46b; --ok: #4ccf73; --bad: #ff7b6e; --warn: #f2b84b; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
.wrap { max-width: 980px; margin: 0 auto }
header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 22px 14px }
h1 { font: 700 clamp(20px, 4vw, 28px)/1.1 var(--f-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance }
h1 small { display: block; font: 500 13px var(--f-body); color: var(--muted); letter-spacing: 0; margin-top: 6px }
.chips { display: flex; gap: 8px; flex-wrap: wrap }
.chip { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--surface2); color: var(--muted); font-variant-numeric: tabular-nums }
.chip b { color: var(--fg) }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 18px; scrollbar-width: none }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
nav.tabs button { flex: none; border: 0; background: none; color: var(--muted); font: 600 15px var(--f-body); padding: 12px 14px; cursor: pointer; border-bottom: 3px solid transparent }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent) }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.panel[hidden] { display: none }
.lead { color: var(--muted); max-width: 65ch; margin: 0 0 16px }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0 }
.word { display: flex; align-items: baseline; justify-content: space-between; gap: 8px }
.word .en { font: 700 20px var(--f-body) }
.ipa { font-family: var(--f-ipa); color: var(--ipa); font-size: 17px }
.ru-approx { color: var(--muted); font-size: 14px }
.tr { font-weight: 500 }
.ex { font-size: 14px; color: var(--muted); margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 6px }
.ex code, code { font-family: var(--f-mono); font-size: 13px; background: var(--surface2); padding: 1px 5px; border-radius: 4px; color: var(--fg) }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 8px 12px; font: 600 14px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.small { padding: 5px 9px; font-size: 13px }
.btn[disabled] { opacity: .45; cursor: default }
.icon { width: 16px; height: 16px; fill: currentColor; flex: none }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px }
.filters button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 12px; font: 500 14px var(--f-body); cursor: pointer }
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
input[type=text], input[type=search], select { font: 16px var(--f-body); padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); min-width: 0 }
.big-card { max-width: 560px; margin: 0 auto; text-align: center; padding: 28px 22px }
.big-card .en { font: 700 clamp(30px, 7vw, 44px)/1.15 var(--f-body); word-break: break-word }
.big-card .ipa { font-size: 24px }
.answer { margin-top: 14px }
.progress { height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden }
.progress > i { display: block; height: 100%; background: var(--accent) }
.opts { display: grid; gap: 8px; margin-top: 16px }
.opts button { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 12px 14px; font: 500 16px var(--f-body); cursor: pointer }
.opts button.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--surface)) }
.opts button.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface)) }
.verdict { margin-top: 12px; font-weight: 600; min-height: 1.5em }
.verdict.ok { color: var(--ok) } .verdict.bad { color: var(--bad) }
.sound { display: grid; grid-template-columns: 74px 1fr; gap: 14px; align-items: start }
.sound .sym { font: 700 34px/1 var(--f-ipa); color: var(--ipa); text-align: center; background: var(--surface2); border-radius: 10px; padding: 14px 0 }
.sound h3 { margin: 0 0 4px; font-size: 16px }
.sound p { margin: 0 0 8px; font-size: 14px; color: var(--muted) }
.ex-words { display: flex; flex-wrap: wrap; gap: 6px }
.err { font-family: var(--f-mono); font-size: 14px; background: var(--surface2); padding: 10px 12px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-word }
.gloss { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px }
.gloss span { background: var(--surface2); border-radius: 6px; padding: 3px 8px; font-size: 13px }
.gloss span b { font-family: var(--f-mono); font-weight: 600 }
.section-title { font: 700 15px var(--f-display); margin: 26px 0 10px; letter-spacing: .01em }
.stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); margin-bottom: 16px }
.stat .n { font: 700 28px var(--f-display); font-variant-numeric: tabular-nums }
.stat .l { color: var(--muted); font-size: 13px }
table.hist { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums }
table.hist td, table.hist th { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left }
.note { font-size: 13px; color: var(--muted) }
.mic-heard { font-size: 14px; margin-top: 8px; min-height: 1.4em }
.boxes { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 16px }
.boxes span { font-size: 13px; padding: 4px 9px; border-radius: 6px; background: var(--surface2); font-variant-numeric: tabular-nums }
.settings { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; font-size: 14px }
@media (prefers-reduced-motion: no-preference) { .opts button, .btn { transition: border-color .15s, background .15s } }
</style>

const APP = "english";
const KEY = "tech-english-v1";
const Store = {
  data: { cards: {}, tests: [], daily: {}, settings: { newPerDay: 12, rate: 0.85 }, updatedAt: 0 },
  ref: null, mode: "local", _timer: null, _chain: Promise.resolve(),
  loadLocal() {
    try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) this.data = Object.assign(this.data, s); } catch (e) {}
  },
  server: false,
  async initServer() {
    if (!/^https?:$/.test(location.protocol) || /claude\.ai|claudeusercontent/.test(location.hostname)) return false;
    try {
      const r = await fetch("api/progress/" + APP, { cache: "no-store" });
      if (!r.ok) return false;
      const remote = await r.json();
      if (remote && (remote.updatedAt || 0) > (this.data.updatedAt || 0)) this.data = Object.assign({}, this.data, remote);
      this.server = true; this.mode = "server";
      if ((!remote || !remote.updatedAt) && this.data.updatedAt) this.save();
      renderAll(); updateChips();
      return true;
    } catch (e) { return false; }
  },
  pushServer() {
    clearTimeout(this._timer);
    this._timer = setTimeout(() => {
      const body = JSON.stringify(this.data);
      this._chain = this._chain.then(() => fetch("api/progress/" + APP, { method: "PUT", headers: { "Content-Type": "application/json" }, body }))
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); if (this.mode !== "server") { this.mode = "server"; updateChips(); } })
        .catch(() => { this.mode = "offline"; updateChips(); });
    }, 1000);
  },
  async initCloud() {    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      const id = user ? await user.id() : null;
      if (!db || !id) return;
      this.ref = db.doc("data/users/" + id + "/english");
      const snap = await this.ref.get();
      if (snap.exists) {
        const remote = snap.data();
        if ((remote.updatedAt || 0) > (this.data.updatedAt || 0)) this.data = Object.assign({}, this.data, JSON.parse(JSON.stringify(remote)));
      }
      this.mode = "cloud";
      if (!snap.exists && this.data.updatedAt) this.save();
      renderAll();
    } catch (e) { this.ref = null; this.mode = "local"; }
    updateChips();
  },
  save() {
    this.data.updatedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) {}
    if (this.server) { this.pushServer(); return; }
    if (!this.ref) return;
    clearTimeout(this._timer);
    this._timer = setTimeout(() => {
      const body = JSON.parse(JSON.stringify(this.data));
      this._chain = this._chain.then(() => this.ref.set(body)).catch(err => {
        if (err && (err.code === "invalid_argument" || err.code === "revoked" || err.code === "not_granted")) { this.ref = null; this.mode = "local"; updateChips(); }
      });
    }, 1500);
  }
};

let voice = null;
function pickVoice() {
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  const en = vs.filter(v => /^en[-_]US/i.test(v.lang));
  voice = en.find(v => /natural|online/i.test(v.name)) || en.find(v => /aria|jenny|guy|google/i.test(v.name)) || en[0] || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate) {
  if (!window.speechSynthesis) { toast("Озвучка недоступна в этом браузере"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; if (voice) u.voice = voice;
  u.rate = rate || Store.data.settings.rate || 0.85;
  speechSynthesis.speak(u);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listen(target, outEl, onResult) {
  if (!SR) { outEl.textContent = "Проверка произношения работает в Edge или Chrome на компьютере (ярлык «Технический английский»)."; return; }
  const r = new SR(); r.lang = "en-US"; r.maxAlternatives = 5; r.interimResults = false;
  outEl.textContent = "Говорите…";
  r.onresult = ev => {
    const alts = Array.from(ev.results[0]).map(a => a.transcript.trim().toLowerCase().replace(/[.!?,]/g, ""));
    const goal = target.toLowerCase().replace(/[-.!?,]/g, " ").replace(/\s+/g, " ").trim();
    const ok = alts.some(a => a.replace(/-/g, " ") === goal);
    outEl.innerHTML = "";
    const b = document.createElement("span");
    b.textContent = ok ? "Отлично, понятно: «" + alts[0] + "»" : "Услышано: «" + alts[0] + "». Попробуйте ещё раз — послушайте образец.";
    b.style.color = ok ? "var(--ok)" : "var(--bad)";
    outEl.appendChild(b);
    if (onResult) onResult(ok);
  };
  r.onerror = ev => {
    outEl.textContent = (ev.error === "not-allowed" || ev.error === "service-not-allowed")
      ? "Нет доступа к микрофону. На claude.ai он закрыт: проверяйте произношение в версии на компьютере."
      : "Не расслышал (" + ev.error + "). Попробуйте ещё раз.";
  };
  try { r.start(); } catch (e) { outEl.textContent = "Не удалось включить микрофон."; }
}

let session = null;

  const due = shuffle(dueList()).slice(0, 40);

  const newLeft = Math.max(0, (Store.data.settings.newPerDay || 12) - d.newDone);
  const fresh = W.filter(w => !card(w[0])).slice(0, newLeft);

}

  }
  const q = test.qs[test.i];
  p.innerHTML = `<div class="progress" aria-hidden="true"><i style="width:${(test.i / test.qs.length) * 100}%"></i></div>
    <p class="note" style="margin:6px 0 12px">${MODES[test.mode]} · вопрос ${test.i + 1} из ${test.qs.length} · верно: ${test.right}</p>
    <div class="card big-card">
      <div class="${q.promptClass || "en"}">${q.prompt}</div>
      ${q.sub ? `<div class="ipa">${q.sub}</div>` : ""}
      ${q.audio ? `<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="q-play">${SPK} Ещё раз</button></div>` : ""}
      ${q.opts ? `<div class="opts">${q.opts.map((o, i) => `<button data-i="${i}">${esc(o)}</button>`).join("")}</div>`
        : `<div class="row" style="justify-content:center;margin-top:14px"><input type="text" id="q-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="напишите по-английски" style="max-width:280px;flex:1"><button class="btn primary" id="q-ok">Проверить</button></div>`}
      <div class="verdict" id="q-v" aria-live="polite"></div>
      <div class="row" style="justify-content:center"><button class="btn primary" id="q-next" hidden>Дальше</button></div>
    </div>`;
  if (q.audio) { $("#q-play").onclick = () => speak(q.audio); speak(q.audio); }
  const finish = ok => {
    const v = $("#q-v");
    v.className = "verdict " + (ok ? "ok" : "bad");
    v.textContent = ok ? "Верно" : "Правильно: " + q.answerText;
    if (q.word) {
      speak(q.word[0]);
      if (!ok) { test.wrong.push([q.word[0], q.word[3]]); const c = card(q.word[0]) || { b: 1, ok: 0, bad: 0 }; c.b = 1; c.bad = (c.bad || 0) + 1; c.d = Date.now(); Store.data.cards[q.word[0]] = c; }
    } else if (!ok) test.wrong.push([q.answerText.slice(0, 40), "ошибка"]);
    if (ok) test.right++;
    $("#q-next").hidden = false; $("#q-next").focus();
  };
  $("#q-next").onclick = () => { test.i++; if (test.i >= test.qs.length) saveTest(); renderTests(); };
  if (q.opts) {
    p.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
      if (!$("#q-next").hidden) return;
      const i = +b.dataset.i;
      p.querySelectorAll(".opts button").forEach(x => { x.disabled = true; if (+x.dataset.i === q.correct) x.classList.add("right"); });
      if (i !== q.correct) b.classList.add("wrong");
      finish(i === q.correct);
    });
  } else {
    const inp = $("#q-in"); inp.focus();
    const check = () => { if (!$("#q-next").hidden) return; inp.disabled = true; finish(inp.value.trim().toLowerCase() === q.answerText.toLowerCase()); };
    $("#q-ok").onclick = check; inp.onkeydown = e => { if (e.key === "Enter") check(); };
  }
}
function pool() {
  if (testTopic === "learned") { const l = W.filter(w => card(w[0])); return l.length >= 4 ? l : W; }
  return testTopic === "all" ? W : W.filter(w => w[4] === testTopic);
}
function startTest() {
  const mode = testMode;
  let qs;
  if (mode === "errors") {
    qs = shuffle(ERRORS).slice(0, 10).map(e => {
      const others = shuffle(ERRORS.filter(x => x !== e)).slice(0, 3).map(x => x[1]);
      const opts = shuffle([e[1], ...others]);
      return { prompt: `<span class="err" style="display:block;text-align:left">${esc(e[0])}</span>`, promptClass: "", opts, correct: opts.indexOf(e[1]), answerText: e[1] };
    });
  } else {
    const base = pool();
    qs = shuffle(base).slice(0, 10).map(w => {
      const same = shuffle(W.filter(x => x !== w && x[4] === w[4]));
      const dis = (same.length >= 3 ? same : shuffle(W.filter(x => x !== w))).slice(0, 3);
      if (mode === "en2ru") { const opts = shuffle([w[3], ...dis.map(x => x[3])]); return { word: w, prompt: esc(w[0]), sub: "/" + esc(w[1]) + "/", opts, correct: opts.indexOf(w[3]), answerText: w[3] }; }
      if (mode === "ru2en") { const opts = shuffle([w[0], ...dis.map(x => x[0])]); return { word: w, prompt: esc(w[3]), promptClass: "tr", opts, correct: opts.indexOf(w[0]), answerText: w[0] }; }
      if (mode === "audio") { const opts = shuffle([w[3], ...dis.map(x => x[3])]); return { word: w, prompt: "Что прозвучало?", promptClass: "tr", audio: w[0], opts, correct: opts.indexOf(w[3]), answerText: w[0] + " — " + w[3] }; }
      return { word: w, prompt: esc(w[3]), promptClass: "tr", sub: "/" + esc(w[1]) + "/", answerText: w[0] };
    });
  }
  test = { mode, qs, i: 0, right: 0, wrong: [] };
  renderTests();
}
function saveTest() {
  Store.data.tests.unshift({ t: Date.now(), mode: test.mode, right: test.right, total: test.qs.length });
  Store.data.tests = Store.data.tests.slice(0, 60);
  Store.save(); updateChips();
}

/* ======================= ПРОГРЕСС ======================= */
function streak() {
  let n = 0; const d = new Date();
  for (;;) { const k = d.toISOString().slice(0, 10); const x = Store.data.daily[k]; if (x && (x.newDone || x.reviews)) { n++; d.setDate(d.getDate() - 1); } else break; }
  return n;
}
function renderStats() {
  const p = $("#p-stats");
  const studied = Object.keys(Store.data.cards).length;
  const tests = Store.data.tests;
  const avg = tests.length ? Math.round(tests.slice(0, 10).reduce((s, t) => s + t.right / t.total, 0) / Math.min(10, tests.length) * 100) : null;
  p.innerHTML = `<div class="stats">
      <div class="card stat"><div class="n">${learnedCount()}</div><div class="l">слов выучено (уровень 3+)</div></div>
      <div class="card stat"><div class="n">${studied}</div><div class="l">слов в работе из ${W.length}</div></div>
      <div class="card stat"><div class="n">${streak()}</div><div class="l">дней подряд</div></div>
      <div class="card stat"><div class="n">${avg == null ? "—" : avg + "%"}</div><div class="l">средний результат последних 10 тестов</div></div>
    </div>
    <h2 class="section-title">По темам</h2>
    <div class="grid">${Object.entries(TOPICS).map(([k, v]) => { const all = W.filter(w => w[4] === k); const l = all.filter(w => (card(w[0]) || {}).b >= 3).length;
      return `<div class="card"><div class="word"><b>${v}</b><span class="note">${l} / ${all.length}</span></div><div class="progress" style="margin-top:8px"><i style="width:${l / all.length * 100}%"></i></div></div>`; }).join("")}</div>
    <h2 class="section-title">Последние тесты</h2>
    ${tests.length ? `<div style="overflow-x:auto"><table class="hist"><thead><tr><th>Когда</th><th>Тест</th><th>Результат</th></tr></thead><tbody>${tests.slice(0, 15).map(t => `<tr><td>${new Date(t.t).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</td><td>${MODES[t.mode] || t.mode}</td><td>${t.right} / ${t.total}</td></tr>`).join("")}</tbody></table></div>` : `<p class="note">Тестов пока не было. Начните с вкладки «Тесты».</p>`}
    <p class="note" style="margin-top:16px">${({ cloud: "Прогресс хранится в облаке claude.ai.", server: "Прогресс хранится на сервере и одинаков на телефоне и компьютере." }[Store.mode] || "Прогресс хранится в этом браузере.")}</p>`;
}

/* ======================= ЗАПУСК ======================= */
function renderAll() { renderTrain(); renderWords(); renderSounds(); renderErrors(); renderTests(); updateChips(); if (!$("#p-stats").hidden) renderStats(); }
Store.loadLocal();
renderAll();
try { const t = localStorage.getItem(KEY + "-tab"); if (t && document.getElementById(t)) openTab(t); } catch (e) {}
Store.initServer().then(ok => { if (!ok) Store.initCloud(); });
</script>
