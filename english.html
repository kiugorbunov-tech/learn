<style>
/* Layout: one column "тетрадь" — шапка с прогрессом, вкладки, рабочая область карточек */
:root {
  --bg: #f4f6f5; --surface: #ffffff; --surface2: #e9eeec; --line: #d3dcd8;
  --fg: #16201d; --muted: #5d6b66; --accent: #0f6e63; --accent-ink: #ffffff;
  --ipa: #8a3b12; --ok: #1f7a3a; --bad: #b42318; --warn: #a15c07;
  --f-display: "Unbounded", "Segoe UI", sans-serif;
  --f-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-ipa: "Charis SIL", "Segoe UI", "Lucida Sans Unicode", serif;
  --f-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1514; --surface: #17201e; --surface2: #1f2a28; --line: #2c3a37;
  --fg: #e5eeeb; --muted: #93a39e; --accent: #3cc3b0; --accent-ink: #062a25;
  --ipa: #f0a46b; --ok: #4ccf73; --bad: #ff7b6e; --warn: #f2b84b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #17201e; --surface2: #1f2a28; --line: #2c3a37;
  --fg: #e5eeeb; --muted: #93a39e; --accent: #3cc3b0; --accent-ink: #062a25;
  --ipa: #f0a46b; --ok: #4ccf73; --bad: #ff7b6e; --warn: #f2b84b; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
.wrap { max-width: 980px; margin: 0 auto }
header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 22px 14px }
h1 { font: 700 clamp(20px, 4vw, 28px)/1.1 var(--f-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance }
h1 small { display: block; font: 500 13px var(--f-body); color: var(--muted); letter-spacing: 0; margin-top: 6px }
.chips { display: flex; gap: 8px; flex-wrap: wrap }
.chip { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--surface2); color: var(--muted); font-variant-numeric: tabular-nums }
.chip b { color: var(--fg) }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 18px; scrollbar-width: none }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
nav.tabs button { flex: none; border: 0; background: none; color: var(--muted); font: 600 15px var(--f-body); padding: 12px 14px; cursor: pointer; border-bottom: 3px solid transparent }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent) }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.panel[hidden] { display: none }
.lead { color: var(--muted); max-width: 65ch; margin: 0 0 16px }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0 }
.word { display: flex; align-items: baseline; justify-content: space-between; gap: 8px }
.word .en { font: 700 20px var(--f-body) }
.ipa { font-family: var(--f-ipa); color: var(--ipa); font-size: 17px }
.ru-approx { color: var(--muted); font-size: 14px }
.tr { font-weight: 500 }
.ex { font-size: 14px; color: var(--muted); margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 6px }
.ex code, code { font-family: var(--f-mono); font-size: 13px; background: var(--surface2); padding: 1px 5px; border-radius: 4px; color: var(--fg) }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 8px 12px; font: 600 14px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.small { padding: 5px 9px; font-size: 13px }
.btn[disabled] { opacity: .45; cursor: default }
.icon { width: 16px; height: 16px; fill: currentColor; flex: none }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px }
.filters button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 12px; font: 500 14px var(--f-body); cursor: pointer }
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
input[type=text], input[type=search], select { font: 16px var(--f-body); padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); min-width: 0 }
.big-card { max-width: 560px; margin: 0 auto; text-align: center; padding: 28px 22px }
.big-card .en { font: 700 clamp(30px, 7vw, 44px)/1.15 var(--f-body); word-break: break-word }
.big-card .ipa { font-size: 24px }
.answer { margin-top: 14px }
.progress { height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden }
.progress > i { display: block; height: 100%; background: var(--accent) }
.opts { display: grid; gap: 8px; margin-top: 16px }
.opts button { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 12px 14px; font: 500 16px var(--f-body); cursor: pointer }
.opts button.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--surface)) }
.opts button.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface)) }
.verdict { margin-top: 12px; font-weight: 600; min-height: 1.5em }
.verdict.ok { color: var(--ok) } .verdict.bad { color: var(--bad) }
.sound { display: grid; grid-template-columns: 74px 1fr; gap: 14px; align-items: start }
.sound .sym { font: 700 34px/1 var(--f-ipa); color: var(--ipa); text-align: center; background: var(--surface2); border-radius: 10px; padding: 14px 0 }
.sound h3 { margin: 0 0 4px; font-size: 16px }
.sound p { margin: 0 0 8px; font-size: 14px; color: var(--muted) }
.ex-words { display: flex; flex-wrap: wrap; gap: 6px }
.err { font-family: var(--f-mono); font-size: 14px; background: var(--surface2); padding: 10px 12px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-word }
.gloss { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px }
.gloss span { background: var(--surface2); border-radius: 6px; padding: 3px 8px; font-size: 13px }
.gloss span b { font-family: var(--f-mono); font-weight: 600 }
.section-title { font: 700 15px var(--f-display); margin: 26px 0 10px; letter-spacing: .01em }
.stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); margin-bottom: 16px }
.stat .n { font: 700 28px var(--f-display); font-variant-numeric: tabular-nums }
.stat .l { color: var(--muted); font-size: 13px }
table.hist { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums }
table.hist td, table.hist th { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left }
.note { font-size: 13px; color: var(--muted) }
.mic-heard { font-size: 14px; margin-top: 8px; min-height: 1.4em }
.boxes { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 16px }
.boxes span { font-size: 13px; padding: 4px 9px; border-radius: 6px; background: var(--surface2); font-variant-numeric: tabular-nums }
.settings { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; font-size: 14px }
@media (prefers-reduced-motion: no-preference) { .opts button, .btn { transition: border-color .15s, background .15s } }
.teach { margin-bottom: 12px } .teach h3 { margin: 0 0 8px; font-size: 17px } .teach p { margin: 0 0 10px; max-width: 70ch } .teach ul, .teach ol { margin: 0 0 10px; padding-left: 20px; max-width: 70ch } .teach li { margin-bottom: 5px }
.teach i { color: var(--accent); font-style: normal; font-weight: 500 }
.goal-card { border-color: var(--accent) }
.g-title { font: 700 clamp(20px, 4vw, 26px)/1.2 var(--f-display); margin: 0 0 6px; text-wrap: balance }
.tbl { overflow-x: auto; margin: 0 0 10px } .tbl table { border-collapse: collapse; font-size: 14px; min-width: 100% }
.tbl th, .tbl td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top } .tbl th { background: var(--surface2); font-weight: 600 }
.lesson-btn { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; text-align: left; color: var(--fg); font: inherit; cursor: pointer; width: 100% }
.lesson-btn:hover { border-color: var(--accent) } .lesson-btn .num { font: 700 18px var(--f-display); color: var(--accent); text-align: center }
.ex-line { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-bottom: 1px dashed var(--line) } .ex-line:last-child { border-bottom: 0 }
.en-line { font-weight: 500 }
.q-big { font-size: 20px; font-weight: 600; margin: 6px 0 4px }
.explain { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--surface2); font-size: 15px } .explain b.ok { color: var(--ok) } .explain b.bad { color: var(--bad) }
.build-line { min-height: 52px; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px dashed var(--line); border-radius: 10px; margin: 8px 0; align-items: center }
.build-pool { display: flex; flex-wrap: wrap; gap: 6px }
.chip-w { border: 1px solid var(--line); background: var(--surface2); color: var(--fg); border-radius: 8px; padding: 8px 12px; font: 600 16px var(--f-body); cursor: pointer }
.chip-w.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.week.now { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset } .now-chip { background: var(--accent); color: var(--accent-ink) }
.tr-area { width: 100%; min-height: 110px; resize: vertical; font: 17px/1.5 var(--f-body); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg) }
</style>

/* ======================= ХРАНЕНИЕ ======================= */
const APP = "english";
const KEY = "tech-english-v1";
const Store = {
  data: { cards: {}, tests: [], daily: {}, settings: { newPerDay: 12, rate: 0.85 }, updatedAt: 0 },
  ref: null, mode: "local", _timer: null, _chain: Promise.resolve(),
  loadLocal() {
    try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) this.data = Object.assign(this.data, s); } catch (e) {}
  },
  server: false,
  async initServer() {
    if (!/^https?:$/.test(location.protocol) || /claude\.ai|claudeusercontent/.test(location.hostname)) return false;
    try {
      const r = await fetch("api/progress/" + APP, { cache: "no-store" });
      if (!r.ok) return false;
      const remote = await r.json();
      if (remote && (remote.updatedAt || 0) > (this.data.updatedAt || 0)) this.data = Object.assign({}, this.data, remote);
      this.server = true; this.mode = "server";
      if ((!remote || !remote.updatedAt) && this.data.updatedAt) this.save();
      renderAll(); updateChips();
      return true;
    } catch (e) { return false; }
  },
  pushServer() {
    clearTimeout(this._timer);
    this._timer = setTimeout(() => {
      const body = JSON.stringify(this.data);
      this._chain = this._chain.then(() => fetch("api/progress/" + APP, { method: "PUT", headers: { "Content-Type": "application/json" }, body }))
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); if (this.mode !== "server") { this.mode = "server"; updateChips(); } })
        .catch(() => { this.mode = "offline"; updateChips(); });
    }, 1000);
  },
  async initCloud() {    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      const id = user ? await user.id() : null;
      if (!db || !id) return;
      this.ref = db.doc("data/users/" + id + "/english");
      const snap = await this.ref.get();
      if (snap.exists) {
        const remote = snap.data();
        if ((remote.updatedAt || 0) > (this.data.updatedAt || 0)) this.data = Object.assign({}, this.data, JSON.parse(JSON.stringify(remote)));
      }
      this.mode = "cloud";
      if (!snap.exists && this.data.updatedAt) this.save();
      renderAll();
    } catch (e) { this.ref = null; this.mode = "local"; }
    updateChips();
  },
  save() {
    this.data.updatedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) {}
    if (this.server) { this.pushServer(); return; }
    if (!this.ref) return;
    clearTimeout(this._timer);
    this._timer = setTimeout(() => {
      const body = JSON.parse(JSON.stringify(this.data));
      this._chain = this._chain.then(() => this.ref.set(body)).catch(err => {
        if (err && (err.code === "invalid_argument" || err.code === "revoked" || err.code === "not_granted")) { this.ref = null; this.mode = "local"; updateChips(); }
      });
    }, 1500);
  }
};

let voice = null;
function pickVoice() {
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  const en = vs.filter(v => /^en[-_]US/i.test(v.lang));
  voice = en.find(v => /natural|online/i.test(v.name)) || en.find(v => /aria|jenny|guy|google/i.test(v.name)) || en[0] || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate) {
  if (!window.speechSynthesis) { toast("Озвучка недоступна в этом браузере"); return; }
  if (activeRec) activeRec.finish("Остановлено.");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; if (voice) u.voice = voice;
  u.rate = rate || Store.data.settings.rate || 0.85;
  speechSynthesis.speak(u);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeRec = null;
function normText(s) { return String(s).toLowerCase().replace(/[’`]/g, "'").replace(/-/g, " ").replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim(); }
function similarity(target, heard) {
  const t = normText(target).split(" ").filter(Boolean), h = new Set(normText(heard).split(" "));
  return t.length ? t.filter(w => h.has(w)).length / t.length : 0;
}
// Распознавание речи. На iPhone Safari может не прислать итог или конец записи,
// поэтому: кнопка «Стоп», предел 8 секунд, оценка по последнему услышанному варианту.
function listen(target, outEl, btn) {
  if (activeRec) { activeRec.finish("Остановлено."); return; }
  if (!SR) { outEl.textContent = "Этот браузер не умеет распознавать речь. На iPhone откройте приложение в Safari, на компьютере — в Edge или Chrome."; return; }
  try { speechSynthesis.cancel(); } catch (e) {}
  const r = new SR();
  r.lang = "en-US"; r.interimResults = true; r.continuous = false; r.maxAlternatives = 3;
  const label = btn ? btn.innerHTML : "";
  let heard = [], done = false, timer = null;
  const finish = msg => {
    if (done) return;
    done = true; activeRec = null; clearTimeout(timer);
    try { r.abort(); } catch (e) {}
    if (btn) { btn.innerHTML = label; btn.classList.remove("primary"); }
    if (msg) { outEl.textContent = msg; return; }
    if (!heard.length) { outEl.textContent = "Ничего не услышал. Нажмите и сразу говорите, чуть громче."; return; }
    const best = heard.reduce((a, h) => Math.max(a, similarity(target, h)), 0);
    const ok = best >= (normText(target).split(" ").length > 2 ? 0.75 : 1);
    outEl.innerHTML = "";
    const s = document.createElement("span");
    s.textContent = ok ? "Отлично, понятно: «" + heard[0] + "»" : "Услышано: «" + heard[0] + "» — совпало " + Math.round(best * 100) + "%. Послушайте образец и попробуйте ещё раз.";
    s.style.color = ok ? "var(--ok)" : "var(--bad)";
    outEl.appendChild(s);
  };
  activeRec = { finish };
  r.onresult = ev => {
    const res = ev.results[ev.results.length - 1];
    heard = Array.from(res).map(a => a.transcript.trim()).filter(Boolean);
    outEl.textContent = "Слышу: " + (heard[0] || "…");
    if (res.isFinal) finish();
  };
  r.onerror = ev => finish(
    ev.error === "not-allowed" || ev.error === "service-not-allowed"
      ? "Нет доступа к микрофону. iPhone: Настройки → Safari → Микрофон → Разрешить; также включите диктовку (Настройки → Основные → Клавиатура → Диктовка)."
      : ev.error === "no-speech" ? "Ничего не услышал. Попробуйте ещё раз." : "Не получилось (" + ev.error + "). Попробуйте ещё раз.");
  r.onend = () => finish();
  timer = setTimeout(() => { try { r.stop(); } catch (e) {} setTimeout(() => finish(), 1200); }, 8000);
  if (btn) { btn.textContent = "Стоп"; btn.classList.add("primary"); }
  outEl.textContent = "Говорите…";
  try { r.start(); } catch (e) { finish("Не удалось включить микрофон. Попробуйте ещё раз."); }
}

    : PHRASES.map(p => ({ key: "p:" + p[0], front: p[0], ipa: "", back: p[1], approx: "", ex: "", topic: PTOPICS[p[2]] }))

}
function learnedCount(deck = "words") { return deckItems(deck).filter(i => (card(i.key) || {}).b >= 3).length; }
function dueList(deck = "words") { const now = Date.now(); return deckItems(deck).filter(i => { const c = card(i.key); return c && c.d <= now; }); }

const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
function openTab(id) {
  tabs.forEach(t => { const on = t.id === id; t.setAttribute("aria-selected", on); $("#" + t.getAttribute("aria-controls")).hidden = !on; });
  try { localStorage.setItem(KEY + "-tab", id); } catch (e) {}
  if (id === "tab-stats") renderStats();

/* ======================= ТРЕНИРОВКА (карточки) ======================= */
let session = null;
function trainDeck() { return Store.data.settings.deck || "phrases"; }
function buildSession() {
  const deck = trainDeck();
  const due = shuffle(dueList(deck)).slice(0, 40);
  const d = Store.data.daily[today()] || { newDone: 0, reviews: 0 };
  const newLeft = Math.max(0, (Store.data.settings.newPerDay || 12) - d.newDone);
  const fresh = deckItems(deck).filter(i => !card(i.key)).slice(0, newLeft);
  return { deck, queue: [...due, ...fresh], i: 0, flipped: false, right: 0, total: 0 };
}
function renderTrain() {

    <div class="boxes" aria-label="Слова по уровням">${["новые", "уровень 1", "уровень 2", "уровень 3", "уровень 4", "выучено"].map((l, i) => `<span>${l}: <b>${boxes[i]}</b></span>`).join("")}</div>`;

        </div>

        <div class="answer" id="t-ans" ${session.flipped ? "" : "hidden"}>

const MODES = {
  en2ru: "Английский → русский", ru2en: "Русский → английский", audio: "На слух", spell: "Написать слово", errors: "Понять ошибку"
};
let test = null, testMode = "en2ru", testTopic = "all";
function renderTests() {
  const p = $("#p-tests");
  if (!test) {
    p.innerHTML = `<p class="lead">10 вопросов. Результат сохраняется в «Прогрессе». Слова, в которых вы ошиблись, сразу попадают в тренировку на повтор.</p>
      <h2 class="section-title">Вид теста</h2>
      <div class="filters" role="group" aria-label="Вид теста">${Object.entries(MODES).map(([k, v]) => `<button data-m="${k}" aria-pressed="${testMode === k}">${v}</button>`).join("")}</div>
      <h2 class="section-title">Тема</h2>
      <div class="filters" role="group" aria-label="Тема теста"><button data-t="all" aria-pressed="${testTopic === "all"}">Все слова</button><button data-t="learned" aria-pressed="${testTopic === "learned"}">Только то, что учу</button>${Object.entries(TOPICS).map(([k, v]) => `<button data-t="${k}" aria-pressed="${testTopic === k}">${v}</button>`).join("")}</div>
      <button class="btn primary" id="t-start">Начать тест</button>`;
    p.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { testMode = b.dataset.m; renderTests(); });
    p.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { testTopic = b.dataset.t; renderTests(); });
    $("#t-start").onclick = startTest;
    return;
  }
  if (test.i >= test.qs.length) {
    const pct = Math.round(test.right / test.qs.length * 100);
    p.innerHTML = `<div class="card big-card"><div class="en">${test.right} из ${test.qs.length}</div>
      <p>${pct >= 90 ? "Отлично!" : pct >= 70 ? "Хорошо. Ошибки ушли в тренировку." : "Нужно повторить. Ошибки ушли в тренировку."}</p>
      ${test.wrong.length ? `<div class="gloss" style="justify-content:center">${test.wrong.map(x => `<span><b>${esc(x[0])}</b> — ${esc(x[1])}</span>`).join("")}</div>` : ""}
      <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="t-menu">Другой тест</button><button class="btn primary" id="t-again">Ещё раз</button></div></div>`;
    $("#t-menu").onclick = () => { test = null; renderTests(); };
    $("#t-again").onclick = startTest;
    return;
  }
  const q = test.qs[test.i];
  p.innerHTML = `<div class="progress" aria-hidden="true"><i style="width:${(test.i / test.qs.length) * 100}%"></i></div>
    <p class="note" style="margin:6px 0 12px">${MODES[test.mode]} · вопрос ${test.i + 1} из ${test.qs.length} · верно: ${test.right}</p>
    <div class="card big-card">
      <div class="${q.promptClass || "en"}">${q.prompt}</div>
      ${q.sub ? `<div class="ipa">${q.sub}</div>` : ""}
      ${q.audio ? `<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="q-play">${SPK} Ещё раз</button></div>` : ""}
      ${q.opts ? `<div class="opts">${q.opts.map((o, i) => `<button data-i="${i}">${esc(o)}</button>`).join("")}</div>`
        : `<div class="row" style="justify-content:center;margin-top:14px"><input type="text" id="q-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="напишите по-английски" style="max-width:280px;flex:1"><button class="btn primary" id="q-ok">Проверить</button></div>`}
      <div class="verdict" id="q-v" aria-live="polite"></div>
      <div class="row" style="justify-content:center"><button class="btn primary" id="q-next" hidden>Дальше</button></div>
    </div>`;
  if (q.audio) { $("#q-play").onclick = () => speak(q.audio); speak(q.audio); }
  const finish = ok => {
    const v = $("#q-v");
    v.className = "verdict " + (ok ? "ok" : "bad");
    v.textContent = ok ? "Верно" : "Правильно: " + q.answerText;
    if (q.word) {
      speak(q.word[0]);
      if (!ok) { test.wrong.push([q.word[0], q.word[3]]); const c = card(q.word[0]) || { b: 1, ok: 0, bad: 0 }; c.b = 1; c.bad = (c.bad || 0) + 1; c.d = Date.now(); Store.data.cards[q.word[0]] = c; }
    } else if (!ok) test.wrong.push([q.answerText.slice(0, 40), "ошибка"]);
    if (ok) test.right++;
    $("#q-next").hidden = false; $("#q-next").focus();
  };
  $("#q-next").onclick = () => { test.i++; if (test.i >= test.qs.length) saveTest(); renderTests(); };
  if (q.opts) {
    p.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
      if (!$("#q-next").hidden) return;
      const i = +b.dataset.i;
      p.querySelectorAll(".opts button").forEach(x => { x.disabled = true; if (+x.dataset.i === q.correct) x.classList.add("right"); });
      if (i !== q.correct) b.classList.add("wrong");
      finish(i === q.correct);
    });
  } else {
    const inp = $("#q-in"); inp.focus();
    const check = () => { if (!$("#q-next").hidden) return; inp.disabled = true; finish(inp.value.trim().toLowerCase() === q.answerText.toLowerCase()); };
    $("#q-ok").onclick = check; inp.onkeydown = e => { if (e.key === "Enter") check(); };
  }
}
function pool() {
  if (testTopic === "learned") { const l = W.filter(w => card(w[0])); return l.length >= 4 ? l : W; }
  return testTopic === "all" ? W : W.filter(w => w[4] === testTopic);
}
function startTest() {
  const mode = testMode;
  let qs;
  if (mode === "errors") {
    qs = shuffle(ERRORS).slice(0, 10).map(e => {
      const others = shuffle(ERRORS.filter(x => x !== e)).slice(0, 3).map(x => x[1]);
      const opts = shuffle([e[1], ...others]);
      return { prompt: `<span class="err" style="display:block;text-align:left">${esc(e[0])}</span>`, promptClass: "", opts, correct: opts.indexOf(e[1]), answerText: e[1] };
    });
  } else {
    const base = pool();
    qs = shuffle(base).slice(0, 10).map(w => {
      const same = shuffle(W.filter(x => x !== w && x[4] === w[4]));
      const dis = (same.length >= 3 ? same : shuffle(W.filter(x => x !== w))).slice(0, 3);
      if (mode === "en2ru") { const opts = shuffle([w[3], ...dis.map(x => x[3])]); return { word: w, prompt: esc(w[0]), sub: "/" + esc(w[1]) + "/", opts, correct: opts.indexOf(w[3]), answerText: w[3] }; }
      if (mode === "ru2en") { const opts = shuffle([w[0], ...dis.map(x => x[0])]); return { word: w, prompt: esc(w[3]), promptClass: "tr", opts, correct: opts.indexOf(w[0]), answerText: w[0] }; }
      if (mode === "audio") { const opts = shuffle([w[3], ...dis.map(x => x[3])]); return { word: w, prompt: "Что прозвучало?", promptClass: "tr", audio: w[0], opts, correct: opts.indexOf(w[3]), answerText: w[0] + " — " + w[3] }; }
      return { word: w, prompt: esc(w[3]), promptClass: "tr", sub: "/" + esc(w[1]) + "/", answerText: w[0] };
    });
  }
  test = { mode, qs, i: 0, right: 0, wrong: [] };
  renderTests();
}
function saveTest() {
  Store.data.tests.unshift({ t: Date.now(), mode: test.mode, right: test.right, total: test.qs.length });
  Store.data.tests = Store.data.tests.slice(0, 60);
  Store.save(); updateChips();
}

function streak() {
  let n = 0; const d = new Date();
  for (;;) { const k = d.toISOString().slice(0, 10); const x = Store.data.daily[k]; if (x && (x.newDone || x.reviews)) { n++; d.setDate(d.getDate() - 1); } else break; }
  return n;
}

let phraseTopic = "meet";
function renderPhrases() {
  const p = $("#p-phrases");
  const list = PHRASES.filter(x => x[2] === phraseTopic);
  p.innerHTML = `<p class="lead">Готовые фразы для живого разговора. Слушайте, повторяйте вслух, проверяйте произношение. Все они автоматически попадают в «Тренировку» (колода «Разговорные фразы»).</p>
    <div class="filters" role="group" aria-label="Темы фраз">${Object.entries(PTOPICS).map(([k, v]) => `<button data-t="${k}" aria-pressed="${phraseTopic === k}">${v}</button>`).join("")}</div>
    <div class="grid" style="grid-template-columns:1fr">${list.map((x, i) => {
      const c = card("p:" + x[0]);
      return `<div class="card"><div class="word"><span class="en" style="font-size:18px">${esc(x[0])}</span><span class="chip">${!c ? "новая" : c.b >= 3 ? "выучена" : "учу"}</span></div>
        <div class="tr">${esc(x[1])}</div>
        <div class="row" style="margin-top:8px"><button class="btn small" data-say="${i}">${SPK} Послушать</button><button class="btn small" data-slow="${i}">${SPK} Медленно</button><button class="btn small" data-mic="${i}">${MIC} Сказать</button></div>
        <div class="mic-heard" id="ph-${i}" aria-live="polite"></div></div>`; }).join("")}</div>`;
  p.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { phraseTopic = b.dataset.t; renderPhrases(); });
  p.querySelectorAll("[data-say]").forEach(b => b.onclick = () => speak(list[+b.dataset.say][0]));
  p.querySelectorAll("[data-slow]").forEach(b => b.onclick = () => speak(list[+b.dataset.slow][0], 0.55));
  p.querySelectorAll("[data-mic]").forEach(b => b.onclick = () => listen(list[+b.dataset.mic][0], $("#ph-" + b.dataset.mic), b));
}

   ["Три способа", "<ul><li><b>will</b> — решение в момент речи, обещание, прогноз: <i>I'll call you. It will rain.</i></li><li><b>be going to</b> — план, решили заранее: <i>I'm going to buy a car.</i></li><li><b>Present Continuous</b> — договорились на время: <i>I'm meeting him at six.</i></li></ul>"],
   ["will", "<p>Одна форма для всех: <i>I / you / he will work</i>. Сокращение <b>'ll</b>. Отрицание <b>won't</b> (= will not). Вопрос: <i>Will you help me?</i> После will глагол без to.</p>"],
   ["going to", "<p><b>am / is / are + going to + глагол</b>: <i>She is going to study. Are you going to come?</i></p>"],
   ["Как выбрать", T(["Ситуация", "Как сказать"], [["Звонит телефон: «Я возьму!»", "I'll get it. (решил сейчас)"], ["«Летом поеду в Италию» (уже купил билеты)", "I'm going to travel to Italy."], ["«Встречаюсь с ним в 6» (договорились)", "I'm meeting him at six."]])],
   ["После when и if — настоящее", "<p>«Когда приду, позвоню» → <i>When I <b>come</b>, I'll call you</i>, а не <i>When I will come</i>. Это частая ошибка, потому что в русском там будущее.</p>"]],
  examples: [["I'll call you later.", "Я позвоню тебе позже."], ["It will be cold tomorrow.", "Завтра будет холодно."], ["I won't forget, I promise.", "Не забуду, обещаю."], ["I'm going to learn English.", "Я собираюсь выучить английский."], ["Are you going to come?", "Ты собираешься прийти?"], ["When I get home, I'll text you.", "Когда приду домой, напишу тебе."]],
  mistakes: [["I will to call you.", "I will call you.", "После will — без to."], ["When I will come, I call.", "When I come, I'll call.", "После when — настоящее."], ["I going to buy.", "I am going to buy.", "Нужен am."]],

   { t: "choose", q: "We are going ___ visit them.", o: ["to", "for", "at"], a: 0, why: "going to + глагол." },
   { t: "choose", q: "I ___ forget, I promise.", o: ["don't", "won't", "not"], a: 1, why: "won't = will not." },

{ title: "Могу, должен, хочу: модальные глаголы", goal: "Просить, предлагать, говорить вежливо.",
  blocks: [
   ["Что это", "<p>Глаголы, которые показывают отношение к действию: могу, должен, стоит, хотел бы. После большинства из них глагол идёт <b>без to</b>.</p>"],
   ["Главные", T(["Глагол", "Значение", "Пример"], [["can / can't", "могу, умею / не могу", "I can swim."], ["could", "мог; вежливо «не могли бы»", "Could you help me?"], ["must", "должен (сам считаю нужным, строго)", "I must go."], ["have to", "приходится (обстоятельства)", "I have to work on Saturday."], ["should", "стоит, следует (совет)", "You should rest."], ["would like (I'd like)", "хотел бы, вежливо", "I'd like a coffee."], ["want to", "хочу", "I want to sleep."]])],
   ["Вопрос и отрицание", "<p>У can, must, should — сами: <i>Can you...? I can't. You shouldn't.</i> У have to — через do: <i>Do you have to work? I don't have to.</i></p>"],
   ["Вежливость в разговоре", "<p>Вместо <i>want</i> чаще говорят <i>would like</i>, вместо <i>can</i> — <i>could</i>: <i>Could you repeat, please? I'd like the bill.</i> Это звучит естественно и вежливо.</p>"]],
  examples: [["Can you help me?", "Можешь мне помочь?"], ["Could you repeat that, please?", "Не могли бы вы повторить?"], ["I have to go now.", "Мне пора идти."], ["You should see a doctor.", "Тебе стоит сходить к врачу."], ["I'd like a table for two.", "Я бы хотел столик на двоих."], ["I can't hear you.", "Я тебя не слышу."]],
  mistakes: [["I can to swim.", "I can swim.", "После can — без to."], ["He cans speak.", "He can speak.", "can не меняется по лицам."], ["I must to go.", "I must go.", "После must — без to."]],

   { t: "choose", q: "You look tired. You ___ rest.", o: ["should", "must to", "can to"], a: 0, why: "Совет — should, без to." },

   { t: "build", ru: "Не могли бы вы мне помочь?", en: "Could you help me" },
   { t: "build", ru: "Мне надо идти.", en: "I have to go" },

{ title: "Артикли a / the и there is", goal: "Справиться с самой частой ошибкой русскоговорящих.",
  blocks: [
   ["Зачем артикли", "<p>В русском их нет, поэтому это главная ошибка русскоговорящих. Простое правило: <b>a / an</b> — «один, какой-то, упоминаем впервые»; <b>the</b> — «тот самый, понятно какой».</p>"],
   ["a или an", "<p><b>a</b> перед согласным звуком: <i>a car, a big house</i>. <b>an</b> перед гласным звуком: <i>an apple, an engineer, an hour</i>.</p>"],
   ["Когда the", "<ul><li>уже упоминали: <i>I bought a car. The car is red.</i></li><li>единственный в своём роде: <i>the sun, the internet</i></li><li>понятно из ситуации: <i>Close the door.</i></li></ul>"],
   ["Когда без артикля", "<ul><li>множественное в общем смысле: <i>I like cats.</i></li><li>неисчисляемое: <i>I drink coffee. I need money.</i></li><li>имена, города, страны, языки: <i>Moscow, Russia, English.</i></li></ul>"],
   ["There is / there are", "<p>«Есть, имеется где-то»: <i>There is a pharmacy near here. There are two cafes on this street.</i> Вопрос: <i>Is there a toilet here? Are there any shops?</i> Отрицание: <i>There isn't any milk.</i></p>"]],
  examples: [["I have an idea.", "У меня есть идея."], ["I bought a car. The car is red.", "Я купил машину. Машина красная."], ["Close the door, please.", "Закрой дверь, пожалуйста."], ["There is a problem with the server.", "Есть проблема с сервером."], ["Is there a pharmacy near here?", "Здесь рядом есть аптека?"], ["There are a lot of people here.", "Здесь много людей."]],
  mistakes: [["I am engineer.", "I am an engineer.", "Профессия — с a / an."], ["There is two cafes.", "There are two cafes.", "Много → there are."], ["I like the cats.", "I like cats.", "В общем смысле — без артикля."]],
  ex: [{ t: "choose", q: "There ___ two banks on this street.", o: ["is", "are", "be"], a: 1, why: "Два → there are." },
   { t: "choose", q: "___ there a toilet here?", o: ["Is", "Are", "Do"], a: 0, why: "Один туалет → is there." },
   { t: "choose", q: "I have ___ idea.", o: ["a", "an", "the"], a: 1, why: "idea начинается с гласного звука → an." },
   { t: "choose", q: "Close ___ door, please.", o: ["a", "an", "the"], a: 2, why: "Понятно, какая дверь → the." },
   { t: "choose", q: "I need ___ money.", o: ["a", "the", "без артикля"], a: 2, why: "money неисчисляемое: без артикля." },
   { t: "build", ru: "Здесь рядом есть аптека?", en: "Is there a pharmacy near here" },
   { t: "tr", ru: "Я инженер.", en: "I am an engineer", alt: ["I'm an engineer"] }] },
{ title: "Present Perfect: опыт и результат", goal: "Спрашивать «ты когда-нибудь…?» и говорить «я уже…».",
  blocks: [
   ["Зачем", "<p>Одно из самых разговорных времён:</p><ul><li>опыт: <i>Have you ever been to London?</i></li><li>результат сейчас: <i>I've lost my keys</i> (и сейчас их нет)</li><li>уже / ещё не: <i>I've already eaten. I haven't finished yet.</i></li></ul>"],
   ["Формула", "<p><b>have / has + третья форма глагола</b>: <i>I have worked, she has seen.</i> У правильных третья форма тоже с -ed. Неправильные: go – went – <b>gone</b>, see – saw – <b>seen</b>, do – did – <b>done</b>, be – was – <b>been</b>, eat – ate – <b>eaten</b>, buy – bought – <b>bought</b>.</p>"],
   ["Отрицание и вопрос", "<p><i>I haven't seen it. Has she called? Have you ever...? — Yes, I have. / No, I haven't.</i></p>"],
   ["Perfect или Past?", T(["Past Simple", "Present Perfect"], [["есть точное время: yesterday, in 2020, last week", "время не важно, важен опыт или результат"], ["I saw him yesterday.", "I have seen this film."]]) + "<p>Слова-подсказки Perfect: <b>ever, never, already, yet, just, recently</b>.</p>"]],
  examples: [["Have you ever been to London?", "Ты когда-нибудь был в Лондоне?"], ["I've never tried sushi.", "Я никогда не пробовал суши."], ["I've lost my keys.", "Я потерял ключи."], ["She has already left.", "Она уже ушла."], ["I haven't finished yet.", "Я ещё не закончил."], ["I've just arrived.", "Я только что приехал."]],
  mistakes: [["I have seen him yesterday.", "I saw him yesterday.", "С yesterday — Past Simple."], ["Have you ever went there?", "Have you ever been there?", "Нужна третья форма: been."], ["She have finished.", "She has finished.", "she → has."]],

   { t: "choose", q: "I ___ him yesterday.", o: ["have seen", "saw", "see"], a: 1, why: "yesterday → Past Simple." },
   { t: "choose", q: "She ___ already left.", o: ["have", "has", "is"], a: 1, why: "she → has." },
   { t: "choose", q: "I haven't finished ___.", o: ["yet", "already", "ever"], a: 0, why: "В отрицании «ещё не» — yet." },
   { t: "build", ru: "Я никогда не был в Лондоне.", en: "I have never been to London" },
   { t: "tr", ru: "Я потерял ключи.", en: "I have lost my keys", alt: ["I've lost my keys", "I lost my keys"] }] },
{ title: "Система времён: как не запутаться", goal: "Увидеть всю картину и понять, какие времена нужны для общения.",
  blocks: [
   ["Не пугайтесь «12 времён»", "<p>Их можно разложить по таблице: <b>когда</b> (настоящее, прошлое, будущее) × <b>как</b> (Simple — факт, Continuous — процесс, Perfect — результат).</p>" + T(["", "Simple (факт)", "Continuous (процесс)", "Perfect (результат)"], [["Настоящее", "I work", "I am working", "I have worked"], ["Прошлое", "I worked", "I was working", "I had worked"], ["Будущее", "I will work", "I will be working", "I will have worked"]])],
   ["Что нужно для общения", "<p>Для уровня A2 хватит пяти: <b>Present Simple, Present Continuous, Past Simple, будущее (will / going to), Present Perfect</b>. Это около 90% разговорной речи. Остальные достаточно узнавать, когда читаете или слушаете.</p>"],

   ["Как выбрать время: 3 вопроса", "<ol><li>Когда? Сейчас, в прошлом или в будущем.</li><li>Факт и привычка или процесс в конкретный момент?</li><li>Важен результат к настоящему моменту (уже, никогда, когда-нибудь)?</li></ol>"]],
  examples: [["I work in IT.", "Я работаю в IT."], ["I'm working now.", "Я сейчас работаю."], ["I worked yesterday.", "Я работал вчера."], ["I was working when you called.", "Я работал, когда ты позвонил."], ["I've worked here for five years.", "Я работаю здесь пять лет."], ["I'll work tomorrow.", "Я буду работать завтра."]],
  mistakes: [["I am work here five years.", "I've worked here for five years.", "Длится до сих пор → Present Perfect + for."]],

   { t: "choose", q: "Сейчас: «Тише, ребёнок ___».", o: ["sleeps", "is sleeping", "slept"], a: 1, why: "В эту минуту → Continuous." },
   { t: "choose", q: "Вчера: «Я ___ его».", o: ["see", "saw", "have seen"], a: 1, why: "Есть «вчера» → Past Simple." },
   { t: "choose", q: "Опыт: «Ты ___ суши?»", o: ["Did you ever try", "Have you ever tried", "Do you ever try"], a: 1, why: "Опыт в жизни → Present Perfect." },
   { t: "choose", q: "«Я ___, когда ты позвонил».", o: ["slept", "was sleeping", "sleep"], a: 1, why: "Процесс в прошлом, прерванный → Past Continuous." }] },

let gOpen = null, gEx = null;
function gProg() { return Store.data.grammar || (Store.data.grammar = {}); }
function renderGrammar() {
  const p = $("#p-grammar");
  if (gOpen == null) {
    p.innerHTML = `<p class="lead">Уроки как у преподавателя: объяснение, формулы, сравнение с русским, частые ошибки и упражнения с разбором. Проходите по порядку: каждый следующий опирается на предыдущий.</p>
      <div class="grid" style="grid-template-columns:1fr">${GRAMMAR.map((g, i) => { const s = gProg()[i];
        return `<button class="card lesson-btn" data-g="${i}"><span class="num">${i + 1}</span><span><b>${esc(g.title)}</b><br><span class="note">${esc(g.goal)}</span></span><span class="chip">${s ? s.best + "/" + g.ex.length : "не начат"}</span></button>`; }).join("")}</div>`;
    p.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { gOpen = +b.dataset.g; gEx = null; renderGrammar(); window.scrollTo(0, 0); });
    return;
  }
  const g = GRAMMAR[gOpen];
  p.innerHTML = `<button class="btn small" id="g-back">← Все уроки</button>
    <p class="note" style="margin:14px 0 4px">Урок ${gOpen + 1} из ${GRAMMAR.length}</p><h2 class="g-title">${esc(g.title)}</h2><p class="lead">${esc(g.goal)}</p>
    ${g.blocks.map(([h, html]) => `<div class="card teach"><h3>${esc(h)}</h3>${html}</div>`).join("")}
    <div class="card teach"><h3>Примеры: послушайте и повторите вслух</h3>${g.examples.map((e, i) => `<div class="ex-line"><button class="btn small" data-ge="${i}" aria-label="Послушать">${SPK}</button><div><div class="en-line">${esc(e[0])}</div><div class="note">${esc(e[1])}</div></div></div>`).join("")}</div>
    <div class="card teach"><h3>Частые ошибки</h3>${T(["Неверно", "Верно", "Почему"], g.mistakes.map(m => [`<s>${esc(m[0])}</s>`, `<b>${esc(m[1])}</b>`, esc(m[2])]))}</div>
    <div class="card teach" id="g-ex"></div>`;
  $("#g-back").onclick = () => { gOpen = null; renderGrammar(); window.scrollTo(0, 0); };
  p.querySelectorAll("[data-ge]").forEach(b => b.onclick = () => speak(g.examples[+b.dataset.ge][0]));
  renderGEx();
}
function renderGEx() {
  const g = GRAMMAR[gOpen], box = $("#g-ex");
  if (!gEx) { box.innerHTML = `<h3>Упражнения</h3><p>${g.ex.length} заданий. После каждого ответа — объяснение.</p><button class="btn primary" id="gx-start">Начать упражнения</button>`; $("#gx-start").onclick = () => { gEx = { i: 0, right: 0 }; renderGEx(); }; return; }
  if (gEx.i >= g.ex.length) {
    const s = gProg(); s[gOpen] = { best: Math.max((s[gOpen] || {}).best || 0, gEx.right), at: Date.now() }; Store.save();

      <div class="row"><button class="btn" id="gx-again">Ещё раз</button>${gOpen < GRAMMAR.length - 1 ? `<button class="btn primary" id="gx-next">Следующий урок →</button>` : ""}</div>`;
    $("#gx-again").onclick = () => { gEx = { i: 0, right: 0 }; renderGEx(); };

    return;
  }
  const e = g.ex[gEx.i];
  const head = `<h3>Задание ${gEx.i + 1} из ${g.ex.length}</h3>`;
  const after = (ok, html) => {
    if (ok) gEx.right++;
    $("#gx-fb").innerHTML = `<div class="explain"><b class="${ok ? "ok" : "bad"}">${ok ? "Верно." : "Не совсем."}</b> ${html}</div><div class="row" style="margin-top:10px"><button class="btn primary" id="gx-n">Дальше</button></div>`;

    let done = false;
    box.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
      if (done) return; done = true;
      const i = +b.dataset.i;
      box.querySelectorAll(".opts button").forEach(x => { x.disabled = true; if (+x.dataset.i === e.a) x.classList.add("right"); });

      after(i === e.a, esc(e.why));

      box.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { picked.push(pool.splice(+b.dataset.p, 1)[0]); draw(); });
      box.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { pool.push(picked.splice(+b.dataset.k, 1)[0]); draw(); });
      $("#gx-reset").onclick = () => { pool = shuffle(words.map((w, i) => ({ w, i }))); picked = []; draw(); };
      $("#gx-check").onclick = () => {
        const ok = normText(picked.map(x => x.w).join(" ")) === normText(e.en);
        box.querySelectorAll(".chip-w, #gx-reset, #gx-check").forEach(x => x.disabled = true);
        speak(e.en);
        after(ok, ok ? "Порядок слов правильный: " + esc(e.en) + "." : "Правильно: <b>" + esc(e.en) + "</b>. Сверьте порядок: кто → что делает → остальное.");
      };
    };
    draw();
  } else {
    box.innerHTML = head + `<p>Переведите на английский: <b>${esc(e.ru)}</b></p>
      <div class="row"><input type="text" id="gx-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Напишите или скажите" style="flex:1;min-width:200px"><button class="btn" id="gx-mic">${MIC} Сказать</button><button class="btn primary" id="gx-ok">Проверить</button></div>
      <div class="mic-heard" id="gx-heard" aria-live="polite"></div><div id="gx-fb" aria-live="polite"></div>`;
    const inp = $("#gx-in");
    const check = () => {
      if (!inp.value.trim()) return;
      const answers = [e.en, ...(e.alt || [])];
      const best = Math.max(...answers.map(a => Math.min(similarity(a, inp.value), similarity(inp.value, a))));

    };
    $("#gx-ok").onclick = check; inp.onkeydown = ev => { if (ev.key === "Enter") check(); };
    $("#gx-mic").onclick = ev => listenFree($("#gx-heard"), ev.currentTarget, text => { inp.value = text; });
  }
}
// Диктовка без проверки: распознанный текст подставляется в поле ответа
function listenFree(outEl, btn, onText) {
  if (activeRec) { activeRec.finish("Остановлено."); return; }
  if (!SR) { outEl.textContent = "Распознавание речи недоступно в этом браузере. Напишите ответ."; return; }
  try { speechSynthesis.cancel(); } catch (e) {}
  const r = new SR(); r.lang = "en-US"; r.interimResults = true; r.continuous = false;
  const label = btn.innerHTML; let text = "", done = false, timer;
  const finish = msg => { if (done) return; done = true; activeRec = null; clearTimeout(timer); try { r.abort(); } catch (e) {} btn.innerHTML = label; btn.classList.remove("primary"); outEl.textContent = msg || (text ? "Распознано, проверьте текст и нажмите «Проверить»." : "Ничего не услышал."); if (text) onText(text); };
  activeRec = { finish };
  r.onresult = ev => { const res = ev.results[ev.results.length - 1]; text = res[0].transcript.trim(); outEl.textContent = "Слышу: " + text; onText(text); if (res.isFinal) finish(); };
  r.onerror = ev => finish(ev.error === "not-allowed" ? "Нет доступа к микрофону." : "Не получилось, попробуйте ещё раз.");
  r.onend = () => finish();
  timer = setTimeout(() => { try { r.stop(); } catch (e) {} setTimeout(() => finish(), 1200); }, 9000);
  btn.textContent = "Стоп"; btn.classList.add("primary"); outEl.textContent = "Говорите…";
  try { r.start(); } catch (e) { finish("Не удалось включить микрофон."); }
}

function speakSeq(lines, i, done) {

  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(lines[i]); u.lang = "en-US"; if (voice) u.voice = voice; u.rate = Store.data.settings.rate || 0.85;

      <p class="note" style="margin:8px 0 0">Задание недели: ${esc(task)}</p></div>`).join("")}</div>`;
  p.querySelectorAll("[data-pg]").forEach(b => b.onclick = () => { gOpen = +b.dataset.pg; gEx = null; renderGrammar(); openTab("tab-grammar"); });
  p.querySelectorAll("[data-pp]").forEach(b => b.onclick = () => { phraseTopic = b.dataset.pp; renderPhrases(); openTab("tab-phrases"); });
  p.querySelectorAll("[data-pd]").forEach(b => b.onclick = () => { dOpen = +b.dataset.pd; role = null; renderDialogs(); openTab("tab-dialogs"); });
}

/* ======================= ЗАПУСК ======================= */
/* ======================= ПЕРЕВОДЧИК (нейросеть прямо в телефоне) =======================
   Модели Opus-MT (Helsinki-NLP, сжатые ONNX-версии Xenova) лежат в папке models рядом с приложением.
   Библиотека Transformers.js выполняет их в браузере; после первой загрузки всё работает без интернета. */
const TJS = "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";
const MT = { ru: "Xenova/opus-mt-ru-en", en: "Xenova/opus-mt-en-ru" };
const mtCache = {};
let trLib = null, trFrom = "auto", trBusy = false;
async function getTranslator(from, onProgress) {
  if (mtCache[from]) return mtCache[from];
  if (!trLib) {
    trLib = await import(TJS);
    trLib.env.allowRemoteModels = false;
    trLib.env.allowLocalModels = true;
    trLib.env.localModelPath = new URL("models/", location.href).href;
    trLib.env.useBrowserCache = true;
  }
  const files = {};
  mtCache[from] = trLib.pipeline("translation", MT[from], {
    quantized: true,
    progress_callback: p => {
      if (p.status === "progress" && p.total) { files[p.file] = [p.loaded, p.total]; const v = Object.values(files); onProgress(v.reduce((a, x) => a + x[0], 0), v.reduce((a, x) => a + x[1], 0)); }
    }
  }).catch(e => { delete mtCache[from]; throw e; });
  return mtCache[from];
}
function detectLang(text) { const cyr = (text.match(/[а-яё]/gi) || []).length, lat = (text.match(/[a-z]/gi) || []).length; return cyr >= lat ? "ru" : "en"; }
function splitSentences(text) { return text.replace(/\s+/g, " ").trim().match(/[^.!?…]+[.!?…]*\s*/g) || [text]; }
function renderTranslator() {
  const p = $("#p-tr");
  p.innerHTML = `<p class="lead">Переводчик работает прямо в телефоне: внутри приложения небольшая нейросеть. Текст никуда не отправляется, после первой загрузки перевод работает без интернета.</p>
    <div class="filters" role="group" aria-label="Направление"><button data-f="auto" aria-pressed="${trFrom === "auto"}">Автоопределение</button><button data-f="ru" aria-pressed="${trFrom === "ru"}">Русский → английский</button><button data-f="en" aria-pressed="${trFrom === "en"}">Английский → русский</button></div>
    <div class="card"><textarea id="tr-in" class="tr-area" placeholder="Введите текст или фразу" aria-label="Текст для перевода">${esc(Store.data.trDraft || "")}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="tr-go">Перевести</button><button class="btn" id="tr-mic">${MIC} Сказать по-английски</button><button class="btn" id="tr-clear">Очистить</button></div>
      <div class="mic-heard" id="tr-status" aria-live="polite"></div>
      <div class="progress" id="tr-prog" hidden><i style="width:0%"></i></div></div>
    <div class="card" id="tr-res" hidden style="margin-top:12px"><div class="tr" id="tr-out" style="font-size:19px;white-space:pre-wrap"></div>
      <div class="row" style="margin-top:10px"><button class="btn" id="tr-say">${SPK} Послушать</button><button class="btn" id="tr-copy">Копировать</button><button class="btn" id="tr-save">В мои фразы</button></div></div>
    <p class="note" style="margin-top:14px">Первый перевод в каждую сторону скачивает модель: около 110 МБ, лучше по Wi-Fi. Дальше она хранится в телефоне. Модели — Opus-MT (Хельсинкский университет). Для учёбы и обычных фраз хороши, на сложных текстах уступают Google и DeepL.</p>`;
  const inp = $("#tr-in"), st = $("#tr-status"), prog = $("#tr-prog"), res = $("#tr-res"), out = $("#tr-out");
  let last = null;
  p.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { trFrom = b.dataset.f; Store.data.trDraft = inp.value; renderTranslator(); });
  inp.oninput = () => { Store.data.trDraft = inp.value; };
  $("#tr-clear").onclick = () => { inp.value = ""; Store.data.trDraft = ""; res.hidden = true; st.textContent = ""; inp.focus(); };
  $("#tr-mic").onclick = e => listenFree(st, e.currentTarget, t => { inp.value = t; Store.data.trDraft = t; });
  $("#tr-go").onclick = async () => {
    const text = inp.value.trim(); if (!text || trBusy) return;
    const from = trFrom === "auto" ? detectLang(text) : trFrom;
    trBusy = true; $("#tr-go").disabled = true; res.hidden = true;
    try {
      st.textContent = mtCache[from] ? "Перевожу…" : "Готовлю переводчик…";
      const tr = await getTranslator(from, (done, total) => { prog.hidden = false; prog.firstElementChild.style.width = Math.round(done / total * 100) + "%"; st.textContent = `Загружаю модель перевода: ${Math.round(done / 1048576)} из ${Math.round(total / 1048576)} МБ`; });
      prog.hidden = true; st.textContent = "Перевожу…";
      await new Promise(r => setTimeout(r, 30));   // дать экрану обновиться
      const parts = [];
      for (const s of splitSentences(text)) { const r = await tr(s, { max_new_tokens: 200 }); parts.push(r[0].translation_text); }
      const result = parts.join(" ");
      last = from === "ru" ? { en: result, ru: text } : { en: text, ru: result };
      out.textContent = result; res.hidden = false; st.textContent = from === "ru" ? "Русский → английский" : "Английский → русский";
      Store.save();
    } catch (e) {
      prog.hidden = true;
      st.textContent = "Не удалось загрузить переводчик. Для первой загрузки нужен интернет. Попробуйте ещё раз.";
    } finally { trBusy = false; $("#tr-go").disabled = false; }
  };
  $("#tr-say").onclick = () => last && speak(last.en);
  $("#tr-copy").onclick = e => { const b = e.currentTarget, t = out.textContent; const ok = () => { b.textContent = "Скопировано"; setTimeout(() => b.textContent = "Копировать", 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, () => {}); };
  $("#tr-save").onclick = e => {
    if (!last) return;
    const my = Store.data.myPhrases || (Store.data.myPhrases = []);
    if (!my.some(x => x[0] === last.en)) my.push([last.en, last.ru]);
    Store.save(); updateChips(); e.currentTarget.textContent = "Добавлено в тренировку";
  };
}

function renderAll() { renderPlan(); renderTrain(); renderPhrases(); renderGrammar(); renderDialogs(); renderTranslator(); renderWords(); renderSounds(); renderErrors(); renderTests(); updateChips(); if (!$("#p-stats").hidden) renderStats(); }
Store.loadLocal();
renderAll();
try { const t = localStorage.getItem(KEY + "-tab"); if (t && document.getElementById(t)) openTab(t); } catch (e) {}
Store.initServer().then(ok => { if (!ok) Store.initCloud(); });
</script>
