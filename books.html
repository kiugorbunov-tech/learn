<style>
/* Layout: читательский столбец ~68 знаков — шапка «Сегодня», разбор книги блоками, библиотека карточками */
:root {
  --bg: #f1f3f6; --surface: #ffffff; --surface2: #e6eaf0; --line: #d3d9e2;
  --fg: #151a22; --muted: #5b6474; --accent: #1d5c8f; --accent-ink: #ffffff; --gold: #9a6a12;
  --ok: #1d7a3e; --bad: #b42318;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1216; --surface: #171b21; --surface2: #20262e; --line: #2d3540;
  --fg: #e7ebf1; --muted: #9aa4b3; --accent: #7fb6e6; --accent-ink: #0b1a28; --gold: #e2b45a; --ok: #55cf7d; --bad: #ff7b6e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #171b21; --surface2: #20262e; --line: #2d3540;
  --fg: #e7ebf1; --muted: #9aa4b3; --accent: #7fb6e6; --accent-ink: #0b1a28; --gold: #e2b45a; --ok: #55cf7d; --bad: #ff7b6e; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 16px/1.6 var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 760px; margin: 0 auto }
header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; padding-block: 22px 12px }
h1 { font: 800 clamp(22px, 4.6vw, 30px)/1.1 var(--f-display); margin: 0 }
h1 small { display: block; font: 400 14px var(--f-ui); color: var(--muted); margin-top: 6px }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 18px; scrollbar-width: none }

button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.panel[hidden] { display: none }
.lead { color: var(--muted); margin: 0 0 14px }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 8px 14px; font: 600 14px var(--f-ui); cursor: pointer }
.btn:hover { border-color: var(--accent) } .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }

.case { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin: 0 0 14px }

.three li { margin-bottom: 6px; font-weight: 600 }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0 }
.q { font-weight: 600; margin: 0 0 8px }

.opts button { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 10px 14px; font: 500 15px var(--f-ui); cursor: pointer }
.opts button.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--surface)) }

.explain { font-size: 15px; color: var(--muted); margin-bottom: 14px }
textarea.notes { width: 100%; min-height: 120px; resize: vertical; font: 16px/1.5 var(--f-read); padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg) }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px }
.filters button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 12px; font: 500 14px var(--f-ui); cursor: pointer }
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.lib { display: grid; gap: 10px }
.lib button { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--fg); font: inherit; cursor: pointer; width: 100% }
.lib button:hover { border-color: var(--accent) }
.lib .n { font: 800 16px var(--f-display); color: var(--accent); text-align: center; font-variant-numeric: tabular-nums }
.lib .t { font-weight: 700 } .lib .a { color: var(--muted); font-size: 14px }
.done { color: var(--ok); font-weight: 700 }
.stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); margin-bottom: 16px }
.stat .v { font: 800 28px var(--f-display); font-variant-numeric: tabular-nums } .stat .l { color: var(--muted); font-size: 13px }
.note { font-size: 13px; color: var(--muted) }
.bar { height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden } .bar > i { display: block; height: 100%; background: var(--accent) }
</style>

<script>
/* ======================= КНИГИ =======================
   Разборы написаны своими словами. Поля: t — название, a — автор, y — год, cat — тема, min — минут чтения,
   about — о чём, why — почему читают руководители, ideas — [заголовок, текст], apply — что сделать сегодня,
   limits — ограничения и критика, keep — мысль для запоминания, quiz — [вопрос, [варианты], верный, пояснение] */
const CATS = { lead: "Лидерство и управление", strat: "Бизнес и стратегия", infl: "Влияние и переговоры", power: "Власть и политика", mind: "Мышление и решения" };
const BOOKS = [
{ t: "Эффективный руководитель", a: "Питер Друкер", y: 1967, cat: "lead", min: 12,
  about: "Друкер, которого называют отцом современного менеджмента, задаётся простым вопросом: почему умные, трудолюбивые люди так часто оказываются неэффективными руководителями? Его ответ: эффективность — не талант, а набор привычек, и им можно научиться так же, как таблице умножения.",
  why: "Это книга о самом дефицитном ресурсе руководителя — его времени и внимании. Она короткая, без воды, и через полвека остаётся первой, которую советуют новым директорам.",
  ideas: [
   ["Эффективность — это делать правильные вещи", "Друкер разводит два понятия: делать вещи правильно (продуктивность) и делать правильные вещи (эффективность). Руководитель может блестяще выполнить работу, которую вообще не стоило делать. Поэтому первый вопрос всегда: «Какой результат от меня нужен организации?», а не «Чем я занят?»"],
   ["Знай, куда уходит твоё время", "Время — единственный ресурс, который нельзя купить, занять или накопить. Друкер предлагает несколько недель честно записывать, на что оно уходит, и почти каждый руководитель удивляется: львиная доля съедается совещаниями, переписками и чужими срочностями. Дальше — три шага: записать, вычистить ненужное, собрать оставшееся свободное время в крупные непрерывные блоки. Важную работу нельзя сделать урывками по 15 минут."],
   ["Спрашивай: «Какой мой вклад?»", "Эффективный руководитель смотрит не вниз, на свои усилия, а вверх и наружу — на результат для клиентов и организации. Вопрос о вкладе меняет поведение: человек перестаёт гордиться загруженностью и начинает думать, что изменится в мире от его работы."],
   ["Строй на сильных сторонах", "Слабые стороны людей не исправить приказом, а сильные можно использовать. Друкер советует подбирать людей под то, в чём они исключительны, а не за отсутствие недостатков. Друкер любил известную историческую легенду: Линкольн, узнав, что его лучший генерал Грант пьёт, будто бы ответил: «Узнайте, какой виски он пьёт, и пошлите бочку остальным генералам». Важна победа, а не безупречность."],
   ["Первым делом — первое, по одному", "Концентрация — главный секрет эффективности. Руководитель, который делает десять дел одновременно, не доводит до конца ни одного. Друкер добавляет важную мысль: так же важно решить, от чего отказаться. Каждый год стоит спрашивать о каждом проекте: «Если бы мы сейчас этим не занимались, начали бы мы это?» Если нет — проект нужно закрыть."],
   ["Решение — это выбор между мнениями, а не между фактами", "Хорошие решения начинаются не с поиска «правильного» ответа, а со столкновения разных точек зрения. Друкер призывает намеренно искать несогласие: если все согласны сразу, значит, проблему ещё не поняли. И главное: решение не принято, пока не назначен человек, который его выполняет, и срок."]
  ],
  apply: ["Запишите сегодня, на что ушёл каждый час рабочего дня. Вечером отметьте всё, что можно было не делать или отдать.", "Сформулируйте одним предложением свой главный вклад в компанию на этот месяц.", "Выберите один проект, который вы продолжаете по инерции, и задайте вопрос: «Начали бы мы его сегодня?»"],
  limits: "Книга написана для больших корпораций середины XX века: про стартапы, удалённую работу и цифровую перегрузку в ней ничего нет. Примеры старые, а стиль местами суховат. Но принципы о времени и концентрации стали только актуальнее.",
  keep: "Нет ничего бесполезнее, чем эффективно делать то, что вообще не нужно было делать.",
  quiz: [["Чем эффективность отличается от продуктивности по Друкеру?", ["Ничем", "Эффективность — делать правильные вещи, продуктивность — делать вещи правильно", "Продуктивность важнее", "Эффективность — работать больше часов"], 1, "Можно блестяще сделать ненужную работу."],
   ["Что Друкер советует сделать со временем в первую очередь?", ["Купить планировщик", "Честно записать, куда оно уходит", "Работать по выходным", "Делегировать всё"], 1, "Без измерения нет управления."],
   ["Как подбирать людей?", ["За отсутствие недостатков", "Под их сильные стороны", "По стажу", "По рекомендации"], 1, "Слабости не исправить, силу можно использовать."]] },

{ t: "От хорошего к великому", a: "Джим Коллинз", y: 2001, cat: "strat", min: 13,
  about: "Коллинз с командой пять лет изучали компании, которые после десятилетий обычных результатов вдруг стали обгонять рынок в разы и держались так 15 лет. Они сравнили их с похожими компаниями, которым скачок не удался, и искали, что отличает первых.",
  why: "Это одно из немногих исследований менеджмента на данных, а не на историях. Его выводы — про руководителя, людей и дисциплину — неудобные и поэтому полезные.",
  ideas: [
   ["Лидер пятого уровня", "Во главе всех «великих» компаний стояли не харизматичные звёзды, а люди с редким сочетанием: личная скромность плюс железная профессиональная воля. Такие руководители приписывают успех команде и везению, а неудачи — себе. Коллинз называет это «окно и зеркало»: при успехе смотришь в окно (на других), при провале — в зеркало."],
   ["Сначала кто, потом что", "Великие компании сначала собирали нужных людей в «автобусе», убирали ненужных и рассаживали по местам, и только потом решали, куда ехать. Правильные люди сами найдут дорогу и не требуют жёсткого контроля. С неправильными людьми даже лучшая стратегия не сработает."],
   ["Смотри фактам в лицо, но не теряй веру", "Коллинз называет это «парадоксом Стокдейла» — по имени американского адмирала, пережившего восемь лет плена. Выжили не оптимисты, ждавшие освобождения «к Рождеству», а те, кто признавал жестокую реальность и при этом твёрдо верил, что в конце победит. Для компании это значит: создать культуру, где плохие новости доходят до руководства, и не путать веру с самообманом."],
   ["Концепция ежа", "Ёж знает одну большую вещь. Великие компании нашли пересечение трёх кругов: в чём мы можем быть лучшими в мире, что движет нашей экономикой (одна ключевая метрика вроде «прибыль на клиента») и чем мы горим. Всё, что вне пересечения, они отбрасывали — даже прибыльное."],
   ["Культура дисциплины", "Не бюрократия, а дисциплинированные люди, которые думают и действуют дисциплинированно в рамках свободы. Самое трудное в этом — дисциплина отказа: списки «перестать делать» у великих компаний были важнее списков дел."],
   ["Маховик, а не волшебная кнопка", "Снаружи переход выглядел как внезапный прорыв, но изнутри — как долгое последовательное раскручивание тяжёлого маховика в одну сторону. Неудачники, наоборот, метались: новая стратегия, новый директор, слияние, реорганизация — каждый раз маховик останавливался."]
  ],
  apply: ["Назовите людей, которых вы бы взяли в команду снова, и тех, кого нет. Что вы делаете со вторыми?", "Нарисуйте три круга концепции ежа для своего бизнеса. Что не попадает в пересечение?", "Составьте список «перестать делать» из трёх пунктов."],
  limits: "Часть «великих» компаний из книги позже упала (например, Circuit City обанкротилась, Fannie Mae оказалась в центре кризиса 2008 года). Критики говорят об ошибке выжившего: выводы подобраны задним числом. Читайте книгу как набор сильных гипотез, а не законов природы.",
  keep: "Сначала правильные люди, потом правильное направление: с ними маршрут найдётся.",
  quiz: [["Что отличает лидера пятого уровня?", ["Харизма и известность", "Скромность плюс железная воля к результату", "Жёсткий контроль", "Опыт в консалтинге"], 1, "Успех — команде, провал — себе."],
   ["Что такое парадокс Стокдейла?", ["Верить, что всё скоро наладится", "Признавать жестокую реальность и верить в победу", "Не замечать проблем", "Отказаться от целей"], 1, "Оптимисты, ждавшие «к Рождеству», не выжили."],
   ["Концепция ежа — это пересечение…", ["Цены, качества и сроков", "Лучшего в мире, экономического двигателя и страсти", "Рынка, продукта и маркетинга", "Прибыли, выручки и затрат"], 1, "Всё вне пересечения отбрасывали."]] },

{ t: "Государь", a: "Никколо Макиавелли", y: 1532, cat: "power", min: 13,
  about: "Флорентийский чиновник, отстранённый от дел и сосланный в деревню, написал короткое пособие о том, как правитель получает власть и удерживает её. Впервые в европейской мысли о политике рассуждали не так, как должно быть, а так, как есть.",
  why: "Пятьсот лет «Государь» остаётся самым честным текстом о власти. Он объясняет, почему хорошие намерения проигрывают без силы и расчёта, и учит видеть мотивы людей и организаций трезво.",
  ideas: [

   ["Лучше, чтобы боялись, чем любили, — но без ненависти", "Идеально, когда и любят, и боятся, но это редко совпадает. Любовь держится на благодарности, которую люди легко рвут, а страх — на ожидании наказания, которое не исчезает. При этом главный запрет: не вызывать ненависти. Её порождают покушения на имущество и честь подданных."],
   ["Лис и лев", "Правитель должен уметь быть и львом, и лисой. Лев не спасается от ловушек, лиса беззащитна перед волками. Сила без хитрости попадает в западню, хитрость без силы не выдерживает нападения."],
   ["Жестокость — разом, милости — понемногу", "Если неприятные меры неизбежны, их нужно провести быстро и одним пакетом, чтобы потом больше к ним не возвращаться. Благодеяния, наоборот, раздают постепенно, чтобы их лучше чувствовали. Для руководителя это знакомо по сокращениям и реформам: растянутая на год болезненная реформа подрывает доверие сильнее, чем одна решительная."],
   ["Своя армия, а не наёмники", "Наёмники и союзники ненадёжны: они верны, пока им выгодно. Сила должна быть своей. В переводе на язык бизнеса: ключевые компетенции нельзя полностью отдавать на аутсорсинг."],
   ["Фортуна и доблесть", "Половиной наших дел управляет удача, половину оставляет нам. Удача подобна реке в половодье: её не остановить, но плотины строят заранее, в спокойное время. Подготовка в хорошие времена — единственная защита от плохих."]

  apply: ["Вспомните решение, которое вы откладываете, потому что оно неприятно. Можно ли сделать его одним шагом, а не растягивать?", "Определите, какую ключевую компетенцию вашей компании держат «наёмники» — подрядчики, без которых всё встанет.", "Подумайте, какую «плотину» на случай кризиса можно построить в этом месяце, пока всё спокойно."],

{ t: "Как завоёвывать друзей и оказывать влияние на людей", a: "Дейл Карнеги", y: 1936, cat: "infl", min: 11,
  about: "Преподаватель курсов ораторского искусства собрал простые правила общения, которые проверял на тысячах слушателей. Книга разошлась десятками миллионов экземпляров и стала основой всей современной литературы о коммуникации.",
  why: "Руководитель добивается результата через людей. Карнеги объясняет базовую механику: люди действуют из собственных интересов и чувств, а не из логики. Кто это понимает, тому сотрудничают охотнее.",
  ideas: [

   ["Искренне цените людей", "Глубинное желание каждого — чувствовать себя значимым. Искреннее признание (не лесть, а конкретная честная похвала) работает сильнее любых денег. Признание должно быть конкретным: не «молодец», а «то, как ты разобрал жалобу клиента, спасло нам контракт»."],
   ["Говорите о том, чего хочет другой", "Рыбу ловят на червя, а не на клубнику, которую любите вы сами. Чтобы убедить, нужно показать, что получит собеседник, а не что нужно вам."],
   ["Будьте искренне заинтересованы в людях", "Вы заведёте больше друзей за два месяца, интересуясь другими, чем за два года, пытаясь заинтересовать их собой. Запоминайте имена: для человека его имя — самый приятный звук."],
   ["Хороший собеседник — это хороший слушатель", "Люди считают интересным собеседником того, кто внимательно слушает и задаёт вопросы о них. Говорите меньше, спрашивайте больше."],
   ["Избегайте споров и признавайте ошибки сразу", "Спор нельзя выиграть: даже победив, вы получите обиженного человека. Если вы неправы, признайте это быстро и решительно, это обезоруживает. Начинайте с того, в чём вы согласны, и задавайте вопросы, на которые собеседник ответит «да»."],
   ["Дайте человеку сохранить лицо", "Если нужно указать на ошибку, сначала похвалите, указывайте косвенно, говорите о своих ошибках, предлагайте вопросы вместо приказов. Дайте человеку хорошую репутацию, которую он захочет оправдать."]
  ],
  apply: ["Сегодня похвалите одного сотрудника конкретно и искренне за реальное дело.", "На ближайшей встрече задайте собеседнику три вопроса о его задачах, прежде чем говорить о своих.", "Найдите ситуацию, где вы собирались кого-то раскритиковать, и замените критику вопросом."],
  limits: "Советы легко превратить в фальшивую любезность — тогда они работают против вас. Книга почти не говорит о жёстких конфликтах интересов и ситуациях, где нужна прямая твёрдость. Её стоит дополнять «Радикальной откровенностью» и книгами о переговорах.",

  quiz: [["Почему Карнеги против критики?", ["Она незаконна", "Она вызывает защиту и оправдания, а не изменения", "Она отнимает время", "Она всегда неправа"], 1, "Человек защищает свою значимость."],

{ t: "Думай медленно… решай быстро", a: "Даниэль Канеман", y: 2011, cat: "mind", min: 14,
  about: "Нобелевский лауреат по экономике, психолог, подводит итог полувека исследований того, как люди на самом деле принимают решения. Главный вывод: наше мышление состоит из двух систем, и та, которой мы гордимся, работает гораздо реже, чем нам кажется.",
  why: "Руководитель — это прежде всего человек, принимающий решения в условиях неопределённости. Канеман показывает систематические ошибки, которые совершают все, включая экспертов, и как их ловить.",
  ideas: [
   ["Две системы мышления", "Система 1 — быстрая, автоматическая, интуитивная: узнать лицо, сложить 2+2, почувствовать опасность. Система 2 — медленная, требует усилий: умножить 17 на 24, сравнить два договора. Система 2 ленива и часто просто одобряет предложения Системы 1. Поэтому мы уверенно ошибаемся, не замечая этого."],
   ["Якорение", "Первое услышанное число тянет оценку к себе, даже если оно случайное. В экспериментах судьи давали более суровые приговоры после того, как бросали кубики с большими числами. В переговорах тот, кто первым называет цифру, задаёт якорь. Защита — заранее иметь свою опорную цифру."],
   ["Доступность", "Мы оцениваем вероятность событий по тому, насколько легко вспоминаются примеры. После громкой новости об авиакатастрофе люди боятся летать, хотя риск не изменился. Руководитель переоценивает то, о чём недавно говорили на совещании, и недооценивает тихие системные риски."],
   ["Что видишь, то и есть", "Система 1 строит связную историю из той информации, что есть, и не думает о том, чего не хватает. Отсюда уверенность при недостатке данных. Полезный вопрос: «Что мне нужно было бы знать, чтобы изменить мнение?»"],
   ["Неприятие потерь", "Потеря ощущается примерно вдвое сильнее, чем выигрыш того же размера. Поэтому люди держатся за убыточные проекты (жалко вложенного) и отказываются от выгодных рисков. «Невозвратные затраты» не должны влиять на решение о будущем."],
   ["Ошибка планирования и взгляд снаружи", "Проекты почти всегда занимают больше времени и денег, чем планировалось, потому что мы смотрим «изнутри» на свой уникальный план. Лекарство — «взгляд снаружи»: найти похожие проекты и посмотреть на их реальные сроки и бюджеты. Канеман сам потратил на учебник восемь лет вместо двух."],
   ["Премортем", "Перед важным решением соберите команду и скажите: «Представьте, что прошёл год и проект провалился. Напишите, почему». Это легализует сомнения и выявляет риски, о которых в обычном обсуждении молчат."]
  ],
  apply: ["Перед ближайшими переговорами запишите свою опорную цифру до того, как услышите чужую.", "Проведите премортем для одного текущего проекта: 10 минут, «почему он провалился».", "Найдите проект, который вы продолжаете, потому что «жалко вложенного». Решите по будущему, а не по прошлому."],
  limits: "Часть экспериментов из книги (особенно про прайминг) позже не удалось повторить, и Канеман это публично признал. Книга большая и местами академичная. Ключевые идеи о системах мышления, якорях и неприятии потерь подтверждены надёжно.",
  keep: "Уверенность — это чувство, а не доказательство: её создаёт связная история, а не полнота данных.",
  quiz: [["Что делает Система 2?", ["Мгновенно узнаёт лица", "Медленно и с усилием рассуждает", "Отвечает за эмоции", "Ничего"], 1, "И часто ленится, одобряя Систему 1."],
   ["Как защититься от якоря в переговорах?", ["Всегда соглашаться", "Заранее иметь свою опорную цифру", "Не называть цифр вообще", "Спрашивать у коллег"], 1, "Якорь работает, даже если он случайный."],
   ["Что такое премортем?", ["Анализ после провала", "Представить провал заранее и найти его причины", "Отчёт о прибыли", "Медосмотр"], 1, "Легализует сомнения до старта."]] },

{ t: "Переговоры без поражения", a: "Роджер Фишер, Уильям Юри", y: 1981, cat: "infl", min: 12,
  about: "Двое учёных из Гарвардского переговорного проекта описали метод «принципиальных переговоров»: как договариваться о сути, а не торговаться позициями, и при этом сохранять отношения. Метод использовали в дипломатии, бизнесе и семейных спорах.",
  why: "Любой руководитель ведёт переговоры каждый день: с клиентами, поставщиками, партнёрами, собственной командой. Эта книга даёт простую и проверенную схему, которая работает и с жёсткими собеседниками.",

   ["Отделите людей от проблемы", "У каждого переговорщика две стороны интереса: суть вопроса и отношения. Будьте мягкими с людьми и жёсткими к проблеме. Говорите о восприятии и эмоциях открыто, слушайте активно, не превращайте спор в нападение на личность."],
   ["Интересы, а не позиции", "За каждой позицией стоят интересы: потребности, страхи, желания. Классический пример из книги: двое в библиотеке спорят, открыть окно или нет. Позиции несовместимы. Но один хочет свежего воздуха, другой не хочет сквозняка, и библиотекарь открывает окно в соседней комнате. Спрашивайте «почему?» и «почему нет?»."],
   ["Придумывайте варианты для взаимной выгоды", "Прежде чем делить пирог, попробуйте его увеличить. Разделите генерацию идей и их оценку: сначала мозговой штурм без критики, потом выбор. Ищите то, что дёшево для вас и ценно для другой стороны."],
   ["Настаивайте на объективных критериях", "Вместо битвы воль опирайтесь на независимые мерки: рыночную цену, экспертную оценку, прецедент, закон. Спор «чья воля сильнее» сменяется вопросом «что справедливо и как это проверить»."],
   ["Знайте свою BATNA", "BATNA — наилучшая альтернатива обсуждаемому соглашению: что вы сделаете, если договориться не получится. Это ваша настоящая сила. Чем лучше альтернатива, тем спокойнее вы ведёте переговоры. Перед важной встречей нужно знать свою BATNA и примерно оценить чужую."]
  ],
  apply: ["Перед ближайшими переговорами запишите свою BATNA: что вы сделаете, если сделка сорвётся.", "Выпишите позицию другой стороны и под ней три интереса, которые за ней могут стоять.", "Найдите один объективный критерий (рыночную цену, норму, прецедент), на который можно опереться."],
  limits: "Метод хуже работает, когда другая сторона играет нечестно или обладает подавляющей силой. Крис Восс критикует книгу за излишнюю рациональность: люди не всегда торгуются логично. Лучше читать обе книги.",
  keep: "Будьте мягкими с людьми и жёсткими к проблеме, а сила в переговорах — это ваша лучшая альтернатива.",

   ["Почему позиционный торг плох?", ["Он незаконен", "Превращает переговоры в соревнование упрямства и портит отношения", "Он слишком быстрый", "Он всегда выгоден"], 1, "Результат часто хуже для обеих сторон."],
   ["Что стоит за позицией?", ["Ничего", "Интересы: потребности и страхи", "Только деньги", "Эмоции начальника"], 1, "История с окном в библиотеке."]] },

{ t: "Психология влияния", a: "Роберт Чалдини", y: 1984, cat: "infl", min: 12,

  why: "Руководитель влияет на людей ежедневно и сам ежедневно становится объектом влияния. Книга одновременно учит убеждать честно и защищаться от манипуляций.",

   ["Обязательство и последовательность", "Сделав небольшой шаг, человек стремится оставаться последовательным. Особенно сильно работают письменные и публичные обязательства. Поэтому полезно, чтобы сотрудник сам сформулировал и записал цель: так он с большей вероятностью её выполнит."],
   ["Социальное доказательство", "В неопределённости мы смотрим, что делают другие. Отсюда «самый популярный тариф» и отзывы. Сильнее всего действует пример похожих на нас людей."],
   ["Симпатия", "Мы охотнее соглашаемся с теми, кто нам нравится: похожими на нас, теми, кто нас хвалит, с кем мы сотрудничаем ради общей цели. Перед деловым разговором стоит найти реальное сходство с собеседником."],

"Психология влияния": {
  context: ["Роберт Чалдини — профессор психологии Университета штата Аризона. В предисловии он признаётся, что всю жизнь был лёгкой добычей для продавцов, сборщиков пожертвований и рекламы: соглашался на покупки, которые ему были не нужны. Это и подтолкнуло его к исследованию.",
   "Кроме лабораторных экспериментов, Чалдини несколько лет внедрялся в профессии «убеждателей»: учился продавать подержанные машины и энциклопедии, работал в рекламе и благотворительных сборах. Он искал общие приёмы, которые профессионалы используют независимо друг от друга. Получилось шесть принципов. В поздних изданиях он добавил седьмой — единство, ощущение принадлежности к общему «мы»."],
  quotes: [["Многие наши реакции срабатывают автоматически, как запись, которая включается от нужного сигнала: в большинстве случаев это экономит силы, но этим же пользуются те, кто хочет нас убедить.", "Роберт Чалдини", "p"],
   ["Защищаться нужно не от самих принципов влияния, а от их искусственной подделки.", "Роберт Чалдини", "p"]],
  cases: [["Бесплатный аудит", "Компания-интегратор предлагает потенциальному клиенту бесплатно проверить его серверную и прислать отчёт с рекомендациями. Отчёт действительно полезный. Когда через месяц клиент выбирает подрядчика на модернизацию, он чувствует обязательство хотя бы дать интегратору шанс. Взаимность сработала честно, потому что подарок был настоящей ценностью, а не уловкой."],
   ["«Осталось два места»", "Руководителю звонит менеджер по продажам конференции: «Осталось два места по старой цене, решить нужно сегодня». Руководитель чувствует знакомое давление. Применив совет Чалдини, он задаёт себе вопрос: купил бы я это, если бы мест было сколько угодно и спешить было некуда? Ответ — нет, конференция не по его задачам. Он отказывается и экономит деньги и три дня."]],
  three: ["Взаимность, обязательство, социальное доказательство, симпатия, авторитет, дефицит — это кнопки, которые есть у всех.", "Используйте их честно: давайте реальную ценность.", "Почувствовав спешку или долг, спросите: решил бы я так без нажима?"] },

"Никогда не идите на компромисс": {
  context: ["Крис Восс двадцать четыре года проработал в ФБР, из них много лет — переговорщиком при захвате заложников, а затем руководителем международных переговоров ФБР о похищениях людей. Он вёл переговоры с террористами, грабителями банков и похитителями, где ценой ошибки была человеческая жизнь.",
   "После ухода из ФБР Восс учился в Гарварде и с удивлением обнаружил, что его приёмы работают против выпускников лучших бизнес-школ лучше, чем их учебная логика. Он основал консалтинговую компанию и вместе с журналистом Талем Разом написал книгу, перенося опыт кризисных переговоров в бизнес и повседневную жизнь."],
  quotes: [["Не соглашайтесь на середину: компромисс часто оставляет недовольными обе стороны и хуже любого из честных решений.", "Крис Восс", "p"],
   ["Слово «нет» — не конец переговоров, а их начало: оно даёт человеку чувство безопасности и контроля.", "Крис Восс", "p"]],
  cases: [["Зеркало на совещании", "Заказчик говорит: «Нам нужно, чтобы всё было готово к первому декабря». Руководитель проекта вместо споров повторяет: «К первому декабря?» Заказчик начинает объяснять: в декабре у них аудит, к нему нужна лишь первая очередь системы, остальное может подождать. Одно повторённое слово превратило невыполнимый срок в выполнимый, и спорить не пришлось."],
   ["Калиброванный вопрос вместо «нет»", "Начальник просит руководителя отдела взять ещё один проект, хотя команда перегружена. Вместо «нет» он спрашивает: «Как мне это сделать, если два текущих проекта уже на критическом пути?» Начальник сам начинает решать задачу: один из старых проектов откладывают на месяц. Отказ звучал бы как нежелание работать, вопрос сделал проблему общей."]],

"7 навыков высокоэффективных людей": {
  context: ["Стивен Кови получил степень MBA в Гарварде и докторскую степень, преподавал менеджмент в Университете Бригама Янга. Для диссертации он изучал американскую литературу об успехе за двести лет и заметил перелом: до середины XX века успех связывали с характером, а потом — с техниками, приёмами и умением производить впечатление.",

"Искусство войны": {
  context: ["О самом Сунь-цзы известно мало. По традиции, он был полководцем в Китае VI–V веков до нашей эры, в эпоху постоянных войн между царствами. Современные историки допускают, что текст складывался позже и мог быть работой нескольких авторов, но приписывается ему.",
   "Историк Сыма Цянь рассказывает легенду: царь У решил проверить Сунь-цзы и предложил ему обучить строю дворцовых наложниц. Женщины смеялись над командами. Сунь-цзы объяснил, что неясный приказ — вина командира, а ясный и не выполненный — вина командиров отрядов, и казнил двух любимиц царя, назначенных старшими. После этого строй выполнял команды безупречно. Жестокая история, но смысл её — в ясности приказов и ответственности. «Искусство войны» состоит из тринадцати коротких глав и сегодня входит в программы военных академий и бизнес-школ."],
  quotes: [["Сто раз сразиться и сто раз победить — это не лучшее из лучшего. Лучшее из лучшего — покорить чужую армию, не сражаясь.", "Сунь-цзы, «Искусство войны»", "q"],
   ["Знай противника и знай себя — и сражайся хоть сто раз без опасности поражения.", "Сунь-цзы, «Искусство войны»", "q"],
   ["Война — это путь обмана.", "Сунь-цзы, «Искусство войны»", "q"]],
  cases: [["Не ввязываться в ценовую войну", "Крупный конкурент снижает цены на стандартные задвижки на 20%, рассчитывая выдавить небольших производителей. Небольшая компания не отвечает снижением, а уходит туда, где конкурент слаб: нестандартные размеры, короткие сроки, исполнение под конкретные сети. Крупному заводу такие заказы невыгодны. Через год небольшая компания зарабатывает больше, чем до ценовой войны, — она победила, не вступая в бой."],
   ["Разведка перед тендером", "Перед крупным тендером руководитель тратит неделю не на презентацию, а на изучение: кто ещё участвует, на каких условиях они работали раньше, что важно заказчику помимо цены, какие у самого заказчика были проблемы с прошлыми подрядчиками. Выясняется, что заказчика больше всего беспокоят сроки, а не цена. Предложение строят вокруг гарантии сроков и выигрывают тендер, хотя не были самыми дешёвыми."]],
  three: ["Лучшая победа — та, для которой не понадобилось сражение.", "Знайте конкурента и себя честно.", "Бейте туда, где противник слаб, а не туда, где он силён."] },
"Дилемма инноватора": {

   ["Слушать лучших клиентов — правильно, пока на рынок не приходит то, чего эти клиенты пока не хотят.", "Клейтон Кристенсен", "p"]],
  cases: [["Kodak и цифровая камера", "Первую цифровую камеру в 1975 году собрал инженер самой Kodak Стив Сассон. Камера была тяжёлой, снимок записывался на кассету больше 20 секунд, качество было ужасным. Для компании, зарабатывавшей огромные деньги на плёнке и печати, это выглядело игрушкой, угрожающей основному бизнесу. Kodak не стала развивать направление всерьёз. Через три десятилетия цифровая фотография уничтожила плёночный рынок, а Kodak в 2012 году подала на банкротство. Классическая дилемма: правильная забота о текущих клиентах и марже убила будущее."],
   ["Blockbuster отказался от Netflix", "В 2000 году основатели Netflix, тогда маленького сервиса проката DVD по почте, предложили сети Blockbuster купить их примерно за 50 миллионов долларов. Руководство Blockbuster, у которого были тысячи магазинов и миллиарды выручки, отказалось: ниша выглядела крошечной и неудобной. Netflix улучшал сервис, перешёл на стриминг и вырос в гиганта, а Blockbuster обанкротился в 2010 году."]],

"Бизнес с нуля (Lean Startup)": {

  quotes: [["Стартап — это организация, созданная для того, чтобы создать новый продукт или услугу в условиях крайней неопределённости.", "Эрик Рис", "q"],

  cases: [["Zappos: магазин без склада", "Основатель Zappos хотел проверить гипотезу: будут ли люди покупать обувь в интернете, не примерив её? Вместо склада и закупок он сфотографировал обувь в местных магазинах и выложил фото на сайт. Когда приходил заказ, он шёл в магазин, покупал пару по полной цене и отправлял клиенту. Бизнес был убыточным, но за копейки проверил главное: люди покупают. Только после этого начали строить настоящую компанию, которую позже купил Amazon."],
   ["Новый продукт на заводе", "Завод хочет выпускать умные задвижки с датчиками и удалённым управлением. План — два года разработки и сертификации. По методу Риса сначала проверяют гипотезу: нужно ли это водоканалам и сколько они готовы платить. Делают десять прототипов из готовых датчиков, ставят у двух заказчиков бесплатно на три месяца и смотрят, пользуются ли данными. Выясняется, что главное для заказчиков — не управление, а сигнал об утечке. Продукт упрощают, и его разработка сокращается вдвое."]],

"Высокоэффективный менеджмент": {
  context: ["Эндрю Гроув родился в 1936 году в Будапеште, пережил нацистскую оккупацию, а в 1956 году, после подавления венгерского восстания, бежал в США почти без денег и знания языка. Он стал инженером-химиком, защитил диссертацию в Беркли и стал одним из первых сотрудников Intel, основанной в 1968 году.",

  quotes: [["Результат работы менеджера — это результат работы его организации и тех соседних организаций, на которые он влияет.", "Эндрю Гроув", "q"],

   ["Где рычаг у руководителя", "Начальник отдела сам переписывает слабые отчёты подчинённых, потому что «так быстрее». Гроув назвал бы это действием с низким рычагом. Вместо этого он тратит два часа, чтобы разобрать с сотрудником один отчёт: что важно заказчику, как строить выводы. Следующие отчёты сотрудник пишет сам, и начальник освобождает себе по несколько часов каждую неделю."]],
  three: ["Ценность руководителя — в результате его команды.", "Выбирайте действия с высоким рычагом: обучение, точные решения.", "Ищите ранние индикаторы проблем и ловите брак на входе."] },

"Пять пороков команды": {
  context: ["Патрик Ленсиони работал в крупных технологических компаниях, а затем основал консалтинговую фирму, помогающую руководящим командам работать слаженно. Он заметил, что главная проблема команд почти никогда не в недостатке ума или опыта, а в отношениях внутри.",

  quotes: [["Не финансы, не стратегия и не технологии. Именно командная работа остаётся главным конкурентным преимуществом — потому что она такая мощная и такая редкая.", "Патрик Ленсиони", "q"],

   ["Директор признаёт ошибку", "Генеральный директор на общем собрании руководителей говорит: «Я ошибся с прогнозом продаж и из-за этого мы набрали лишний склад. Вот что я понял». В комнате становится тихо. Через неделю руководитель производства сам признаётся в проблеме с качеством, о которой молчал два месяца. Доверие к уязвимости начинается с того, кто стоит выше всех."]],

"Принципы": {
  context: ["Рэй Далио основал Bridgewater в 1975 году в двухкомнатной квартире. В 1982 году он публично и уверенно предсказал долговой кризис и депрессию, в том числе в выступлении перед Конгрессом США. Прогноз не сбылся: начался один из сильнейших подъёмов рынка. Далио потерял почти всё, уволил сотрудников и даже занял у отца 4 000 долларов, чтобы прожить.",
   "Этот провал он называет лучшим, что с ним случилось: он научился сомневаться в своей правоте и искать людей, которые с ним не согласны. Он начал записывать правила, по которым принимает решения, и проверять их. Из этих записей выросла культура Bridgewater, ставшей одним из крупнейших хедж-фондов мира, и эта книга, вышедшая в 2017 году."],
  quotes: [["Боль плюс размышление равно прогресс.", "Рэй Далио", "q"],

   ["Взвешенное решение", "Нужно выбрать поставщика станков. Мнения разделились. Вместо голосования руководитель смотрит, кто из участников уже выбирал оборудование и чьи прошлые выборы оказались удачными. Голос главного технолога, который трижды угадывал с поставщиками, весит больше, чем мнение тех, кто делает это впервые. Это не диктатура и не демократия, а взвешивание по надёжности."]],
  three: ["Каждая ошибка — материал для нового принципа.", "Цели → проблемы → причины → план → выполнение.", "Пусть побеждает лучшая идея, а не должность."] },

"Стратегия голубого океана": {

  cases: [["Вино для тех, кто не пьёт вино", "Австралийская компания Casella Wines увидела, что американский рынок вина пугает обычных людей: сложные этикетки, разговоры о терруаре, выдержке и танинах. Они создали марку [yellow tail] — простое, мягкое, слегка сладкое вино, одна бутылка красного и одна белого, яркая этикетка с кенгуру, никакого снобизма. Целились в тех, кто обычно пьёт пиво и коктейли. За несколько лет марка стала одним из самых продаваемых импортных вин в США."],

"Конкурентная стратегия": {
  context: ["Майкл Портер — экономист и профессор Гарвардской школы бизнеса, один из самых цитируемых исследователей менеджмента. Он пришёл из промышленной экономики, где изучали, почему одни отрасли прибыльнее других, и перенёс эти идеи на уровень отдельной компании.",
   "«Конкурентная стратегия» вышла в 1980 году. Через пять лет Портер дополнил её книгой «Конкурентное преимущество», где ввёл понятие цепочки ценности. Его модели стали стандартом в бизнес-школах и консалтинге, а на основе его идей была создана консалтинговая компания Monitor."],
  quotes: [["Суть стратегии — в выборе того, чего не делать.", "Майкл Портер, статья «Что такое стратегия?» (1996)", "q"],
   ["Компания, которая пытается быть всем для всех, обрекает себя на стратегическую посредственность.", "Майкл Портер", "p"]],
  cases: [["Southwest Airlines: стратегия как система отказов", "Southwest Airlines построила лидерство по издержкам на целой системе отказов: никакого питания на борту, никаких закреплённых мест, только один тип самолёта (Boeing 737), полёты напрямую между городами без пересадочных узлов, разворот самолёта в аэропорту за минимальное время. Каждое решение поддерживает другие, поэтому конкурентам трудно скопировать модель целиком. Многие крупные авиакомпании пытались создать «дешёвые дочки» и проигрывали: они копировали отдельные элементы, но не систему."],
   ["Застрявшие посередине", "Производитель мебели одновременно пытается конкурировать с дешёвыми фабриками ценой и с дизайнерскими брендами качеством, выпуская всё для всех. В итоге для экономных покупателей он дорог, а для требовательных — недостаточно хорош. Разбор по Портеру показывает выход: выбрать фокус, например мебель для небольших отелей с быстрой поставкой, и отказаться от остального."]],
  three: ["Прибыльность отрасли определяют пять сил.", "Выберите одну стратегию: издержки, отличие или фокус.", "Стратегия — это то, от чего вы отказываетесь."] },

"Начни с «Почему?»": {
  context: ["Саймон Синек по образованию антрополог, начинал карьеру в рекламе. Он заметил, что у вдохновляющих лидеров и компаний есть общий способ говорить о себе, и описал его в виде простой схемы — золотого круга.",
   "В 2009 году он выступил с докладом на конференции TED. Видео с маркером и флипчартом стало одним из самых просматриваемых выступлений TED в истории, а книга, вышедшая в том же году, превратила Синека в одного из самых известных спикеров о лидерстве."],
  quotes: [["Люди покупают не то, что вы делаете, а то, зачем вы это делаете.", "Саймон Синек", "q"],
   ["Мартин Лютер Кинг произнёс речь «У меня есть мечта», а не «У меня есть план».", "Саймон Синек", "q"]],
  cases: [["Две презентации одного завода", "Первая версия: «Мы производим задвижки из нержавеющей стали DN50–300, сертифицированы, поставляем по всей стране». Вторая: «Мы верим, что вода в городе не должна пропадать из-за аварий в мороз. Поэтому делаем арматуру, которая служит десятилетиями без обслуживания. Вот наши задвижки». Факты те же, но вторая версия объясняет, ради чего, и запоминается. Её проще повторить клиенту, и под неё проще собирать команду."],
   ["Почему при найме", "Компания перестаёт писать в вакансиях только требования и задачи и начинает рассказывать, зачем существует и что меняет. Откликов становится меньше, но кандидаты точнее подходят: приходят люди, которым близка цель, а не только зарплата. Текучесть в первый год заметно снижается."]],
  three: ["Говорите изнутри наружу: почему → как → что.", "Вера и цель удерживают людей сильнее, чем скидки.", "Каждое решение должно подтверждать ваше «почему»."] },

"Радикальная откровенность": {
  context: ["Ким Скотт до Кремниевой долины работала в России: в 1990-х она руководила небольшой фабрикой по огранке алмазов в Москве. Затем руководила командами в Google, где отвечала за рекламные продукты, и преподавала руководителям в Apple University — внутреннем университете Apple.",
   "Она заметила, что лучшие руководители не похожи ни на жёстких начальников, ни на «добрых», которые избегают неприятных разговоров. Они умели говорить правду так, что люди чувствовали заботу. Книга вышла в 2017 году и стала популярной в технологических компаниях, а её матрица — частью обучения руководителей."],
  quotes: [["Радикальная откровенность — это когда вы лично заботитесь о человеке и при этом прямо бросаете ему вызов.", "Ким Скотт", "q"],
   ["Молчание о проблеме из жалости — не доброта, а разрушительная эмпатия.", "Ким Скотт", "p"]],
  cases: [["Хороший сотрудник с плохим отчётом", "Инженер, которого все любят, третий раз сдаёт отчёт с ошибками. Руководитель жалеет его и молча правит сам. Через полгода инженера не повышают, и он узнаёт, что его отчётами недовольны. Он обижен: ему никто не говорил. Разрушительная эмпатия навредила ему больше честного разговора. Радикальная откровенность выглядела бы так: «Ты ценен для команды, поэтому скажу прямо — в отчётах повторяются ошибки, давай разберём одну вместе»."],
   ["Руководитель просит критику", "Директор каждую пятницу задаёт команде один вопрос: «Что мне стоит делать или не делать, чтобы вам было легче работать?» Первые недели отвечают «всё хорошо». Он выдерживает паузы, благодарит за мелкие замечания и сразу меняет то, что может. Через месяц ему начинают говорить действительно важное: например, что его поздние письма по ночам создают ощущение аврала."]],
  three: ["Заботьтесь лично и говорите прямо — одновременно.", "Сначала научитесь получать критику сами.", "Хвалите публично, критикуйте лично и конкретно."] },

"Эмоциональный интеллект": {
  context: ["Дэниел Гоулман получил докторскую степень по психологии в Гарварде и много лет писал о науке о мозге и поведении для The New York Times. Понятие эмоционального интеллекта придумал не он: его ввели психологи Питер Саловей и Джон Майер в 1990 году. Гоулман сделал его известным всему миру.",
   "Книга 1995 года стала бестселлером, а в 1998 году Гоулман опубликовал в Harvard Business Review статью «Что делает лидера лидером?», где показал, что для руководителей эмоциональные навыки важны не меньше технических. С тех пор эмоциональный интеллект вошёл в программы отбора и обучения руководителей."],
  quotes: [["Разгневаться может любой — это легко. Но разгневаться на того, на кого нужно, в той мере, в какой нужно, в нужное время, ради нужной цели и нужным образом — это нелегко.", "Аристотель, эпиграф к книге", "q"],
   ["Эмоциональный интеллект — это способность понимать свои и чужие чувства и управлять ими так, чтобы они помогали, а не мешали.", "Дэниел Гоулман", "p"]],
  cases: [["Письмо, которое не было отправлено", "Директор получает от заказчика резкое письмо с несправедливыми обвинениями и сразу пишет такой же резкий ответ. По совету из книги он не отправляет его, а откладывает до утра. Утром перечитывает письмо заказчика спокойно и замечает, что за обвинениями стоит страх: у заказчика срывается собственный проект. Ответ получается деловым и предлагает решение. Отношения сохранены, а вечерний ответ мог стоить контракта."],
   ["Спокойствие в аварии", "На производстве авария, линия стоит. Начальник цеха, вместо того чтобы кричать, говорит спокойно и чётко: кто что делает, когда следующая сверка. Люди работают собранно, без паники. Через неделю он замечает, что в команде, где начальник срывается, такие же аварии устраняют вдвое дольше: люди боятся сообщать плохие новости."]],
  three: ["Знайте свои эмоции и не принимайте решений «на взводе».", "Эмпатия — это понимание, а не уступчивость.", "Настроение руководителя передаётся всей команде."] },

"Дипломатия": {
  context: ["Генри Киссинджер родился в 1923 году в Германии в еврейской семье и в 1938 году бежал с ней от нацистов в США. Он воевал во Второй мировой в армии США, затем стал профессором Гарварда. При президентах Никсоне и Форде был советником по национальной безопасности и государственным секретарём.",
   "Он организовал тайную поездку в Пекин в 1971 году, после которой США и Китай начали сближение, вёл политику разрядки с СССР, получил Нобелевскую премию мира за переговоры по Вьетнаму. Многие его решения до сих пор вызывают острые споры. «Дипломатия» вышла в 1994 году. Киссинджер прожил сто лет и умер в 2023 году."],
  quotes: [["У нас нет вечных союзников и нет постоянных врагов. Вечны и постоянны наши интересы, и наш долг — следовать им.", "Лорд Палмерстон, 1848; приводится в книге", "q"],
   ["Порядок держится не только на силе, но и на ощущении его справедливости у главных участников.", "Генри Киссинджер", "p"]],
  cases: [["Китай как противовес", "В разгар холодной войны США и Китай не имели даже дипломатических отношений. Киссинджер увидел возможность: СССР и Китай враждовали, и сближение США с Китаем меняло баланс сил. После тайного визита Киссинджера и поездки Никсона в Пекин Москва получила второго противника на востоке и стала сговорчивее в переговорах с Вашингтоном. Чистая логика баланса сил: интересы важнее идеологии."],
   ["Баланс сил в бизнесе", "Компания зависит от двух крупных поставщиков металла, которые фактически диктуют цены. Директор находит третьего, небольшого поставщика, и отдаёт ему 20% закупок, даже чуть дороже. Теперь у двух крупных появился противовес, и их условия становятся мягче. Как в дипломатии, устойчивость обеспечивает не дружба, а равновесие."]],
  three: ["Интересы определяют политику, но без ценностей нет легитимности.", "Мир держится на балансе сил и общем чувстве справедливости.", "Порядок, держащийся на одном человеке, его не переживёт."] },

"Почему одни страны богатые, а другие бедные": {
  context: ["Дарон Аджемоглу — экономист, профессор Массачусетского технологического института, родился в Турции. Джеймс Робинсон — политолог и экономист, много лет изучавший Латинскую Америку и Африку. Пятнадцать лет совместных исследований они свели в книгу, вышедшую в 2012 году.",
   "В 2024 году Аджемоглу и Робинсон вместе с Саймоном Джонсоном получили Нобелевскую премию по экономике именно за исследования того, как институты влияют на благосостояние стран. Книга стала одной из самых обсуждаемых работ о развитии государств."],
  quotes: [["Страны терпят неудачу сегодня потому, что их экстрактивные экономические институты не создают стимулов, необходимых людям, чтобы сберегать, вкладывать и создавать новое.", "Аджемоглу и Робинсон", "q"],
   ["Богатство народов определяет не география и не культура, а правила, по которым устроены власть и экономика.", "Аджемоглу и Робинсон", "p"]],
  cases: [["Ботсвана: исключение в Африке", "В 1966 году, получив независимость, Ботсвана была одной из беднейших стран мира, почти без дорог и образованных людей. Вскоре там нашли алмазы — ресурс, который во многих странах приводил к коррупции и войнам. Но вожди страны сохранили традиции участия и ограничения власти, а доходы от алмазов вложили в образование и инфраструктуру. Ботсвана десятилетиями была одной из самых быстрорастущих экономик мира. Отличие — в институтах, а не в ресурсах."],
   ["Экстрактивная компания", "В компании все решения и премии сосредоточены у узкого круга директоров, а инженеры, придумывающие улучшения, ничего от них не получают. Через несколько лет инженеры перестают предлагать идеи, лучшие уходят, рост останавливается. Когда компания вводит долю в экономии для авторов улучшений и прозрачные правила повышения, поток идей возобновляется. Та же логика, что и у государств."]],
  three: ["Процветание создают инклюзивные институты.", "Политическая власть определяет экономические правила.", "Элиты тормозят прогресс, когда он угрожает их положению."] },

"Размышления": {
  context: ["Марк Аврелий правил Римской империей с 161 по 180 год. Его правление пришлось на тяжёлые времена: эпидемия, унёсшая миллионы жизней, долгие войны с германскими племенами на Дунае, мятеж одного из полководцев. Многие годы император провёл не во дворце, а в военных лагерях.",
   "Именно там, по вечерам, он вёл записи на греческом языке, которые назвал просто «К самому себе». Он не собирался их публиковать: это упражнения, которыми он напоминал себе принципы стоической философии. Текст чудом сохранился и стал одной из самых читаемых книг о внутренней дисциплине; её советуют военные, политики и предприниматели."],
  quotes: [["С утра говори себе: сегодня встречусь с назойливым, неблагодарным, наглым, коварным, завистливым, необщительным. Всё это у них от незнания добра и зла.", "Марк Аврелий, «Размышления», книга II", "q"],
   ["Препятствие делу становится самим делом. То, что стоит на пути, становится путём.", "Марк Аврелий, «Размышления», книга V", "q"],
   ["Сколько досуга выгадывает тот, кто не смотрит, что сказал, сделал или подумал сосед, а лишь на то, что делает сам.", "Марк Аврелий, «Размышления», книга IV", "q"]],
  cases: [["Утро трудного дня", "У руководителя тяжёлый день: совещание с недовольным заказчиком, разговор с конфликтным сотрудником, отчёт перед советом директоров. Утром он пять минут делает упражнение Аврелия: записывает, какие трудности будут, как могут повести себя люди и как он хочет ответить — спокойно, по существу. Когда заказчик действительно начинает с упрёков, руководитель не удивлён и не задет. Разговор быстро переходит к решению."],
   ["Сорванный контракт", "Крупный контракт, на который рассчитывали полгода, ушёл конкуренту. Первая реакция — злость и поиск виноватых. Применяя мысль о препятствии как пути, руководитель спрашивает: что этот провал позволяет сделать? Ответ: освободились мощности, которые можно отдать на давно откладываемый новый продукт, и есть повод честно разобрать, почему проиграли тендер. Через год новый продукт приносит больше, чем принёс бы потерянный контракт."]],
  three: ["Отвечайте за свои суждения и поступки, а не за чужие.", "Готовьтесь к трудностям утром, чтобы не быть ими задетым днём.", "Препятствие — это материал для действия."] },

"Из третьего мира — в первый": {
  context: ["Ли Куан Ю родился в 1923 году в Сингапуре, тогда британской колонии, пережил японскую оккупацию, учился праву в Кембридже. В 1959 году он стал премьер-министром самоуправляемого Сингапура и оставался им до 1990 года.",
   "В 1965 году Сингапур исключили из состава Малайзии. Объявляя об этом по телевидению, Ли не сдержал слёз: он считал, что маленький остров без ресурсов не выживет в одиночку. Книга, вышедшая в 2000 году, — вторая часть его мемуаров. Она рассказывает, как за тридцать лет страна прошла путь от бедного порта к одному из богатейших государств мира."],
  quotes: [["Мы были свободны от идеологии. Нас интересовало одно: работает это или нет.", "Ли Куан Ю", "p"],
   ["Честное правительство держится на двух вещах: никто не стоит выше закона, а честная служба достойно оплачивается.", "Ли Куан Ю", "p"]],
  cases: [["Никто не выше закона", "В 1986 году бюро по борьбе с коррупцией начало расследование против действующего министра национального развития, близкого соратника Ли, по подозрению во взятках. Ли не стал его защищать и разрешил расследование довести до конца. Министр покончил с собой до суда. Для всей страны это стало сигналом: правило о неприкосновенности не действует ни для кого."],
   ["Кадры решают всё", "Ли считал, что судьбу страны определяют несколько сотен ключевых людей. Государство давало лучшим школьникам стипендии в ведущие университеты мира с обязательством потом несколько лет отработать на государственной службе. Для компании урок тот же: найдите и вырастите тех, от кого зависит результат, — и платите им достойно, чтобы они не уходили."]],
  three: ["Прагматизм: оценивайте политику по тому, работает ли она.", "Коррупция побеждается неотвратимостью для всех и достойной оплатой.", "Ключевые люди и длинный горизонт решают больше, чем ресурсы."] },

"Как привести дела в порядок": {
  context: ["Дэвид Аллен до того, как стать консультантом по продуктивности, сменил десятки занятий: был фокусником, официантом, инструктором по карате, продавцом, менеджером. Он изучал, почему одни люди справляются с огромным потоком дел спокойно, а другие тонут в стрессе.",

/*END_EXTRA*/
};
BOOKS.forEach(b => Object.assign(b, EXTRA[b.t] || {}));

/* ======================= ХРАНЕНИЕ ======================= */
const APP = "books";
const KEY = "book-of-day-v1";
const Store = {
  data: { read: {}, notes: {}, quiz: {}, days: {}, updatedAt: 0 }, server: false, mode: "local", _timer: null, _chain: Promise.resolve(),
  loadLocal() { try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) this.data = Object.assign(this.data, s); } catch (e) {} },
  async initServer() {
    if (!/^https?:$/.test(location.protocol) || /github\.io|claude\.ai|claudeusercontent/.test(location.hostname)) return false;
    try {
      const r = await fetch("api/progress/" + APP, { cache: "no-store" }); if (!r.ok) return false;
      const remote = await r.json();
      if (remote && (remote.updatedAt || 0) > (this.data.updatedAt || 0)) this.data = Object.assign({}, this.data, remote);
      this.server = true; this.mode = "server"; renderAll(); return true;
    } catch (e) { return false; }
  },
  save() {
    this.data.updatedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) {}
    if (!this.server) return;
    clearTimeout(this._timer);
    this._timer = setTimeout(() => { const body = JSON.stringify(this.data); this._chain = this._chain.then(() => fetch("api/progress/" + APP, { method: "PUT", headers: { "Content-Type": "application/json" }, body })).catch(() => {}); }, 1000);
  }
};

/* ======================= УТИЛИТЫ ======================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const DAY = 86400000;
const START = new Date(2026, 9, 21);
const todayKey = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const bookWords = b => [b.about, ...(b.context || []), b.why, ...b.ideas.flat(), ...(b.quotes || []).map(q => q[0]), ...(b.cases || []).flat(), ...b.apply, b.limits, ...(b.three || []), b.keep].join(" ").split(/\s+/).length;
const readMin = b => Math.max(2, Math.round(bookWords(b) / 120));
const yearText = y => y < 0 ? "около " + Math.abs(y) + " г. до н. э." : y + " г.";
function todayIndex() { return ((Math.floor((Date.now() - START) / DAY) % BOOKS.length) + BOOKS.length) % BOOKS.length; }
function readCount() { return Object.keys(Store.data.read).length; }
function streak() {
  let n = 0; const d = new Date();
  for (;;) { const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); if (Store.data.days[k]) { n++; d.setDate(d.getDate() - 1); } else break; }
  return n;
}
function updateChips() { $("#chip-read b").textContent = readCount() + " из " + BOOKS.length; $("#chip-streak b").textContent = streak(); }

/* ======================= ОЗВУЧКА ======================= */
let ruVoice = null, speaking = false;
function pickVoice() { const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || []; const ru = vs.filter(v => /^ru/i.test(v.lang)); ruVoice = ru.find(v => /natural|online|milena|svetlana|dmitry/i.test(v.name)) || ru[0] || null; }
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function bookText(b) {
  return [b.t + ". " + b.a + ".", b.about, ...(b.context || []), b.why, ...b.ideas.map(i => i[0] + ". " + i[1]),
    ...(b.quotes || []).map(q => "Цитата. " + q[0]), ...(b.cases || []).map(c => c[0] + ". " + c[1]),
    "Что сделать сегодня. " + b.apply.join(" "), "Ограничения. " + b.limits, ...(b.three ? ["Три вещи, которые стоит запомнить. " + b.three.join(" ")] : []), "Главная мысль. " + b.keep].join("\n");
}
function speakBook(b, btn) {
  if (!window.speechSynthesis) { btn.textContent = "Озвучка недоступна"; return; }
  if (speaking) { speechSynthesis.cancel(); speaking = false; btn.textContent = "▶ Слушать"; return; }
  speechSynthesis.cancel();
  const parts = bookText(b).split("\n").flatMap(p => p.match(/[^.!?]+[.!?]+/g) || [p]);
  let i = 0; speaking = true; btn.textContent = "■ Остановить";
  const next = () => {
    if (!speaking || i >= parts.length) { speaking = false; btn.textContent = "▶ Слушать"; return; }
    const u = new SpeechSynthesisUtterance(parts[i++]); u.lang = "ru-RU"; if (ruVoice) u.voice = ruVoice; u.rate = 1;
    u.onend = next; u.onerror = () => { speaking = false; btn.textContent = "▶ Слушать"; };
    speechSynthesis.speak(u);
  };
  next();
}

/* ======================= АУДИОКНИГА =======================
   Настоящий mp3 (audio/book-NN.mp3) играет и при заблокированном экране iPhone;
   экран блокировки показывает книгу и кнопки через Media Session. Без файла — чтение голосом браузера. */
const audio = new Audio();
audio.preload = "none";
let audioIdx = null, posTimer = 0;
const RATES = [1, 1.25, 1.5];
const fmtTime = s => !isFinite(s) ? "--:--" : Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
function audioSrc(idx) { return "audio/book-" + String(idx + 1).padStart(2, "0") + ".mp3"; }
function setupPlayer(b, idx) {
  const play = $("#p-play"), seek = $("#p-seek"), time = $("#p-time"), rateBtn = $("#p-rate");
  const pos = (Store.data.pos || {})[idx] || 0;
  const rate = Store.data.rate || 1;
  rateBtn.textContent = rate + "×";
  const refresh = () => {
    const mine = audioIdx === idx;
    play.textContent = mine && !audio.paused ? "❚❚ Пауза" : (mine && audio.currentTime > 1) || pos > 1 ? "▶ Продолжить" : "▶ Слушать";
    if (mine && audio.duration) { seek.value = Math.round(audio.currentTime / audio.duration * 1000); time.textContent = fmtTime(audio.currentTime) + " / " + fmtTime(audio.duration); }
    else if (pos > 1) time.textContent = "остановились на " + fmtTime(pos);
  };
  audio.ontimeupdate = () => {
    refresh();
    if (Date.now() - posTimer > 5000 && audioIdx != null) { posTimer = Date.now(); (Store.data.pos || (Store.data.pos = {}))[audioIdx] = Math.floor(audio.currentTime); Store.save(); }
  };
  audio.onplay = audio.onpause = audio.onloadedmetadata = refresh;
  audio.onended = () => { (Store.data.pos || {})[audioIdx] = 0; Store.save(); refresh(); };
  audio.onerror = () => { if (audioIdx === idx) { time.textContent = "аудиофайл недоступен (нет интернета?) — читаю голосом браузера, при блокировке экрана чтение остановится"; audioIdx = null; speakBook(b, play); } };
  play.onclick = () => {
    if (speaking) { speechSynthesis.cancel(); speaking = false; refresh(); return; }
    if (audioIdx !== idx) {
      audio.src = audioSrc(idx); audioIdx = idx; audio.playbackRate = Store.data.rate || 1;
      audio.addEventListener("loadedmetadata", () => { if (pos > 1 && pos < audio.duration - 5) audio.currentTime = pos; }, { once: true });
      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({ title: b.t, artist: b.a, album: "Книга дня", artwork: [{ src: "icon-books-512.png", sizes: "512x512", type: "image/png" }] });
        navigator.mediaSession.setActionHandler("play", () => audio.play());
        navigator.mediaSession.setActionHandler("pause", () => audio.pause());
        navigator.mediaSession.setActionHandler("seekbackward", () => { audio.currentTime = Math.max(0, audio.currentTime - 15); });
        navigator.mediaSession.setActionHandler("seekforward", () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30); });
        try { navigator.mediaSession.setActionHandler("seekto", d => { audio.currentTime = d.seekTime; }); } catch (e) {}
      }
    }
    if (audio.paused) audio.play().catch(() => {}); else audio.pause();
  };
  $("#p-back").onclick = () => { if (audioIdx === idx) audio.currentTime = Math.max(0, audio.currentTime - 15); };
  $("#p-fwd").onclick = () => { if (audioIdx === idx) audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30); };
  rateBtn.onclick = () => { const r = RATES[(RATES.indexOf(Store.data.rate || 1) + 1) % RATES.length]; Store.data.rate = r; Store.save(); audio.playbackRate = r; rateBtn.textContent = r + "×"; };
  seek.oninput = () => { if (audioIdx === idx && audio.duration) audio.currentTime = seek.value / 1000 * audio.duration; };
  refresh();
}

/* ======================= ВКЛАДКИ ======================= */
const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
let openIdx = null;
function openTab(id) {
  tabs.forEach(t => { const on = t.id === id; t.setAttribute("aria-selected", on); $("#" + t.getAttribute("aria-controls")).hidden = !on; });
  if (speaking) { speechSynthesis.cancel(); speaking = false; }
  if (id === "tab-lib") renderLib(); if (id === "tab-stats") renderStats(); if (id === "tab-today") renderToday();
  window.scrollTo(0, 0);
}
tabs.forEach(t => t.addEventListener("click", () => { if (t.id === "tab-today") openIdx = null; openTab(t.id); }));

/* ======================= КНИГА ======================= */
function renderToday() {
  const idx = openIdx == null ? todayIndex() : openIdx;
  const b = BOOKS[idx], key = String(idx), isToday = openIdx == null, done = !!Store.data.read[key];
  const qs = Store.data.quiz[key] || {};
  $("#p-today").innerHTML = `
    <div class="book-head"><div class="kicker">${isToday ? "Книга дня · " + new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "long" }) : "Книга " + (idx + 1) + " из " + BOOKS.length} · ${esc(CATS[b.cat])}</div>
      <h2 class="book-title">${esc(b.t)}</h2>
      <div class="book-meta">${esc(b.a)} · ${yearText(b.y)} · ${readMin(b)} мин чтения</div>
      <div class="player" id="player">
        <div class="row"><button class="btn primary" id="p-play">▶ Слушать</button><button class="btn" id="p-back" aria-label="Назад на 15 секунд">−15 с</button><button class="btn" id="p-fwd" aria-label="Вперёд на 30 секунд">+30 с</button><button class="btn" id="p-rate" aria-label="Скорость">1×</button>${done ? '<span class="done">✓ Прочитано</span>' : ""}</div>
        <div class="p-line"><input type="range" id="p-seek" min="0" max="1000" value="0" aria-label="Позиция"><span class="note" id="p-time">аудиокнига · играет и при заблокированном экране</span></div>
      </div></div>
    <div class="read">
      <p>${esc(b.about)}</p>
      ${b.context ? `<div class="sec">Об авторе и книге</div>${b.context.map(p => `<p>${esc(p)}</p>`).join("")}` : ""}
      <div class="sec">Почему её читают руководители</div><p>${esc(b.why)}</p>
      <div class="sec">Главные идеи</div>
      ${b.ideas.map(([h, t]) => `<div class="idea"><h3>${esc(h)}</h3><p>${esc(t)}</p></div>`).join("")}
      ${b.quotes ? `<div class="sec">Цитаты</div>${b.quotes.map(([q, src, kind]) => `<figure class="quote"><blockquote>${kind === "p" ? "" : "«"}${esc(q)}${kind === "p" ? "" : "»"}</blockquote><figcaption>${esc(src)}${kind === "p" ? " · мысль автора в пересказе" : " · перевод наш"}</figcaption></figure>`).join("")}` : ""}
      ${b.cases ? `<div class="sec">Как это выглядит в жизни</div>${b.cases.map(([h, t]) => `<div class="case"><h3>${esc(h)}</h3><p>${esc(t)}</p></div>`).join("")}` : ""}
      <div class="sec">Что сделать сегодня</div><ol class="apply">${b.apply.map(a => `<li>${esc(a)}</li>`).join("")}</ol>
      <div class="sec">Где книга ошибается или устарела</div><p>${esc(b.limits)}</p>
      ${b.three ? `<div class="sec">Если запомнить три вещи</div><ul class="three">${b.three.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
      <div class="sec">Одна мысль, чтобы запомнить</div><div class="keep">${esc(b.keep)}</div>
    </div>
    <div class="sec">Проверьте себя</div>
    <div class="card">${b.quiz.map((q, qi) => `<div class="q">${qi + 1}. ${esc(q[0])}</div><div class="opts" data-q="${qi}">${q[1].map((o, oi) => `<button data-o="${oi}" class="${qs[qi] != null ? (oi === q[2] ? "right" : oi === qs[qi] ? "wrong" : "") : ""}" ${qs[qi] != null ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div><div class="explain" id="qe-${qi}">${qs[qi] != null ? esc(q[3]) : ""}</div>`).join("")}</div>
    <div class="sec">Мои заметки</div>
    <textarea class="notes" id="b-notes" placeholder="Что взять в работу, с чем не согласны, кому посоветовать">${esc(Store.data.notes[key] || "")}</textarea>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="b-done" ${done ? "disabled" : ""}>${done ? "Прочитано" : "Отметить прочитанной"}</button>
      ${isToday ? "" : '<button class="btn" id="b-back">← К книге дня</button>'}
      <button class="btn" id="b-next">Следующая книга →</button></div>`;
  setupPlayer(b, idx);
  let noteTimer;
  $("#b-notes").oninput = e => { clearTimeout(noteTimer); noteTimer = setTimeout(() => { Store.data.notes[key] = e.target.value; Store.save(); }, 600); };
  document.querySelectorAll(".opts").forEach(box => box.querySelectorAll("button").forEach(btn => btn.onclick = () => {
    const qi = +box.dataset.q, oi = +btn.dataset.o, q = b.quiz[qi];
    (Store.data.quiz[key] || (Store.data.quiz[key] = {}))[qi] = oi; Store.save();
    box.querySelectorAll("button").forEach(x => { x.disabled = true; if (+x.dataset.o === q[2]) x.classList.add("right"); });
    if (oi !== q[2]) btn.classList.add("wrong");
    $("#qe-" + qi).textContent = (oi === q[2] ? "Верно. " : "Не совсем. ") + q[3];
  }));
  $("#b-done").onclick = () => { Store.data.read[key] = Date.now(); Store.data.days[todayKey()] = true; Store.save(); updateChips(); renderToday(); };
  const back = $("#b-back"); if (back) back.onclick = () => { openIdx = null; renderToday(); window.scrollTo(0, 0); };
  $("#b-next").onclick = () => { openIdx = (idx + 1) % BOOKS.length; renderToday(); window.scrollTo(0, 0); };
}

/* ======================= БИБЛИОТЕКА ======================= */
let libCat = "all";
function renderLib() {
  const p = $("#p-lib");
  const list = BOOKS.map((b, i) => [b, i]).filter(([b]) => libCat === "all" || b.cat === libCat);
  p.innerHTML = `<p class="lead">${BOOKS.length} книг. Каждый день приложение предлагает следующую, но любую можно открыть здесь.</p>
    <div class="filters" role="group" aria-label="Темы"><button data-c="all" aria-pressed="${libCat === "all"}">Все</button>${Object.entries(CATS).map(([k, v]) => `<button data-c="${k}" aria-pressed="${libCat === k}">${v}</button>`).join("")}</div>
    <div class="lib">${list.map(([b, i]) => `<button data-i="${i}"><span class="n">${i + 1}</span><span><span class="t">${esc(b.t)}</span><br><span class="a">${esc(b.a)} · ${yearText(b.y)} · ${esc(CATS[b.cat])}</span></span>${Store.data.read[i] ? '<span class="done">✓</span>' : `<span class="note">${readMin(b)} мин</span>`}</button>`).join("")}</div>`;
  p.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { libCat = b.dataset.c; renderLib(); });
  p.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { openIdx = +b.dataset.i; openTab("tab-today"); });
}

/* ======================= ПРОГРЕСС ======================= */
function renderStats() {
  const byCat = Object.entries(CATS).map(([k, v]) => { const all = BOOKS.map((b, i) => [b, i]).filter(([b]) => b.cat === k); return [v, all.filter(([, i]) => Store.data.read[i]).length, all.length]; });
  const quizRight = Object.entries(Store.data.quiz).reduce((a, [k, ans]) => a + Object.entries(ans).filter(([qi, oi]) => BOOKS[k] && BOOKS[k].quiz[qi] && BOOKS[k].quiz[qi][2] === oi).length, 0);
  const quizAll = Object.values(Store.data.quiz).reduce((a, ans) => a + Object.keys(ans).length, 0);
  const noted = Object.values(Store.data.notes).filter(t => t && t.trim()).length;
  $("#p-stats").innerHTML = `<div class="stats">
    <div class="card stat"><div class="v">${readCount()}</div><div class="l">книг прочитано из ${BOOKS.length}</div></div>
    <div class="card stat"><div class="v">${streak()}</div><div class="l">дней подряд</div></div>
    <div class="card stat"><div class="v">${quizAll ? quizRight + "/" + quizAll : "—"}</div><div class="l">верных ответов в проверках</div></div>
    <div class="card stat"><div class="v">${noted}</div><div class="l">книг с заметками</div></div></div>
    <div class="lib">${byCat.map(([n, r, a]) => `<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(n)}</b><span class="note">${r} / ${a}</span></div><div class="bar" style="margin-top:8px"><i style="width:${a ? r / a * 100 : 0}%"></i></div></div>`).join("")}</div>
    <p class="note" style="margin-top:16px">Прогресс и заметки хранятся в этом телефоне или браузере.</p>`;
}

/* ======================= ЗАПУСК ======================= */
function renderAll() { renderToday(); renderLib(); updateChips(); if (!$("#p-stats").hidden) renderStats(); }
Store.loadLocal();
renderAll();
Store.initServer();
</script>
</body></html>
