<style>

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1216; --surface: #171b21; --surface2: #20262e; --line: #2d3540;
  --fg: #e7ebf1; --muted: #9aa4b3; --accent: #7fb6e6; --accent-ink: #0b1a28; --gold: #e2b45a; --ok: #55cf7d; --bad: #ff7b6e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #171b21; --surface2: #20262e; --line: #2d3540;
  --fg: #e7ebf1; --muted: #9aa4b3; --accent: #7fb6e6; --accent-ink: #0b1a28; --gold: #e2b45a; --ok: #55cf7d; --bad: #ff7b6e; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 16px/1.6 var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px }

.opts button.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--surface)) }

.lib button:hover { border-color: var(--accent) }
.lib .n { font: 800 16px var(--f-display); color: var(--accent); text-align: center; font-variant-numeric: tabular-nums }
.lib .t { font-weight: 700 } .lib .a { color: var(--muted); font-size: 14px }

.stat .v { font: 800 28px var(--f-display); font-variant-numeric: tabular-nums } .stat .l { color: var(--muted); font-size: 13px }

.bar { height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden } .bar > i { display: block; height: 100%; background: var(--accent) }

<script>
/* ======================= КНИГИ =======================
   Разборы написаны своими словами. Поля: t — название, a — автор, y — год, cat — тема, min — минут чтения,
   about — о чём, why — почему читают руководители, ideas — [заголовок, текст], apply — что сделать сегодня,
   limits — ограничения и критика, keep — мысль для запоминания, quiz — [вопрос, [варианты], верный, пояснение] */
const CATS = { lead: "Лидерство и управление", strat: "Бизнес и стратегия", infl: "Влияние и переговоры", power: "Власть и политика", mind: "Мышление и решения" };
const BOOKS = [
{ t: "Эффективный руководитель", a: "Питер Друкер", y: 1967, cat: "lead", min: 12,
  about: "Друкер, которого называют отцом современного менеджмента, задаётся простым вопросом: почему умные, трудолюбивые люди так часто оказываются неэффективными руководителями? Его ответ: эффективность — не талант, а набор привычек, и им можно научиться так же, как таблице умножения.",
  why: "Это книга о самом дефицитном ресурсе руководителя — его времени и внимании. Она короткая, без воды, и через полвека остаётся первой, которую советуют новым директорам.",
  ideas: [
   ["Эффективность — это делать правильные вещи", "Друкер разводит два понятия: делать вещи правильно (продуктивность) и делать правильные вещи (эффективность). Руководитель может блестяще выполнить работу, которую вообще не стоило делать. Поэтому первый вопрос всегда: «Какой результат от меня нужен организации?», а не «Чем я занят?»"],
   ["Знай, куда уходит твоё время", "Время — единственный ресурс, который нельзя купить, занять или накопить. Друкер предлагает несколько недель честно записывать, на что оно уходит, и почти каждый руководитель удивляется: львиная доля съедается совещаниями, переписками и чужими срочностями. Дальше — три шага: записать, вычистить ненужное, собрать оставшееся свободное время в крупные непрерывные блоки. Важную работу нельзя сделать урывками по 15 минут."],
   ["Спрашивай: «Какой мой вклад?»", "Эффективный руководитель смотрит не вниз, на свои усилия, а вверх и наружу — на результат для клиентов и организации. Вопрос о вкладе меняет поведение: человек перестаёт гордиться загруженностью и начинает думать, что изменится в мире от его работы."],
   ["Строй на сильных сторонах", "Слабые стороны людей не исправить приказом, а сильные можно использовать. Друкер советует подбирать людей под то, в чём они исключительны, а не за отсутствие недостатков. Друкер любил известную историческую легенду: Линкольн, узнав, что его лучший генерал Грант пьёт, будто бы ответил: «Узнайте, какой виски он пьёт, и пошлите бочку остальным генералам». Важна победа, а не безупречность."],
   ["Первым делом — первое, по одному", "Концентрация — главный секрет эффективности. Руководитель, который делает десять дел одновременно, не доводит до конца ни одного. Друкер добавляет важную мысль: так же важно решить, от чего отказаться. Каждый год стоит спрашивать о каждом проекте: «Если бы мы сейчас этим не занимались, начали бы мы это?» Если нет — проект нужно закрыть."],
   ["Решение — это выбор между мнениями, а не между фактами", "Хорошие решения начинаются не с поиска «правильного» ответа, а со столкновения разных точек зрения. Друкер призывает намеренно искать несогласие: если все согласны сразу, значит, проблему ещё не поняли. И главное: решение не принято, пока не назначен человек, который его выполняет, и срок."]
  ],
  apply: ["Запишите сегодня, на что ушёл каждый час рабочего дня. Вечером отметьте всё, что можно было не делать или отдать.", "Сформулируйте одним предложением свой главный вклад в компанию на этот месяц.", "Выберите один проект, который вы продолжаете по инерции, и задайте вопрос: «Начали бы мы его сегодня?»"],
  limits: "Книга написана для больших корпораций середины XX века: про стартапы, удалённую работу и цифровую перегрузку в ней ничего нет. Примеры старые, а стиль местами суховат. Но принципы о времени и концентрации стали только актуальнее.",
  keep: "Нет ничего бесполезнее, чем эффективно делать то, что вообще не нужно было делать.",
  quiz: [["Чем эффективность отличается от продуктивности по Друкеру?", ["Ничем", "Эффективность — делать правильные вещи, продуктивность — делать вещи правильно", "Продуктивность важнее", "Эффективность — работать больше часов"], 1, "Можно блестяще сделать ненужную работу."],
   ["Что Друкер советует сделать со временем в первую очередь?", ["Купить планировщик", "Честно записать, куда оно уходит", "Работать по выходным", "Делегировать всё"], 1, "Без измерения нет управления."],
   ["Как подбирать людей?", ["За отсутствие недостатков", "Под их сильные стороны", "По стажу", "По рекомендации"], 1, "Слабости не исправить, силу можно использовать."]] },

{ t: "От хорошего к великому", a: "Джим Коллинз", y: 2001, cat: "strat", min: 13,
  about: "Коллинз с командой пять лет изучали компании, которые после десятилетий обычных результатов вдруг стали обгонять рынок в разы и держались так 15 лет. Они сравнили их с похожими компаниями, которым скачок не удался, и искали, что отличает первых.",
  why: "Это одно из немногих исследований менеджмента на данных, а не на историях. Его выводы — про руководителя, людей и дисциплину — неудобные и поэтому полезные.",
  ideas: [
   ["Лидер пятого уровня", "Во главе всех «великих» компаний стояли не харизматичные звёзды, а люди с редким сочетанием: личная скромность плюс железная профессиональная воля. Такие руководители приписывают успех команде и везению, а неудачи — себе. Коллинз называет это «окно и зеркало»: при успехе смотришь в окно (на других), при провале — в зеркало."],
   ["Сначала кто, потом что", "Великие компании сначала собирали нужных людей в «автобусе», убирали ненужных и рассаживали по местам, и только потом решали, куда ехать. Правильные люди сами найдут дорогу и не требуют жёсткого контроля. С неправильными людьми даже лучшая стратегия не сработает."],
   ["Смотри фактам в лицо, но не теряй веру", "Коллинз называет это «парадоксом Стокдейла» — по имени американского адмирала, пережившего восемь лет плена. Выжили не оптимисты, ждавшие освобождения «к Рождеству», а те, кто признавал жестокую реальность и при этом твёрдо верил, что в конце победит. Для компании это значит: создать культуру, где плохие новости доходят до руководства, и не путать веру с самообманом."],
   ["Концепция ежа", "Ёж знает одну большую вещь. Великие компании нашли пересечение трёх кругов: в чём мы можем быть лучшими в мире, что движет нашей экономикой (одна ключевая метрика вроде «прибыль на клиента») и чем мы горим. Всё, что вне пересечения, они отбрасывали — даже прибыльное."],
   ["Культура дисциплины", "Не бюрократия, а дисциплинированные люди, которые думают и действуют дисциплинированно в рамках свободы. Самое трудное в этом — дисциплина отказа: списки «перестать делать» у великих компаний были важнее списков дел."],
   ["Маховик, а не волшебная кнопка", "Снаружи переход выглядел как внезапный прорыв, но изнутри — как долгое последовательное раскручивание тяжёлого маховика в одну сторону. Неудачники, наоборот, метались: новая стратегия, новый директор, слияние, реорганизация — каждый раз маховик останавливался."]
  ],
  apply: ["Назовите людей, которых вы бы взяли в команду снова, и тех, кого нет. Что вы делаете со вторыми?", "Нарисуйте три круга концепции ежа для своего бизнеса. Что не попадает в пересечение?", "Составьте список «перестать делать» из трёх пунктов."],
  limits: "Часть «великих» компаний из книги позже упала (например, Circuit City обанкротилась, Fannie Mae оказалась в центре кризиса 2008 года). Критики говорят об ошибке выжившего: выводы подобраны задним числом. Читайте книгу как набор сильных гипотез, а не законов природы.",
  keep: "Сначала правильные люди, потом правильное направление: с ними маршрут найдётся.",
  quiz: [["Что отличает лидера пятого уровня?", ["Харизма и известность", "Скромность плюс железная воля к результату", "Жёсткий контроль", "Опыт в консалтинге"], 1, "Успех — команде, провал — себе."],
   ["Что такое парадокс Стокдейла?", ["Верить, что всё скоро наладится", "Признавать жестокую реальность и верить в победу", "Не замечать проблем", "Отказаться от целей"], 1, "Оптимисты, ждавшие «к Рождеству», не выжили."],
   ["Концепция ежа — это пересечение…", ["Цены, качества и сроков", "Лучшего в мире, экономического двигателя и страсти", "Рынка, продукта и маркетинга", "Прибыли, выручки и затрат"], 1, "Всё вне пересечения отбрасывали."]] },

{ t: "Государь", a: "Никколо Макиавелли", y: 1532, cat: "power", min: 13,
  about: "Флорентийский чиновник, отстранённый от дел и сосланный в деревню, написал короткое пособие о том, как правитель получает власть и удерживает её. Впервые в европейской мысли о политике рассуждали не так, как должно быть, а так, как есть.",
  why: "Пятьсот лет «Государь» остаётся самым честным текстом о власти. Он объясняет, почему хорошие намерения проигрывают без силы и расчёта, и учит видеть мотивы людей и организаций трезво.",
  ideas: [

{ t: "Как завоёвывать друзей и оказывать влияние на людей", a: "Дейл Карнеги", y: 1936, cat: "infl", min: 11,

{ t: "Думай медленно… решай быстро", a: "Даниэль Канеман", y: 2011, cat: "mind", min: 14,
  about: "Нобелевский лауреат по экономике, психолог, подводит итог полувека исследований того, как люди на самом деле принимают решения. Главный вывод: наше мышление состоит из двух систем, и та, которой мы гордимся, работает гораздо реже, чем нам кажется.",
  why: "Руководитель — это прежде всего человек, принимающий решения в условиях неопределённости. Канеман показывает систематические ошибки, которые совершают все, включая экспертов, и как их ловить.",
  ideas: [
   ["Две системы мышления", "Система 1 — быстрая, автоматическая, интуитивная: узнать лицо, сложить 2+2, почувствовать опасность. Система 2 — медленная, требует усилий: умножить 17 на 24, сравнить два договора. Система 2 ленива и часто просто одобряет предложения Системы 1. Поэтому мы уверенно ошибаемся, не замечая этого."],
   ["Якорение", "Первое услышанное число тянет оценку к себе, даже если оно случайное. В экспериментах судьи давали более суровые приговоры после того, как бросали кубики с большими числами. В переговорах тот, кто первым называет цифру, задаёт якорь. Защита — заранее иметь свою опорную цифру."],
   ["Доступность", "Мы оцениваем вероятность событий по тому, насколько легко вспоминаются примеры. После громкой новости об авиакатастрофе люди боятся летать, хотя риск не изменился. Руководитель переоценивает то, о чём недавно говорили на совещании, и недооценивает тихие системные риски."],
   ["Что видишь, то и есть", "Система 1 строит связную историю из той информации, что есть, и не думает о том, чего не хватает. Отсюда уверенность при недостатке данных. Полезный вопрос: «Что мне нужно было бы знать, чтобы изменить мнение?»"],
   ["Неприятие потерь", "Потеря ощущается примерно вдвое сильнее, чем выигрыш того же размера. Поэтому люди держатся за убыточные проекты (жалко вложенного) и отказываются от выгодных рисков. «Невозвратные затраты» не должны влиять на решение о будущем."],
   ["Ошибка планирования и взгляд снаружи", "Проекты почти всегда занимают больше времени и денег, чем планировалось, потому что мы смотрим «изнутри» на свой уникальный план. Лекарство — «взгляд снаружи»: найти похожие проекты и посмотреть на их реальные сроки и бюджеты. Канеман сам потратил на учебник восемь лет вместо двух."],
   ["Премортем", "Перед важным решением соберите команду и скажите: «Представьте, что прошёл год и проект провалился. Напишите, почему». Это легализует сомнения и выявляет риски, о которых в обычном обсуждении молчат."]

  apply: ["Перед ближайшими переговорами запишите свою опорную цифру до того, как услышите чужую.", "Проведите премортем для одного текущего проекта: 10 минут, «почему он провалился».", "Найдите проект, который вы продолжаете, потому что «жалко вложенного». Решите по будущему, а не по прошлому."],

   ["Как защититься от якоря в переговорах?", ["Всегда соглашаться", "Заранее иметь свою опорную цифру", "Не называть цифр вообще", "Спрашивать у коллег"], 1, "Якорь работает, даже если он случайный."],

{ t: "Переговоры без поражения", a: "Роджер Фишер, Уильям Юри", y: 1981, cat: "infl", min: 12,

   ["Социальное доказательство", "В неопределённости мы смотрим, что делают другие. Отсюда «самый популярный тариф» и отзывы. Сильнее всего действует пример похожих на нас людей."],

   ["Минимально жизнеспособный продукт (MVP)", "MVP — самая простая версия, позволяющая проверить ключевую гипотезу с минимумом усилий. Это может быть даже не продукт: основатели Dropbox сделали короткое видео о том, как будет работать сервис, и получили десятки тысяч заявок ещё до запуска."],

  apply: ["Сформулируйте главную гипотезу нового проекта одной фразой: «Мы считаем, что [клиенты] будут [делать], потому что [причина]».", "Придумайте самый дешёвый способ проверить её за неделю, без разработки продукта.", "Замените в отчёте одну метрику тщеславия на действенную."],

{ t: "От нуля к единице", a: "Питер Тиль", y: 2014, cat: "strat", min: 11,

  apply: ["Ответьте письменно: какая важная истина о вашей отрасли, с которой мало кто согласен?", "Определите нишу, где вы можете стать безусловным лидером, а не одним из многих.", "Распишите, как именно клиент узнаёт о вас и сколько стоит его привлечь."],

   ["Правило двух минут — это…", ["Отдыхать каждые 2 минуты", "Если дело короче двух минут, сделать сразу", "Тратить 2 минуты на планирование", "Звонить не дольше 2 минут"], 1, "Отслеживать дольше, чем сделать."],
   ["Без чего система GTD разваливается?", ["Без приложения", "Без еженедельного обзора", "Без помощника", "Без бумаги"], 1, "Обзор делает списки надёжными."]] },
/*END_BOOKS*/
];

/* ======================= ХРАНЕНИЕ ======================= */
const APP = "books";
const KEY = "book-of-day-v1";
const Store = {
  data: { read: {}, notes: {}, quiz: {}, days: {}, updatedAt: 0 }, server: false, mode: "local", _timer: null, _chain: Promise.resolve(),
  loadLocal() { try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) this.data = Object.assign(this.data, s); } catch (e) {} },
  async initServer() {
    if (!/^https?:$/.test(location.protocol) || /github\.io|claude\.ai|claudeusercontent/.test(location.hostname)) return false;
    try {
      const r = await fetch("api/progress/" + APP, { cache: "no-store" }); if (!r.ok) return false;
      const remote = await r.json();
      if (remote && (remote.updatedAt || 0) > (this.data.updatedAt || 0)) this.data = Object.assign({}, this.data, remote);
      this.server = true; this.mode = "server"; renderAll(); return true;
    } catch (e) { return false; }
  },
  save() {
    this.data.updatedAt = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) {}
    if (!this.server) return;
    clearTimeout(this._timer);
    this._timer = setTimeout(() => { const body = JSON.stringify(this.data); this._chain = this._chain.then(() => fetch("api/progress/" + APP, { method: "PUT", headers: { "Content-Type": "application/json" }, body })).catch(() => {}); }, 1000);
  }
};

/* ======================= УТИЛИТЫ ======================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const DAY = 86400000;
const START = new Date(2026, 9, 21);
const todayKey = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const readMin = b => Math.max(2, Math.round([b.about, b.why, ...b.ideas.flat(), ...b.apply, b.limits, b.keep].join(" ").split(/\s+/).length / 120));
const yearText = y => y < 0 ? "около " + Math.abs(y) + " г. до н. э." : y + " г.";
function todayIndex() { return ((Math.floor((Date.now() - START) / DAY) % BOOKS.length) + BOOKS.length) % BOOKS.length; }
function readCount() { return Object.keys(Store.data.read).length; }
function streak() {
  let n = 0; const d = new Date();
  for (;;) { const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); if (Store.data.days[k]) { n++; d.setDate(d.getDate() - 1); } else break; }
  return n;
}
function updateChips() { $("#chip-read b").textContent = readCount() + " из " + BOOKS.length; $("#chip-streak b").textContent = streak(); }

/* ======================= ОЗВУЧКА ======================= */
let ruVoice = null, speaking = false;
function pickVoice() { const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || []; const ru = vs.filter(v => /^ru/i.test(v.lang)); ruVoice = ru.find(v => /natural|online|milena|svetlana|dmitry/i.test(v.name)) || ru[0] || null; }
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function bookText(b) {
  return [b.t + ". " + b.a + ".", b.about, b.why, ...b.ideas.map(i => i[0] + ". " + i[1]), "Что сделать сегодня. " + b.apply.join(" "), "Ограничения. " + b.limits, "Главная мысль. " + b.keep].join("\n");
}
function speakBook(b, btn) {
  if (!window.speechSynthesis) { btn.textContent = "Озвучка недоступна"; return; }
  if (speaking) { speechSynthesis.cancel(); speaking = false; btn.textContent = "▶ Слушать"; return; }
  speechSynthesis.cancel();
  const parts = bookText(b).split("\n").flatMap(p => p.match(/[^.!?]+[.!?]+/g) || [p]);
  let i = 0; speaking = true; btn.textContent = "■ Остановить";
  const next = () => {
    if (!speaking || i >= parts.length) { speaking = false; btn.textContent = "▶ Слушать"; return; }
    const u = new SpeechSynthesisUtterance(parts[i++]); u.lang = "ru-RU"; if (ruVoice) u.voice = ruVoice; u.rate = 1;
    u.onend = next; u.onerror = () => { speaking = false; btn.textContent = "▶ Слушать"; };
    speechSynthesis.speak(u);
  };
  next();
}

/* ======================= ВКЛАДКИ ======================= */
const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
let openIdx = null;
function openTab(id) {
  tabs.forEach(t => { const on = t.id === id; t.setAttribute("aria-selected", on); $("#" + t.getAttribute("aria-controls")).hidden = !on; });
  if (speaking) { speechSynthesis.cancel(); speaking = false; }
  if (id === "tab-lib") renderLib(); if (id === "tab-stats") renderStats(); if (id === "tab-today") renderToday();
  window.scrollTo(0, 0);
}
tabs.forEach(t => t.addEventListener("click", () => { if (t.id === "tab-today") openIdx = null; openTab(t.id); }));

/* ======================= КНИГА ======================= */
function renderToday() {
  const idx = openIdx == null ? todayIndex() : openIdx;
  const b = BOOKS[idx], key = String(idx), isToday = openIdx == null, done = !!Store.data.read[key];
  const qs = Store.data.quiz[key] || {};
  $("#p-today").innerHTML = `
    <div class="book-head"><div class="kicker">${isToday ? "Книга дня · " + new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "long" }) : "Книга " + (idx + 1) + " из " + BOOKS.length} · ${esc(CATS[b.cat])}</div>
      <h2 class="book-title">${esc(b.t)}</h2>
      <div class="book-meta">${esc(b.a)} · ${yearText(b.y)} · ${readMin(b)} мин чтения</div>
      <div class="row" style="margin-top:12px"><button class="btn" id="b-say">▶ Слушать</button>${done ? '<span class="done">✓ Прочитано</span>' : ""}</div></div>
    <div class="read">
      <p>${esc(b.about)}</p>
      <div class="sec">Почему её читают руководители</div><p>${esc(b.why)}</p>
      <div class="sec">Главные идеи</div>
      ${b.ideas.map(([h, t]) => `<div class="idea"><h3>${esc(h)}</h3><p>${esc(t)}</p></div>`).join("")}
      <div class="sec">Что сделать сегодня</div><ol class="apply">${b.apply.map(a => `<li>${esc(a)}</li>`).join("")}</ol>
      <div class="sec">Где книга ошибается или устарела</div><p>${esc(b.limits)}</p>
      <div class="sec">Одна мысль, чтобы запомнить</div><div class="keep">${esc(b.keep)}</div>
    </div>
    <div class="sec">Проверьте себя</div>
    <div class="card">${b.quiz.map((q, qi) => `<div class="q">${qi + 1}. ${esc(q[0])}</div><div class="opts" data-q="${qi}">${q[1].map((o, oi) => `<button data-o="${oi}" class="${qs[qi] != null ? (oi === q[2] ? "right" : oi === qs[qi] ? "wrong" : "") : ""}" ${qs[qi] != null ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div><div class="explain" id="qe-${qi}">${qs[qi] != null ? esc(q[3]) : ""}</div>`).join("")}</div>
    <div class="sec">Мои заметки</div>
    <textarea class="notes" id="b-notes" placeholder="Что взять в работу, с чем не согласны, кому посоветовать">${esc(Store.data.notes[key] || "")}</textarea>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="b-done" ${done ? "disabled" : ""}>${done ? "Прочитано" : "Отметить прочитанной"}</button>
      ${isToday ? "" : '<button class="btn" id="b-back">← К книге дня</button>'}
      <button class="btn" id="b-next">Следующая книга →</button></div>`;
  $("#b-say").onclick = e => speakBook(b, e.currentTarget);
  let noteTimer;
  $("#b-notes").oninput = e => { clearTimeout(noteTimer); noteTimer = setTimeout(() => { Store.data.notes[key] = e.target.value; Store.save(); }, 600); };
  document.querySelectorAll(".opts").forEach(box => box.querySelectorAll("button").forEach(btn => btn.onclick = () => {
    const qi = +box.dataset.q, oi = +btn.dataset.o, q = b.quiz[qi];
    (Store.data.quiz[key] || (Store.data.quiz[key] = {}))[qi] = oi; Store.save();
    box.querySelectorAll("button").forEach(x => { x.disabled = true; if (+x.dataset.o === q[2]) x.classList.add("right"); });
    if (oi !== q[2]) btn.classList.add("wrong");
    $("#qe-" + qi).textContent = (oi === q[2] ? "Верно. " : "Не совсем. ") + q[3];
  }));
  $("#b-done").onclick = () => { Store.data.read[key] = Date.now(); Store.data.days[todayKey()] = true; Store.save(); updateChips(); renderToday(); };
  const back = $("#b-back"); if (back) back.onclick = () => { openIdx = null; renderToday(); window.scrollTo(0, 0); };
  $("#b-next").onclick = () => { openIdx = (idx + 1) % BOOKS.length; renderToday(); window.scrollTo(0, 0); };
}

/* ======================= БИБЛИОТЕКА ======================= */
let libCat = "all";
function renderLib() {
  const p = $("#p-lib");
  const list = BOOKS.map((b, i) => [b, i]).filter(([b]) => libCat === "all" || b.cat === libCat);
  p.innerHTML = `<p class="lead">${BOOKS.length} книг. Каждый день приложение предлагает следующую, но любую можно открыть здесь.</p>
    <div class="filters" role="group" aria-label="Темы"><button data-c="all" aria-pressed="${libCat === "all"}">Все</button>${Object.entries(CATS).map(([k, v]) => `<button data-c="${k}" aria-pressed="${libCat === k}">${v}</button>`).join("")}</div>
    <div class="lib">${list.map(([b, i]) => `<button data-i="${i}"><span class="n">${i + 1}</span><span><span class="t">${esc(b.t)}</span><br><span class="a">${esc(b.a)} · ${yearText(b.y)} · ${esc(CATS[b.cat])}</span></span>${Store.data.read[i] ? '<span class="done">✓</span>' : `<span class="note">${readMin(b)} мин</span>`}</button>`).join("")}</div>`;
  p.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { libCat = b.dataset.c; renderLib(); });
  p.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { openIdx = +b.dataset.i; openTab("tab-today"); });
}

/* ======================= ПРОГРЕСС ======================= */
function renderStats() {
  const byCat = Object.entries(CATS).map(([k, v]) => { const all = BOOKS.map((b, i) => [b, i]).filter(([b]) => b.cat === k); return [v, all.filter(([, i]) => Store.data.read[i]).length, all.length]; });
  const quizRight = Object.entries(Store.data.quiz).reduce((a, [k, ans]) => a + Object.entries(ans).filter(([qi, oi]) => BOOKS[k] && BOOKS[k].quiz[qi] && BOOKS[k].quiz[qi][2] === oi).length, 0);
  const quizAll = Object.values(Store.data.quiz).reduce((a, ans) => a + Object.keys(ans).length, 0);
  const noted = Object.values(Store.data.notes).filter(t => t && t.trim()).length;
  $("#p-stats").innerHTML = `<div class="stats">
    <div class="card stat"><div class="v">${readCount()}</div><div class="l">книг прочитано из ${BOOKS.length}</div></div>
    <div class="card stat"><div class="v">${streak()}</div><div class="l">дней подряд</div></div>
    <div class="card stat"><div class="v">${quizAll ? quizRight + "/" + quizAll : "—"}</div><div class="l">верных ответов в проверках</div></div>
    <div class="card stat"><div class="v">${noted}</div><div class="l">книг с заметками</div></div></div>
    <div class="lib">${byCat.map(([n, r, a]) => `<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(n)}</b><span class="note">${r} / ${a}</span></div><div class="bar" style="margin-top:8px"><i style="width:${a ? r / a * 100 : 0}%"></i></div></div>`).join("")}</div>
    <p class="note" style="margin-top:16px">Прогресс и заметки хранятся в этом телефоне или браузере.</p>`;
}

/* ======================= ЗАПУСК ======================= */
function renderAll() { renderToday(); renderLib(); updateChips(); if (!$("#p-stats").hidden) renderStats(); }
Store.loadLocal();
renderAll();
Store.initServer();
</script>
</body></html>
